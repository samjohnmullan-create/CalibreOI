1fr;gap:12mm;align-items:end}.sign-line{border-top:1px solid #927a54;padding-top:2mm;font-family:Inter,sans-serif;font-size:8px;color:#6a665f}.cert-disclaimer{font-family:Inter,sans-serif;font-size:6.7px;line-height:1.4;color:#777168;text-align:right}
.passport-cover{padding:16mm;background:linear-gradient(145deg,#11161a 0%,#1c2328 58%,#28323a 100%);color:#f4efe4}.passport-cover:after{content:"";position:absolute;inset:8mm;border:1px solid rgba(190,157,99,.55);pointer-events:none}.pass-brand{display:flex;justify-content:space-between;align-items:center}.pass-brand img{width:48px;height:48px;border-radius:50%;object-fit:cover}.pass-brand-text{font-family:Inter,sans-serif;text-align:right;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#c7aa77}.pass-cover-main{position:absolute;left:18mm;right:18mm;top:66mm}.pass-kicker{font-family:Inter,sans-serif;color:#c7aa77;text-transform:uppercase;letter-spacing:.24em;font-size:9px;font-weight:800}.pass-cover-main h1{font-size:46px;font-weight:400;line-height:1.02;margin:6mm 0 4mm;max-width:155mm}.pass-cover-main p{font-family:Inter,sans-serif;font-size:11px;color:#c7c6c0;margin:0}.pass-cover-details{position:absolute;left:18mm;right:18mm;top:165mm;border-top:1px solid rgba(199,170,119,.7);border-bottom:1px solid rgba(199,170,119,.35);padding:8mm 0;display:grid;grid-template-columns:1fr 1fr;gap:6mm 12mm;font-family:Inter,sans-serif}.pass-cover-detail span{display:block;color:#c7aa77;text-transform:uppercase;letter-spacing:.14em;font-size:7px;font-weight:800;margin-bottom:1.5mm}.pass-cover-detail strong{display:block;color:#f4efe4;font-size:11px;font-weight:600}.pass-cover-id{position:absolute;left:18mm;bottom:16mm;font-family:Inter,sans-serif;font-size:8px;letter-spacing:.1em;color:#c7aa77}.passport-page{padding:16mm 17mm 16mm}.pass-page-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #b99c6d;padding-bottom:4mm;margin-bottom:7mm}.pass-page-title{font-size:24px;font-weight:400;margin:0}.pass-page-no{font-family:Inter,sans-serif;font-size:8px;color:#8e7144;letter-spacing:.12em;text-transform:uppercase}.pass-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10mm}.pass-section{margin-bottom:8mm}.pass-section h3{font-family:Inter,sans-serif;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8e7144;margin:0 0 3mm}.spec-row{display:grid;grid-template-columns:37mm minmax(0,1fr);gap:4mm;padding:2.2mm 0;border-bottom:1px solid #ded5c3;font-size:10px;line-height:1.35}.spec-row span{font-family:Inter,sans-serif;color:#6d695f;font-size:8px;text-transform:uppercase;letter-spacing:.06em}.spec-row strong{font-weight:400}.pass-prose{font-size:10.5px;line-height:1.65;margin:0;white-space:pre-wrap}.service-box{border:1px solid #b99c6d;padding:5mm 6mm;background:#f9f5ec;margin-bottom:5mm}.service-box h4{font-family:Inter,sans-serif;font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:#8e7144;margin:0 0 2mm}.service-box p{font-size:10px;line-height:1.55;margin:0}.timing-table{width:100%;border-collapse:collapse;font-family:Inter,sans-serif;font-size:8px}.timing-table th{text-align:left;color:#8e7144;text-transform:uppercase;letter-spacing:.08em;font-size:7px;border-bottom:1px solid #b99c6d;padding:2mm 1mm}.timing-table td{border-bottom:1px solid #ded5c3;padding:2.2mm 1mm}.pass-footer{position:absolute;left:17mm;right:17mm;bottom:10mm;display:flex;justify-content:space-between;font-family:Inter,sans-serif;font-size:6.5px;color:#777168}.passport-legal{font-family:Inter,sans-serif;font-size:7px;line-height:1.5;color:#716b63;border-top:1px solid #cbb991;padding-top:3mm;margin-top:7mm}
@media(max-width:850px){.preview-wrap{justify-content:start}.paper{transform-origin:top left;transform:scale(.72);margin-right:-58mm;margin-bottom:-82mm}.paper+.paper{margin-top:18px}}
@media(max-width:600px){.paper{transform:scale(.49);margin-right:-107mm;margin-bottom:-151mm}.paper+.paper{margin-top:18px}.doc-toolbar{align-items:stretch}.doc-actions{width:100%}.doc-actions .btn{flex:1}}

  @page{size:A4;margin:0}
  html,body{background:#fff!important;margin:0!important;padding:0!important}

  .shell{max-width:none!important;margin:0!important;padding:0!important}
  .preview-wrap{display:block!important;padding:0!important;overflow:visible!important}
  .paper{width:210mm!important;min-height:297mm!important;height:297mm!important;box-shadow:none!important;transform:none!important;margin:0!important;page-break-after:always;break-after:page}
  .paper:last-child{page-break-after:auto;break-after:auto}
  body.print-certificate .passport-doc{display:none!important}
  body.print-passport .certificate-doc{display:none!important}
}
</style></head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"></nav>
<div class="doc-toolbar no-print"><div class="doc-switch"><button id="showCertificate" class="on" type="button">Certificate</button><button id="showPassport" type="button">Customer passport</button></div><div class="doc-actions"><button id="printBtn" class="btn" type="button">Print / Save PDF</button><button id="editOwner" class="btn secondary" type="button">Customer details</button></div></div>
<p class="doc-note no-print">These documents are generated from the current Calibre watch record. Review the preview before issuing it to a customer. Identification wording follows the confidence recorded in the Passport.</p>
<div id="preview" class="preview-wrap"><p class="muted">Loading current watch…</p></div>
<p id="statusText" class="muted small no-print"></p>
</div>
<script src="js/nav.js?v=51"></script>
<script type="module">
import { loadState, saveState, current, coverPhoto, PHOTO_SLOTS, escapeHtml } from "./js/store.js?v=26";
const $=id=>document.getElementById(id),esc=escapeHtml;
const val=v=>v==null||String(v).trim()===""?"—":esc(String(v));
const raw=v=>v==null?"":String(v).trim();
const first=(...vals)=>vals.map(raw).find(Boolean)||"";
const fmtDate=v=>{if(!v)return new Date().toLocaleDateString("en-AU",{day:"2-digit",month:"long",year:"numeric"});const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString("en-AU",{day:"2-digit",month:"long",year:"numeric"});};
const rateOf=r=>{const n=Number(r?.rateSecondsPerDay??r?.rate);return Number.isFinite(n)?n:null;};
const spec=(k,v)=>raw(v)?`<div class="spec-row"><span>${esc(k)}</span><strong>${esc(String(v))}</strong></div>`:"";
let mode="certificate",state,job,owner={name:"",note:""};
try{
 state=await loadState();job=current(state);
 if(!job)throw new Error("No watch is open. Choose a watch from Home first.");
 job.documents=job.documents||{};owner=job.documents.customer||owner;
 paint();
}catch(err){$("preview").innerHTML=`<section class="card"><p class="muted">${esc(err?.message||"Document could not load.")}</p></section>`;}
function photoByLabel(words){for(const [key,label] of PHOTO_SLOTS){if(words.some(w=>String(label).toLowerCase().includes(w))){const src=job.photos?.[key]?.[0];if(src)return {src,label};}}return null;}
function hero(){const src=coverPhoto(job);return src?`<img src="${src}" alt="">`:`<div class="cert-placeholder">No primary watch photo</div>`;}
function confidenceText(p){const c=first(p.confidence,p.identityConfidence,"Recorded");return c.charAt(0).toUpperCase()+c.slice(1);}
function workSummary(){const bits=[];if(raw(job.decision))bits.push(job.decision);if(raw(job.repairPerformed))bits.push(job.repairPerformed);if(!bits.length&&raw(job.diagnosis))bits.push("Inspection / diagnosis recorded");return bits.join(" - ")||"Workshop record available in Calibre.";}
function latestTiming(){const runs=(job.timingRuns||[]).filter(r=>rateOf(r)!=null);return runs.length?runs[runs.length-1]:null;}
function certificateHTML(){const p=job.passport||{},run=latestTiming(),rate=rateOf(run),issue=fmtDate(job.documents?.issuedAt||new Date()),certNo=first(job.jobId,job.id).toUpperCase();const name=job.watchName||[p.maker,p.model].filter(Boolean).join(" ")||"Vintage Watch";const idLine=[p.maker,p.model,p.year].filter(Boolean).join(" · ");const timing=rate==null?"No final timing recorded":`${rate>=0?"+":""}${rate.toFixed(1)} s/day${run?.position?` · ${run.position}`:""}${run?.bph?` · ${run.bph} BPH`:""}`;const holder=raw(owner.name)?`Prepared for ${esc(owner.name)}`:"Issued with the Calibre & Co. workshop record";return `<section class="paper certificate certificate-doc">
<div class="cert-top"><div class="doc-logo"><img src="assets/mark.png?v=5" alt=""><div><div class="doc-brand">Calibre & Co.</div><div class="doc-subbrand">Vintage Watch Record</div></div></div><div class="cert-number"><div>Certificate / Record</div><strong class="mono">${esc(certNo)}</strong><div>${esc(issue)}</div></div></div>
<div class="cert-title"><div class="caps">Watch Certificate</div><h1>Identification & Service Record</h1><p>${holder}</p></div>
<div class="rule"></div>
<div class="cert-watch"><div class="cert-hero">${hero()}</div><div><div class="caps">Recorded Watch</div><h2>${esc(name)}</h2><p class="muted-print" style="font-size:11px;margin:0 0 6mm">${esc(idLine||"Vintage mechanical watch")}</p><div class="cert-meta">
<div class="cert-field"><span>Maker</span><strong>${val(p.maker)}</strong></div><div class="cert-field"><span>Model</span><strong>${val(p.model)}</strong></div>
<div class="cert-field"><span>Calibre</span><strong>${val(p.calibre)}</strong></div><div class="cert-field"><span>Jewels</span><strong>${val(p.jewels)}</strong></div>
<div class="cert-field"><span>Approx. year</span><strong>${val(p.year)}</strong></div><div class="cert-field"><span>Serial / case no.</span><strong>${val(first(p.serial,p.caseNumber))}</strong></div>
</div></div></div>
<div class="cert-statement">Calibre & Co. records this watch with an identification confidence of <strong>${esc(confidenceText(p))}</strong>. The details below reflect the watch and workshop information held in its Calibre record on the date of issue.</div>
<div class="cert-work"><div><h3>Workshop record</h3><p>${esc(workSummary())}</p></div><div><h3>Final recorded timing</h3><p>${esc(timing)}</p></div></div>
${raw(owner.note)?`<div class="cert-work" style="grid-template-columns:1fr;margin-top:7mm"><div><h3>Customer note</h3><p>${esc(owner.note)}</p></div></div>`:""}
<div class="cert-footer"><div class="sign-line">Calibre & Co. · Workshop record · ${esc(issue)}</div><div class="cert-disclaimer">This is a Calibre & Co. identification and service record, not a manufacturer-issued certificate of authenticity. Vintage-watch identification may include estimated or probable information where stated.</div></div>
</section>`;}
function passportHTML(){const p=job.passport||{},issue=fmtDate(job.documents?.issuedAt||new Date()),name=job.watchName||[p.maker,p.model].filter(Boolean).join(" ")||"Vintage Watch",pid=first(job.jobId,job.id).toUpperCase();const runs=(job.timingRuns||[]).filter(r=>rateOf(r)!=null).slice(-8);const hist=first(p.history,p.research,p.researchHistory,p.notes,"No extended history has been added to this passport yet.");const provenance=[p.auctionHouse&&`Auction: ${p.auctionHouse}`,p.lot&&`Lot: ${p.lot}`,p.auctionDate&&`Date: ${p.auctionDate}`,p.seller&&`Seller: ${p.seller}`].filter(Boolean).join(" · ");const country=first(p.country,p.movementCountry);const caseDesc=[p.caseStyle,p.caseMaterial].filter(Boolean).join(" · ");const movementDesc=[p.movementMaker,p.calibre].filter(Boolean).join(" · ");return `<div class="passport-doc">
<section class="paper passport-cover"><div class="pass-brand"><img src="assets/mark.png?v=5" alt=""><div class="pass-brand-text">Calibre & Co.<br>Watch Passport</div></div><div class="pass-cover-main"><div class="pass-kicker">Customer Watch Passport</div><h1>${esc(name)}</h1><p>${esc([p.maker,p.model,p.year].filter(Boolean).join(" · ")||"A documented vintage watch")}</p></div><div class="pass-cover-details"><div class="pass-cover-detail"><span>Passport</span><strong>${esc(pid)}</strong></div><div class="pass-cover-detail"><span>Issued</span><strong>${esc(issue)}</strong></div><div class="pass-cover-detail"><span>Calibre</span><strong>${val(p.calibre)}</strong></div><div class="pass-cover-detail"><span>Identification</span><strong>${esc(confidenceText(p))}</strong></div>${raw(owner.name)?`<div class="pass-cover-detail" style="grid-column:1/-1"><span>Prepared for</span><strong>${esc(owner.name)}</strong></div>`:""}</div><div class="pass-cover-id">CALIBRE & CO. · VINTAGE WATCH RECORD</div></section>
<section class="paper passport-page"><div class="pass-page-head"><h2 class="pass-page-title">Identity & Specification</h2><div class="pass-page-no">Passport ${esc(pid)} · 02</div></div><div class="pass-grid"><div><div class="pass-section"><h3>Watch identity</h3>${spec("Maker",p.maker)}${spec("Model",p.model)}${spec("Country",country)}${spec("Approx. year",p.year)}${spec("Identity confidence",confidenceText(p))}${spec("Dial markings",p.dialMarkings)}${spec("Complications",p.complications)}</div><div class="pass-section"><h3>Movement</h3>${spec("Manufacturer",p.movementMaker)}${spec("Calibre",p.calibre)}${spec("Family",p.movementFamily)}${spec("Jewels",p.jewels)}${spec("Movement type",p.movementType)}${spec("Escapement",p.escapement)}${spec("Beat rate",first(p.beatRate,p.bph))}${spec("Power reserve",p.powerReserve)}${spec("Movement serial",p.serial)}</div></div><div><div class="pass-section"><h3>Case</h3>${spec("Case",caseDesc)}${spec("Case number",p.caseNumber)}${spec("Reference",p.reference)}${spec("Caseback",p.caseback)}${spec("Crystal",p.crystal)}${spec("Crown",p.crown)}${spec("Width",p.width)}${spec("Thickness",p.thickness)}${spec("Lug width",p.lugWidth)}${spec("Water resistance marks",p.waterResistance)}</div><div class="pass-section"><h3>Marks & provenance</h3>${spec("Hallmarks",p.hallmarks)}${spec("Engravings",p.engravings)}${spec("Provenance",provenance)}${spec("Original listing",p.originalListing)}</div></div></div><div class="pass-footer"><span>Calibre & Co. · Watch Passport</span><span>${esc(pid)}</span></div></section>
<section class="paper passport-page"><div class="pass-page-head"><h2 class="pass-page-title">History & Workshop Record</h2><div class="pass-page-no">Passport ${esc(pid)} · 03</div></div><div class="pass-section"><h3>Research & history</h3><p class="pass-prose">${esc(hist)}</p></div><div class="pass-grid"><div class="pass-section"><h3>Assessment</h3><div class="service-box"><h4>Diagnosis</h4><p>${val(job.diagnosis)}</p></div><div class="service-box"><h4>Service decision</h4><p>${val(job.decision)}</p></div></div><div class="pass-section"><h3>Work completed</h3><div class="service-box"><h4>Workshop record</h4><p>${val(job.repairPerformed||workSummary())}</p></div>${raw(owner.note)?`<div class="service-box"><h4>Customer note</h4><p>${esc(owner.note)}</p></div>`:""}</div></div>
<div class="pass-section"><h3>Recorded timing</h3>${runs.length?`<table class="timing-table"><thead><tr><th>Phase</th><th>Position</th><th>Rate</th><th>BPH</th><th>Beat error</th></tr></thead><tbody>${runs.map(r=>{const n=rateOf(r);return `<tr><td>${val(r.phase)}</td><td>${val(r.position)}</td><td>${n>=0?"+":""}${n.toFixed(1)} s/day</td><td>${val(r.bph)}</td><td>${val(r.beatError)}</td></tr>`;}).join("")}</tbody></table>`:`<p class="pass-prose muted-print">No timing runs are recorded in this passport.</p>`}</div>
<div class="passport-legal">This passport is a Calibre & Co. record assembled from inspection, research and workshop information held for this watch. Approximate dates, probable identifications and other uncertain details should be read together with the recorded identification confidence. It is not a manufacturer-issued warranty or certificate of authenticity.</div><div class="pass-footer"><span>${raw(owner.name)?`Prepared for ${esc(owner.name)}`:"Calibre & Co. customer record"}</span><span>${esc(issue)}</span></div></section>
</div>`;}
function paint(){if(!job)return;$("preview").innerHTML=mode==="certificate"?certificateHTML():passportHTML();$("showCertificate").classList.toggle("on",mode==="certificate");$("showPassport").classList.toggle("on",mode==="passport");}
$("showCertificate").onclick=()=>{mode="certificate";paint();};
$("showPassport").onclick=()=>{mode="passport";paint();};
$("printBtn").onclick=()=>{if(!job)return;document.body.classList.remove("print-certificate","print-passport");document.body.classList.add(mode==="certificate"?"print-certificate":"print-passport");window.print();setTimeout(()=>document.body.classList.remove("print-certificate","print-passport"),500);};
$("editOwner").onclick=async()=>{if(!job)return;const name=prompt("Customer / owner name",owner.name||"");if(name===null)return;const note=prompt("Optional customer-facing note",owner.note||"");if(note===null)return;owner={name:name.trim(),note:note.trim()};job.documents=job.documents||{};job.documents.customer=owner;job.documents.issuedAt=job.documents.issuedAt||new Date().toISOString();await saveState(state);paint();$("statusText").textContent="Customer document details saved.";};
</script></body></html>
