<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calibre & Co. — Vintage Watches</title>
<meta name="description" content="Calibre & Co. vintage watch catalogue.">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div class="wrap">
<header class="site-head">
  <a class="brand" href="index.html" aria-label="Calibre & Co. home"><img src="assets/calibre-horizontal-black.svg" alt="Calibre & Co."></a>
</header>
<main>
  <section class="catalogue-head" style="margin-top:44px">
    <div><h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(2.4rem,5vw,4.8rem);letter-spacing:-.045em">Watches</h1></div>
    <span id="count" class="count"></span>
  </section>
  <section class="toolbar" aria-label="Catalogue filters">
    <input id="q" type="search" placeholder="Search watches" aria-label="Search catalogue">
    <select id="status" aria-label="Filter catalogue"><option value="all">All published</option><option value="for_sale">For sale</option><option value="catalogue">Catalogue</option><option value="sold">Sold</option></select>
  </section>
  <section id="catalogue" class="catalogue"></section>
  <section id="empty" class="empty" hidden>No published watches.</section>
</main>
<footer class="footer"><img src="assets/calibre-mark-black.svg" alt=""><span>Calibre & Co.</span></footer>
</div>
<script type="module" src="js/catalogue.js"></script>
</body>
</html>
