<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reference Library · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=12"><style>
.ref-lib-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.ref-lib-stats{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:8px;margin:12px 0}.ref-lib-stat{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.ref-lib-stat strong{display:block;font-size:1.15rem}.ref-lib-stat span{font-size:.64rem;color:var(--muted)}.ref-lib-toolbar{display:grid;grid-template-columns:minmax(240px,1fr) 180px 180px 180px auto;gap:8px;align-items:end;margin:12px 0}.ref-lib-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}.ref-doc{display:grid;grid-template-columns:minmax(0,1.4fr) .75fr .75fr .6fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.ref-doc:first-child{border-top:0}.ref-doc h4{margin:0 0 3px;font-size:.8rem}.ref-doc-meta,.ref-doc small{font-size:.64rem;color:var(--muted)}.ref-doc-progress{height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:5px}.ref-doc-progress span{display:block;height:100%;background:var(--accent)}.ref-doc-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.ref-doc-actions .btn{min-height:30px;padding:5px 7px;font-size:.62rem}.ref-form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ref-form .wide{grid-column:1/-1}.ref-form-actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.empty{padding:18px 0;color:var(--muted)}@media(max-width:980px){.ref-lib-grid{grid-template-columns:1fr}.ref-lib-toolbar{grid-template-columns:1fr 1fr}.ref-lib-toolbar .search{grid-column:1/-1}.ref-lib-stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.ref-lib-stats{grid-template-columns:1fr 1fr}.ref-lib-toolbar{grid-template-columns:1fr}.ref-lib-toolbar .search{grid-column:auto}.ref-doc{grid-template-columns:1fr}.ref-doc-actions{justify-content:flex-start}.ref-form{grid-template-columns:1fr}.ref-form .wide,.ref-form-actions{grid-column:auto}}</style></head><body>
<div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Reference Library</h1></div></a></header><nav class="mainnav"></nav>
<section class="ref-lib-head"><div><div class="kicker">REFERENCE INTELLIGENCE</div><h2>Document library</h2><p class="muted small">The source catalogue behind Calibre’s compatibility evidence. Keep documents traceable; keep imported facts reviewable.</p></div><a class="btn secondary" href="suppliers.html">Open Parts intelligence</a></section>
<div id="refStats" class="ref-lib-stats"></div>
<section class="card ref-lib-toolbar"><label class="search">Search<input id="refSearch" placeholder="Maker, calibre, family, document…"></label><label>Source<select id="refSourceFilter"><option value="">All sources</option></select></label><label>Status<select id="refStatusFilter"><option value="">All statuses</option></select></label><label>Type<select id="refTypeFilter"><option value="">All types</option></select></label><button id="clearFilters" class="btn secondary" type="button">Clear</button></section>
<div class="ref-lib-grid"><main><section class="card"><div class="kicker">DOCUMENTS</div><div id="refDocuments"></div></section></main><aside><section class="card"><div class="kicker">ADD / EDIT</div><h3 id="formTitle">Add reference document</h3><div class="ref-form"><label class="wide">Title<input id="docTitle" placeholder="e.g. BestFit 111A Part 2"></label><label>Maker<input id="docMaker" placeholder="AS, ETA, FHF…"></label><label>Family<input id="docFamily" placeholder="1130 family"></label><label class="wide">Calibre range<input id="docCalibres" placeholder="AS 1130, 1130A, 1130B"></label><label>Source<select id="docSource"></select></label><label>Document type<select id="docType"></select></label><label>Year / era<input id="docEra" placeholder="c. 1960s"></label><label>Status<select id="docStatus"></select></label><label class="wide">Filename<input id="docFile" placeholder="Optional local filename"></label><label class="wide">Source URL<input id="docUrl" inputmode="url" placeholder="https://…"></label><label>Pages total<input id="docPagesTotal" type="number" min="0"></label><label>Pages processed<input id="docPagesProcessed" type="number" min="0"></label><label class="wide">Notes<textarea id="docNotes" rows="4"></textarea></label><div class="ref-form-actions"><button id="saveDoc" class="btn" type="button">Save document</button><button id="resetDoc" class="btn secondary" type="button">Reset</button><span id="docMsg" class="muted small"></span></div></div></section></aside></div>
</div><script src="js/nav.js?v=60"></script><script type="module" src="js/reference-library-ui.js?v=1"></script></body></html>
