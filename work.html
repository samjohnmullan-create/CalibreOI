<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Work · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=12"><style>
.work-context{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px}.work-photo{width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-weight:800;color:var(--muted)}.work-photo img{width:100%;height:100%;object-fit:cover}.work-context h2{margin:1px 0 3px}.work-context p{margin:0}.work-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:12px}.work-card{padding:16px}.work-card h3{margin:0 0 12px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wide{grid-column:1/-1}.work-status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.work-status-row>div{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--surface)}.work-status-row span{display:block;color:var(--muted);font-size:.64rem}.work-status-row strong{display:block;margin-top:3px}.work-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.work-actions .danger{margin-left:auto;color:var(--danger)}.work-section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.work-section:first-child{border-top:0;padding-top:0;margin-top:0}.stage-list{display:grid;gap:7px}.stage-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:8px}.stage-num{font-weight:900;color:var(--accent)}.stage-state{font-size:.68rem;color:var(--muted)}.empty{color:var(--muted);font-size:.78rem}.quick-links{display:flex;gap:7px;flex-wrap:wrap}.quick-links a{min-height:38px}@media(max-width:760px){.work-context{grid-template-columns:52px minmax(0,1fr)}.work-photo{width:52px;height:52px}.work-context .badge{grid-column:2;justify-self:start}.work-layout,.field-grid{grid-template-columns:1fr}.wide{grid-column:auto}.work-status-row{grid-template-columns:repeat(2,minmax(0,1fr))}.work-actions .danger{margin-left:0}.work-card{padding:13px}}
</style></head><body><div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Work</h1></div></a></header><nav class="mainnav"></nav>
<section class="work-context"><div id="itemPhoto" class="work-photo">W</div><div><div class="kicker">CURRENT ITEM</div><h2 id="itemName">Opening item…</h2><p id="itemMeta" class="muted small"></p></div><span id="workBadge" class="badge">Work</span></section>
<div class="work-status-row"><div><span>Status</span><strong id="statusSummary">—</strong></div><div><span>Next</span><strong id="nextSummary">—</strong></div><div><span>Blocker</span><strong id="blockerSummary">—</strong></div><div><span>Work ID</span><strong id="workIdSummary">—</strong></div></div>
<div class="work-layout"><main>
<section class="card work-card"><div class="work-section"><div class="kicker">WORK RECORD</div><h2 id="title">Opening work…</h2><div class="field-grid"><label>Type<select id="type"></select></label><label>Status<select id="status"></select></label><label class="wide">Title<input id="workTitle"></label><label>Opened<input id="openedAt" type="date"></label><label>Completed<input id="completedAt" type="date"></label><label class="wide">Diagnosis<textarea id="diagnosis" rows="4" placeholder="What is wrong, suspected, or confirmed?"></textarea></label><label class="wide">Work performed<textarea id="repairPerformed" rows="4" placeholder="What has been done?"></textarea></label><label class="wide">Outcome<textarea id="outcome" rows="3" placeholder="Result or current state"></textarea></label></div></div>
<div class="work-section"><h3>Decision & next action</h3><div class="field-grid"><label>Decision<input id="decision" placeholder="Full service, regulate only, inspect..."></label><label>Next action<input id="nextAction" placeholder="What should happen next?"></label><label class="wide">Blocker<input id="blocker" placeholder="Leave blank if nothing is blocking this work"></label></div></div>
<div class="work-section"><h3>Notes</h3><textarea id="notes" rows="4" placeholder="Workshop notes"></textarea></div>
<div class="work-actions"><button id="save" class="btn">Save work</button><button id="wait" class="btn secondary">Mark waiting</button><button id="complete" class="btn secondary">Complete</button><span id="msg" class="muted small"></span><button id="remove" class="btn secondary danger">Remove work</button></div></section>
</main><aside>
<section class="card work-card"><h3>Workflow</h3><div id="stages" class="stage-list"></div></section>
<section class="card work-card"><h3>Workshop evidence</h3><div class="field-grid"><label>Labour minutes<input id="labourMinutes" type="number" min="0" inputmode="numeric"></label><label>Direct cost<input id="cost" inputmode="decimal"></label><label class="wide">Materials / consumables<input id="materials"></label></div><p id="evidenceSummary" class="muted small" style="margin-top:10px"></p></section>
<section class="card work-card"><h3>Open</h3><div class="quick-links"><a id="itemLink" class="btn secondary" href="inventory.html">Item</a><a id="timingLink" class="btn secondary" href="timegrapher.html">Timing</a><a id="partsLink" class="btn secondary" href="suppliers.html">Parts</a><a id="passportLink" class="btn secondary" href="passport.html">Passport</a></div></section>
</aside></div></div>
<script src="js/nav.js?v=60"></script><script type="module">
import {loadState,saveState} from './js/store.js?v=26';
import {WORK_TYPES,WORK_STATUSES,itemDisplayName} from './js/item-model.js?v=4';
import {renderPrimaryNavigation} from './js/navigation-shell.js';
renderPrimaryNavigation(document,'work.html');
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),workId=params.get('id')||'';
let state=await loadState();state.items=Array.isArray(state.items)?state.items:[];state.workRecords=Array.isArray(state.workRecords)?state.workRecords:[];
let wi=state.workRecords.findIndex(w=>String(w.id)===String(workId));
if(wi<0){$('title').textContent='Work not found';$('msg').textContent='Return to Workbench and choose a Work record.';$('save').disabled=true;throw new Error('Work not found');}
let work=state.workRecords[wi],item=state.items.find(i=>String(i.id)===String(work.itemId));
const suffix=item?.id?`?id=${encodeURIComponent(item.id)}`:'';
$('itemLink').href=item?`item.html?id=${encodeURIComponent(item.id)}&tab=work`:'inventory.html';
$('timingLink').href=`timegrapher.html${workId?`?work=${encodeURIComponent(workId)}`:''}`;
$('partsLink').href=`suppliers.html${workId?`?work=${encodeURIComponent(workId)}`:''}`;
$('passportLink').href=item?`passport.html?id=${encodeURIComponent(item.id)}`:'passport.html';
$('type').innerHTML=WORK_TYPES.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
$('status').innerHTML=WORK_STATUSES.map(s=>`<option>${s}</option>`).join('');
const fields=['type','status','openedAt','completedAt','diagnosis','repairPerformed','outcome','decision','nextAction','blocker','notes','labourMinutes','cost','materials'];
function cover(){const assets=item?.mediaAssets||[];return assets.find(a=>a?.isCover&&(a.thumbnailUrl||a.url))?.thumbnailUrl||assets.find(a=>a?.thumbnailUrl||a?.url)?.thumbnailUrl||assets.find(a=>a?.url)?.url||'';}
function stageName(stage,index){return stage?.title||stage?.name||`Stage ${index+1}`;}
function stageDone(stage){return !!(stage?.complete||stage?.completedAt);}
function paintStages(){const list=Array.isArray(work.stages)?work.stages:[];$('stages').innerHTML=list.length?list.map((stage,i)=>`<div class="stage-row"><span class="stage-num">${String(i+1).padStart(2,'0')}</span><strong>${stageName(stage,i)}</strong><span class="stage-state">${stageDone(stage)?'Complete':'Open'}</span></div>`).join(''):'<p class="empty">No structured stages on this Work yet.</p>';}
function paint(){
  $('itemName').textContent=item?itemDisplayName(item):'Unknown item';
  const identity=item?.identity||{};$('itemMeta').textContent=[identity.maker,identity.model,identity.year].filter(Boolean).join(' · ');
  const src=cover(),photo=$('itemPhoto');if(src){photo.innerHTML=`<img src="${src}" alt="">`;}else photo.textContent=(itemDisplayName(item||{}).charAt(0)||'W').toUpperCase();
  $('workBadge').textContent=work.type?WORK_TYPES.find(([k])=>k===work.type)?.[1]||'Work':'Work';
  fields.forEach(k=>{if($(k))$(k).value=work[k]??'';});$('workTitle').value=work.title||'';
  $('title').textContent=work.title||'Work';$('statusSummary').textContent=work.status||'Planned';$('nextSummary').textContent=work.nextAction||'Review work';$('blockerSummary').textContent=work.blocker||'None';$('workIdSummary').textContent=work.id||'—';
  const measurements=Array.isArray(work.measurements)?work.measurements.length:0,timing=Array.isArray(work.timingRuns)?work.timingRuns.length:0,faults=Array.isArray(work.faults)?work.faults.length:0;$('evidenceSummary').textContent=`${measurements} measurement${measurements===1?'':'s'} · ${timing} timing run${timing===1?'':'s'} · ${faults} fault${faults===1?'':'s'}`;
  paintStages();
}
function capture(){fields.forEach(k=>{if($(k))work[k]=$(k).value;});work.title=$('workTitle').value;work.updatedAt=new Date().toISOString();if(work.status==='Complete'&&!work.completedAt)work.completedAt=new Date().toISOString().slice(0,10);}
async function persist(message='Saved'){capture();state.workRecords[wi]=work;if(item){item.workIds=[...new Set([...(item.workIds||[]),work.id])];item.updatedAt=new Date().toISOString();const ii=state.items.findIndex(x=>String(x.id)===String(item.id));if(ii>=0)state.items[ii]=item;}state.currentItemId=item?.id||state.currentItemId;state.currentWorkId=work.id;await saveState(state);$('msg').textContent=message;paint();}
$('save').onclick=()=>persist('Saved');$('wait').onclick=async()=>{work.status='Waiting';if(!work.blocker)work.blocker='Waiting on parts';await persist('Moved to Waiting');};$('complete').onclick=async()=>{work.status='Complete';work.blocker='';await persist('Work completed');};$('remove').onclick=async()=>{if(!confirm(`Remove ${work.title||'this Work record'}?`))return;state.workRecords.splice(wi,1);if(item){item.workIds=(item.workIds||[]).filter(id=>id!==work.id);const ii=state.items.findIndex(x=>String(x.id)===String(item.id));if(ii>=0)state.items[ii]=item;}await saveState(state);location.href='workbench.html';};
paint();
</script></body></html>
