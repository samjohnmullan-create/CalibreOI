<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Work · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=12"><style>
.work-context{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}.work-photo{width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-weight:800;color:var(--muted)}.work-photo img{width:100%;height:100%;object-fit:cover}.work-context h2{margin:1px 0 3px}.work-context p{margin:0}.work-menu{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 0 10px}.work-menu::-webkit-scrollbar,.stage-strip::-webkit-scrollbar{display:none}.work-menu a{flex:0 0 auto;min-height:38px;display:flex;align-items:center;padding:7px 12px;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:800;white-space:nowrap}.work-menu a.active{color:var(--accent);border-bottom-color:var(--accent)}.stage-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}.stage-btn{flex:0 0 138px;min-height:66px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);padding:8px;text-align:left;position:relative}.stage-btn small{display:block;color:var(--accent);font-weight:900;margin-bottom:3px}.stage-btn strong{display:block;font-size:.7rem;line-height:1.2}.stage-btn.active{border-color:var(--accent);background:var(--surface-2);color:var(--ink)}.stage-btn.done:after{content:'✓';position:absolute;right:7px;top:6px;color:var(--ok);font-weight:900}.work-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:12px}.work-card{padding:16px}.work-card h3{margin:0 0 12px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wide{grid-column:1/-1}.work-status-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.work-status-row>div{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--surface)}.work-status-row span{display:block;color:var(--muted);font-size:.64rem}.work-status-row strong{display:block;margin-top:3px}.work-actions,.stage-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.work-actions .danger{margin-left:auto;color:var(--danger)}.work-section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.work-section:first-child{border-top:0;padding-top:0;margin-top:0}.yn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.yn p{margin:0;font-size:.78rem}.yn-btns{display:flex;gap:4px}.yn-btns button{min-width:44px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted)}.yn-btns button.on{border-color:var(--accent);color:var(--accent);font-weight:800}.stage-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.stage-head h2{margin:2px 0 3px}.empty{color:var(--muted);font-size:.78rem}.quick-links{display:flex;gap:7px;flex-wrap:wrap}.quick-links a{min-height:38px}@media(max-width:760px){.work-context{grid-template-columns:52px minmax(0,1fr)}.work-photo{width:52px;height:52px}.work-context .badge{grid-column:2;justify-self:start}.work-menu{position:sticky;top:0;z-index:8;background:var(--bg);margin-left:-2px;margin-right:-2px}.work-menu a{min-height:42px;padding:8px 11px}.stage-btn{flex-basis:124px;min-height:62px}.work-layout,.field-grid{grid-template-columns:1fr}.wide{grid-column:auto}.work-status-row{grid-template-columns:repeat(2,minmax(0,1fr))}.work-actions .danger{margin-left:0}.work-card{padding:13px}.yn{grid-template-columns:1fr}.yn-btns{justify-content:flex-start}}
</style></head><body><div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Work</h1></div></a></header><nav class="mainnav"></nav>
<section class="work-context"><div id="itemPhoto" class="work-photo">W</div><div><div class="kicker">CURRENT ITEM</div><h2 id="itemName">Opening item…</h2><p id="itemMeta" class="muted small"></p></div><span id="workBadge" class="badge">Work</span></section>
<nav class="work-menu" aria-label="Work menu"><a class="active" href="#work-record" aria-current="page">Work</a><a id="menuTiming" href="timegrapher.html">Timing</a><a id="menuParts" href="suppliers.html">Parts</a><a id="menuPassport" href="passport.html">Passport</a><a id="menuItem" href="inventory.html">Item</a></nav>
<div id="stageStrip" class="stage-strip" aria-label="Work stages"></div>
<div class="work-status-row"><div><span>Status</span><strong id="statusSummary">—</strong></div><div><span>Next</span><strong id="nextSummary">—</strong></div><div><span>Blocker</span><strong id="blockerSummary">—</strong></div><div><span>Stage</span><strong id="stageSummary">—</strong></div></div>
<div class="work-layout"><main>
<section class="card work-card" id="stage-work"><div class="stage-head"><div><div id="stageEyebrow" class="kicker">STAGE</div><h2 id="stageTitle">Assessment</h2><p id="stageAim" class="muted small"></p></div><span id="stageState" class="badge">In progress</span></div>
<div id="steps" class="work-section"></div>
<div class="work-section"><h3>Stage record</h3><div class="field-grid"><label>Condition<select id="stageCondition"><option value="">Not set</option><option>Running</option><option>Running, needs a look</option><option>Stopped</option><option>Slipping wind</option><option>Damaged</option></select></label><label>Measurement / result<input id="stageMeasure"></label><label class="wide">Stage notes<textarea id="stageNotes" rows="4"></textarea></label></div><label class="checkline" style="margin-top:10px"><input id="stageComplete" type="checkbox"><span>Stage complete</span></label></div>
<div class="stage-actions"><button id="prevStage" class="btn secondary" type="button">Previous</button><button id="nextStage" class="btn" type="button">Next</button><span id="stageMsg" class="muted small"></span></div></section>
<section class="card work-card" id="work-record" style="margin-top:12px"><div class="work-section"><div class="kicker">WORK RECORD</div><h2 id="title">Opening work…</h2><div class="field-grid"><label>Type<select id="type"></select></label><label>Status<select id="status"></select></label><label class="wide">Title<input id="workTitle"></label><label>Opened<input id="openedAt" type="date"></label><label>Completed<input id="completedAt" type="date"></label><label class="wide">Diagnosis<textarea id="diagnosis" rows="4" placeholder="What is wrong, suspected, or confirmed?"></textarea></label><label class="wide">Work performed<textarea id="repairPerformed" rows="4" placeholder="What has been done?"></textarea></label><label class="wide">Outcome<textarea id="outcome" rows="3" placeholder="Result or current state"></textarea></label></div></div>
<div class="work-section"><h3>Decision & next action</h3><div class="field-grid"><label>Decision<input id="decision" placeholder="Full service, Regulate only, Case, hands or crystal..."></label><label>Next action<input id="nextAction" placeholder="What should happen next?"></label><label class="wide">Blocker<input id="blocker" placeholder="Leave blank if nothing is blocking this work"></label></div></div>
<div class="work-section"><h3>Notes</h3><textarea id="notes" rows="4" placeholder="Workshop notes"></textarea></div>
<div class="work-actions"><button id="save" class="btn">Save work</button><button id="wait" class="btn secondary">Mark waiting</button><button id="complete" class="btn secondary">Complete</button><span id="msg" class="muted small"></span><button id="remove" class="btn secondary danger">Remove work</button></div></section>
</main><aside>
<section class="card work-card"><h3>Workshop evidence</h3><div class="field-grid"><label>Labour minutes<input id="labourMinutes" type="number" min="0" inputmode="numeric"></label><label>Direct cost<input id="cost" inputmode="decimal"></label><label class="wide">Materials / consumables<input id="materials"></label></div><p id="evidenceSummary" class="muted small" style="margin-top:10px"></p></section>
<section class="card work-card"><h3>Stage progress</h3><p id="stageProgress" class="muted small"></p></section>
</aside></div></div>
<script src="js/nav.js?v=63"></script><script type="module">
import {loadState,saveState} from './js/store.js?v=26';
import {WORK_TYPES,WORK_STATUSES,itemDisplayName} from './js/item-model.js?v=4';
import {renderPrimaryNavigation} from './js/navigation-shell.js';
import {STAGE_COPY} from './js/stages.js?v=10';
import {ensureWorkStages} from './js/work-stages.js?v=1';
renderPrimaryNavigation(document,'work.html');
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),workId=params.get('id')||'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=await loadState();state.items=Array.isArray(state.items)?state.items:[];state.work=Array.isArray(state.work)?state.work:[];
let wi=state.work.findIndex(w=>String(w.id)===String(workId));
if(wi<0){$('title').textContent='Work not found';$('msg').textContent='Return to Workbench and choose a Work record.';$('save').disabled=true;throw new Error('Work not found');}
let work=state.work[wi],item=state.items.find(i=>String(i.id)===String(work.itemId));ensureWorkStages(work,item);
$('menuItem').href=item?`item.html?id=${encodeURIComponent(item.id)}&tab=work`:'inventory.html';
$('menuTiming').href=`timegrapher.html?work=${encodeURIComponent(workId)}`;
$('menuParts').href=`suppliers.html?work=${encodeURIComponent(workId)}`;
$('menuPassport').href=item?`passport.html?id=${encodeURIComponent(item.id)}`:'passport.html';
$('type').innerHTML=WORK_TYPES.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
$('status').innerHTML=WORK_STATUSES.map(s=>`<option>${s}</option>`).join('');
const fields=['type','status','openedAt','completedAt','diagnosis','repairPerformed','outcome','decision','nextAction','blocker','notes','labourMinutes','cost','materials'];
function cover(){const assets=item?.mediaAssets||[];return assets.find(a=>a?.isCover&&(a.thumbnailUrl||a.url))?.thumbnailUrl||assets.find(a=>a?.thumbnailUrl||a?.url)?.thumbnailUrl||assets.find(a=>a?.url)?.url||'';}
function activeStage(){ensureWorkStages(work,item);return work.stages[work.stageIndex]||work.stages[0];}
function stepObj(x,i){return typeof x==='string'?{id:String(i),text:x}:x;}
function answer(stage,x,i){const o=stepObj(x,i);return stage?.checks?.[o.id]??stage?.checks?.[i]??'';}
function visible(stage,x,i){const o=stepObj(x,i);if(o.when){const defs=STAGE_COPY[stage.name]?.steps||[],di=defs.findIndex((y,n)=>stepObj(y,n).id===o.when.id),actual=di>=0?answer(stage,defs[di],di):'';if(Array.isArray(o.when.values)?!o.when.values.includes(actual):actual!==o.when.value)return false;}if(o.whenGlobal){const other=(work.stages||[]).find(z=>z.name===o.whenGlobal.stage);if(!other)return false;const defs=STAGE_COPY[other.name]?.steps||[],di=defs.findIndex((y,n)=>stepObj(y,n).id===o.whenGlobal.id),actual=di>=0?answer(other,defs[di],di):'';if(Array.isArray(o.whenGlobal.values)?!o.whenGlobal.values.includes(actual):actual!==o.whenGlobal.value)return false;}return true;}
function stageDone(stage){if(stage?.complete)return true;const defs=(STAGE_COPY[stage?.name]?.steps||[]).map((x,i)=>({x,i})).filter(({x,i})=>visible(stage,x,i));return defs.length>0&&defs.every(({x,i})=>['yes','no','na',true,false].includes(answer(stage,x,i)));}
function captureStage(){const s=activeStage();if(!s)return;s.condition=$('stageCondition').value;s.measure=$('stageMeasure').value;s.notes=$('stageNotes').value;s.complete=$('stageComplete').checked;s.updatedAt=new Date().toISOString();}
function paintSteps(stage){const box=$('steps'),defs=STAGE_COPY[stage?.name]?.steps||[];box.innerHTML='<h3>Checks</h3>';let shown=0;defs.forEach((raw,i)=>{if(!visible(stage,raw,i))return;shown++;const o=stepObj(raw,i),cur=answer(stage,raw,i),row=document.createElement('div');row.className='yn';row.innerHTML=`<p>${esc(o.text)}</p><div class="yn-btns"></div>`;for(const [v,l] of [['yes','Yes'],['no','No'],['na','N/A']]){const b=document.createElement('button');b.type='button';b.textContent=l;if(cur===v||cur===true&&v==='yes'||cur===false&&v==='no')b.className='on';b.onclick=async()=>{captureStage();stage.checks=stage.checks||{};stage.checks[o.id]=cur===v?'':v;stage.updatedAt=new Date().toISOString();await persistState('Answer saved');paint();};row.querySelector('.yn-btns').appendChild(b);}box.appendChild(row);});if(!shown)box.insertAdjacentHTML('beforeend','<p class="empty">No checklist questions for this stage.</p>');}
function paintStages(){ensureWorkStages(work,item);const strip=$('stageStrip');strip.innerHTML='';work.stages.forEach((s,i)=>{const copy=STAGE_COPY[s.name]||{title:s.name},b=document.createElement('button');b.type='button';b.className='stage-btn'+(i===work.stageIndex?' active':'')+(stageDone(s)?' done':'');b.innerHTML=`<small>${String(i+1).padStart(2,'0')}</small><strong>${esc(copy.title||s.name)}</strong>`;b.onclick=async()=>{captureStage();work.stageIndex=i;await persistState();paint();document.getElementById('stage-work').scrollIntoView({behavior:'smooth',block:'start'});};strip.appendChild(b);});}
function paint(){
  ensureWorkStages(work,item);const s=activeStage(),copy=STAGE_COPY[s?.name]||{title:s?.name||'Stage',aim:''};
  $('itemName').textContent=item?itemDisplayName(item):'Unknown item';const identity=item?.identity||{};$('itemMeta').textContent=[identity.maker,identity.model,identity.year].filter(Boolean).join(' · ');const src=cover(),photo=$('itemPhoto');if(src)photo.innerHTML=`<img src="${src}" alt="">`;else photo.textContent=(itemDisplayName(item||{}).charAt(0)||'W').toUpperCase();
  $('workBadge').textContent=work.type?WORK_TYPES.find(([k])=>k===work.type)?.[1]||'Work':'Work';fields.forEach(k=>{if($(k))$(k).value=work[k]??'';});$('workTitle').value=work.title||'';$('title').textContent=work.title||'Work';$('statusSummary').textContent=work.status||'Planned';$('nextSummary').textContent=work.nextAction||'Review work';$('blockerSummary').textContent=work.blocker||'None';$('stageSummary').textContent=`${work.stageIndex+1} / ${work.stages.length}`;
  $('stageEyebrow').textContent=`STAGE ${String(work.stageIndex+1).padStart(2,'0')}`;$('stageTitle').textContent=copy.title||s.name;$('stageAim').textContent=copy.aim||'';$('stageState').textContent=stageDone(s)?'Complete':'In progress';$('stageCondition').value=s?.condition||'';$('stageMeasure').value=s?.measure||'';$('stageNotes').value=s?.notes||'';$('stageComplete').checked=!!s?.complete;$('prevStage').disabled=work.stageIndex<=0;$('nextStage').disabled=work.stageIndex>=work.stages.length-1;
  const done=work.stages.filter(stageDone).length;$('stageProgress').textContent=`${done} of ${work.stages.length} stages complete · ${Math.round(done/Math.max(1,work.stages.length)*100)}%`;
  const measurements=Array.isArray(work.measurements)?work.measurements.length:0,timing=Array.isArray(work.timingRuns)?work.timingRuns.length:0,faults=Array.isArray(work.faults)?work.faults.length:0;$('evidenceSummary').textContent=`${measurements} measurement${measurements===1?'':'s'} · ${timing} timing run${timing===1?'':'s'} · ${faults} fault${faults===1?'':'s'}`;
  paintStages();paintSteps(s);
}
function capture(){captureStage();fields.forEach(k=>{if($(k))work[k]=$(k).value;});work.title=$('workTitle').value;work.updatedAt=new Date().toISOString();if(work.status==='Complete'&&!work.completedAt)work.completedAt=new Date().toISOString().slice(0,10);}
async function persistState(message=''){state.work[wi]=work;if(item){item.workIds=[...new Set([...(item.workIds||[]),work.id])];item.updatedAt=new Date().toISOString();const ii=state.items.findIndex(x=>String(x.id)===String(item.id));if(ii>=0)state.items[ii]=item;}state.currentItemId=item?.id||state.currentItemId;state.currentWorkId=work.id;await saveState(state);if(message){$('msg').textContent=message;$('stageMsg').textContent=message;}}
async function persist(message='Saved'){capture();ensureWorkStages(work,item);await persistState(message);paint();}
$('save').onclick=()=>persist('Saved');$('wait').onclick=async()=>{capture();work.status='Waiting';if(!work.blocker)work.blocker='Waiting on parts';await persistState('Moved to Waiting');paint();};$('complete').onclick=async()=>{capture();work.status='Complete';work.blocker='';await persistState('Work completed');paint();};$('remove').onclick=async()=>{if(!confirm(`Remove ${work.title||'this Work record'}?`))return;state.work.splice(wi,1);if(item){item.workIds=(item.workIds||[]).filter(id=>id!==work.id);const ii=state.items.findIndex(x=>String(x.id)===String(item.id));if(ii>=0)state.items[ii]=item;}await saveState(state);location.href='workbench.html';};
$('prevStage').onclick=async()=>{captureStage();work.stageIndex=Math.max(0,work.stageIndex-1);await persistState();paint();};$('nextStage').onclick=async()=>{captureStage();work.stageIndex=Math.min(work.stages.length-1,work.stageIndex+1);await persistState();paint();};
['stageCondition','stageMeasure','stageNotes'].forEach(id=>$(id).addEventListener('change',()=>persist('Stage saved')));$('stageComplete').addEventListener('change',()=>persist('Stage saved'));
$('type').addEventListener('change',async()=>{capture();work.type=$('type').value;ensureWorkStages(work,item);await persistState('Work type updated');paint();});$('decision').addEventListener('change',async()=>{capture();ensureWorkStages(work,item);await persistState('Decision updated');paint();});
paint();
</script></body></html>
