<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Work · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=12"><style>
.work-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.work-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.wide{grid-column:1/-1}.work-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.danger{margin-left:auto}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metrics>div{border:1px solid var(--line);border-radius:8px;padding:10px}.metrics span{display:block;color:var(--muted);font-size:.63rem}.metrics strong{display:block;margin-top:3px}.crumb{font-size:.68rem;color:var(--muted);margin-bottom:3px}@media(max-width:760px){.work-grid,.field-grid,.metrics{grid-template-columns:1fr}.wide{grid-column:auto}.danger{margin-left:0}}
</style></head><body><div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Work record</h1></div></a></header><nav class="mainnav"></nav>
<div class="work-head"><div><div class="crumb" id="itemCrumb">Item</div><div class="kicker">WORK</div><h2 id="title">Work record</h2><p class="muted small" id="subtitle">Loading…</p></div><a class="btn secondary" id="back" href="inventory.html">Back to item</a></div>
<div class="work-grid"><section class="card"><h3>Work</h3><div class="field-grid"><label>Type<select id="type"></select></label><label>Status<select id="status"></select></label><label class="wide">Title<input id="workTitle"></label><label>Opened<input id="openedAt" type="date"></label><label>Completed<input id="completedAt" type="date"></label><label>Labour minutes<input id="labourMinutes" type="number" min="0"></label><label>Direct cost<input id="cost" inputmode="decimal"></label><label class="wide">Materials / consumables<input id="materials"></label><label class="wide">Initial notes<textarea id="notes" rows="4"></textarea></label></div></section>
<section class="card"><h3>Outcome</h3><div class="field-grid"><label class="wide">Findings<textarea id="findings" rows="4" placeholder="What was found during inspection or preparation?"></textarea></label><label class="wide">Work performed<textarea id="workPerformed" rows="5" placeholder="Cleaning, repair, restoration, polishing, photography preparation..."></textarea></label><label class="wide">Outcome / result<textarea id="outcome" rows="4"></textarea></label></div><div style="border-top:1px solid var(--line);padding-top:12px;margin-top:12px"><div class="metrics"><div><span>Work ID</span><strong id="workId">—</strong></div><div><span>Created</span><strong id="created">—</strong></div><div><span>Updated</span><strong id="updated">—</strong></div></div></div></section></div>
<div class="work-actions"><button class="btn" id="save">Save work</button><span class="muted small" id="msg"></span><button class="btn secondary danger" id="remove">Remove work</button></div></div>
<script src="js/nav.js?v=55"></script><script type="module">
import {loadState,saveState} from "./js/store.js?v=26";
import {WORK_TYPES,WORK_STATUSES,normaliseWork,normaliseItem,itemDisplayName} from "./js/item-model.js?v=3";
const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),workId=p.get("id")||"";let state=await loadState();state.items=Array.isArray(state.items)?state.items:[];state.workRecords=Array.isArray(state.workRecords)?state.workRecords:[];let wi=state.workRecords.findIndex(x=>String(x.id)===String(workId));
if(wi<0){$("title").textContent="Work not found";$("save").disabled=true;$("remove").disabled=true;throw new Error("Work not found");}
let work=normaliseWork(state.workRecords[wi]),item=state.items.find(x=>String(x.id)===String(work.itemId));if(item)item=normaliseItem(item);$("back").href=item?`item.html?id=${encodeURIComponent(item.id)}&tab=work`:"inventory.html";$("itemCrumb").textContent=item?itemDisplayName(item):"Unknown item";
$("type").innerHTML=WORK_TYPES.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");$("status").innerHTML=WORK_STATUSES.map(s=>`<option>${s}</option>`).join("");const fields=["type","status","openedAt","completedAt","labourMinutes","cost","materials","notes","findings","workPerformed","outcome"],titleField=$("workTitle");
function paint(){fields.forEach(k=>$(k).value=work[k]??"");titleField.value=work.title||"";$("title").textContent=work.title||"Work record";$("subtitle").textContent=`${WORK_TYPES.find(([k])=>k===work.type)?.[1]||"Work"} · ${work.status}`;$("workId").textContent=work.id;$("created").textContent=work.createdAt?new Date(work.createdAt).toLocaleString("en-AU"):"—";$("updated").textContent=work.updatedAt?new Date(work.updatedAt).toLocaleString("en-AU"):"—"}
fields.forEach(k=>$(k).addEventListener("input",()=>{work[k]=$(k).value;if(k==="status"&&work.status==="Complete"&&!work.completedAt)work.completedAt=new Date().toISOString().slice(0,10);paint()}));titleField.addEventListener("input",()=>{work.title=titleField.value;$("title").textContent=work.title||"Work record"});
$("save").onclick=async()=>{work.updatedAt=new Date().toISOString();state.workRecords[wi]=normaliseWork(work);if(item){const ii=state.items.findIndex(x=>String(x.id)===String(item.id));if(ii>=0){item.workIds=[...new Set([...(item.workIds||[]),work.id])];item.updatedAt=new Date().toISOString();state.items[ii]=normaliseItem(item)}}await saveState(state);work=state.workRecords[wi];$("msg").textContent="Saved.";paint()};
$("remove").onclick=async()=>{if(!confirm(`Remove ${work.title||"this work record"}?`))return;state.workRecords.splice(wi,1);if(item){const ii=state.items.findIndex(x=>String(x.id)===String(item.id));if(ii>=0){item.workIds=(item.workIds||[]).filter(id=>id!==work.id);state.items[ii]=normaliseItem(item)}}await saveState(state);location.href=$("back").href};paint();
</script></body></html>
