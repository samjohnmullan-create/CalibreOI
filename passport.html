<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>.slot{margin:14px 0;padding-top:10px;border-top:1px solid var(--line)}.slot h4{margin:0 0 8px;font-size:.9rem}.thumbs{display:flex;gap:8px;overflow:auto}.thumbs figure{margin:0;min-width:92px}.thumbs img{width:92px;height:92px;object-fit:cover;border-radius:8px;background:#ece9e1}.thumbs button{display:block;margin-top:4px}</style>
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn" href="index.html">Start</a><a class="navbtn" href="workbench.html">Bench</a><a class="navbtn" href="timegrapher.html">Time</a><a class="navbtn active" href="passport.html" aria-current="page">Identity</a><a class="navbtn" href="business.html">Cost</a><a class="navbtn" href="summary.html">Sheet</a><a class="navbtn" href="inventory.html">Stock</a><a class="navbtn" href="suppliers.html">Parts</a></nav>
<div class="hero"><div><img class="seal dark" src="assets/seal-black.png?v=4" alt="Calibre" style="display:block;width:112px;height:auto;margin:0 auto 8px"><div class="kicker">THIS WATCH</div><h2 id="watchTitle">Identity</h2></div></div>
<section class="card">
<div class="grid2">
<label>Maker<input id="maker"></label><label>Model<input id="model"></label>
<label>Calibre<input id="calibre"></label><label>Movement mm<input id="movementMm" inputmode="decimal" placeholder="pillar plate, not the case"></label>
<label>Jewel count<input id="jewels"></label><label>Movement type<input id="movementType" placeholder="bar, 3/4 plate, lever"></label>
<label>Escapement<input id="escapement"></label><label>Approx. year<input id="year"></label>
<label>Movement serial<input id="serial"></label><label>Case number<input id="caseNumber"></label>
<label>Case reference<input id="reference"></label><label>Case material<input id="caseMaterial"></label>
<label>Width mm<input id="width"></label><label>Height mm<input id="height"></label>
<label>Thickness mm<input id="thickness"></label>
</div>
<label>Identification notes<textarea id="notes" rows="3"></textarea></label>
<label>Research / history<textarea id="history" rows="4"></textarea></label>
<p id="statusText" class="muted small">Loading…</p>
</section>
<section class="card" id="album"><h3>Photographs</h3><p class="muted small">One set for this job. Sales hero is the cover on Start.</p><div id="slots"></div></section></div>
<script src="js/nav.js?v=10"></script>
<script type="module">
import { loadState, saveState, current, PHOTO_SLOTS, compressImage, escapeHtml } from "./js/store.js?v=7";
const $ = id => document.getElementById(id);
const keys = ["maker","model","calibre","movementMm","jewels","movementType","escapement","year","serial","caseNumber","reference","caseMaterial","width","height","thickness","notes","history"];
let state = await loadState();
let job = current(state);
let timer;
function hint(t){ $("statusText").textContent = t; }
function capture(){ keys.forEach(k => job.passport[k] = $(k).value); }
function paint(){ job = current(state); $("watchTitle").textContent = job.watchName; keys.forEach(k => $(k).value = job.passport[k] || ""); paintSlots(); hint("Ready"); }
function paintSlots(){
  $("slots").innerHTML = PHOTO_SLOTS.map(([key, label]) => {
    const shots = job.photos[key] || [];
    const thumbs = shots.map((src, i) => `<figure><img src="${src}" alt=""><button class="btn secondary del" data-slot="${key}" data-i="${i}" type="button">Remove</button></figure>`).join("");
    return `<div class="slot"><h4>${escapeHtml(label)} <span class="muted small">${shots.length ? shots.length : "none"}</span></h4><div class="thumbs">${thumbs}</div><label class="btn secondary" style="margin-top:8px">Add photo<input class="add" data-slot="${key}" type="file" accept="image/*" capture="environment" hidden></label></div>`;
  }).join("");
  $("slots").querySelectorAll(".add").forEach(input => input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    hint("Saving photo…");
    const src = await compressImage(file);
    job.photos[input.dataset.slot].push(src);
    await saveState(state);
    paintSlots();
    hint("Saved");
  });
  $("slots").querySelectorAll(".del").forEach(btn => btn.onclick = async () => {
    job.photos[btn.dataset.slot].splice(Number(btn.dataset.i), 1);
    await saveState(state);
    paintSlots();
    hint("Removed");
  });
}
keys.forEach(k => $(k).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(async () => { capture(); await saveState(state); hint("Saved"); }, 400); }));
paint();
</script></body></html>
