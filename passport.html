<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Identity · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=9">
<style>
.shotrow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.shotrow img,.shotrow .ph{width:72px;height:72px;object-fit:cover;border-radius:8px;background:#f7f5f0}
.shotrow .ph{display:grid;place-items:center;color:var(--muted);font-size:.7rem}
.shotrow .row{margin-top:6px}
</style>
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn" href="index.html">Start</a><a class="navbtn" href="workbench.html">Bench</a><a class="navbtn" href="timegrapher.html">Time</a><a class="navbtn active" href="passport.html" aria-current="page">Identity</a><a class="navbtn" href="business.html">Cost</a><a class="navbtn" href="summary.html">Sheet</a><a class="navbtn" href="inventory.html">Stock</a><a class="navbtn" href="suppliers.html">Parts</a></nav>
<div class="hero"><div><div class="kicker">THIS WATCH</div><h2 id="watchTitle">Identity</h2></div></div>
<section class="card">
<h3>Photographs</h3>
<p class="muted small">Take photo opens the camera. Upload opens the gallery.</p>
<div class="frames" id="slots"></div>
</section>
<section class="card">
<h3>Watch</h3>
<div class="grid2">
<label>Confidence<select id="confidence"><option>Unknown</option><option>Estimated</option><option>Probable</option><option>Confirmed</option></select></label>
<label>Maker<input id="maker"></label>
<label>Model<input id="model"></label>
<label>Country<input id="country"></label>
<label>Approx. year<input id="year"></label>
<label>Dial markings<input id="dialMarkings" placeholder="Swiss, T Swiss T, signed"></label>
<label>Complications<input id="complications" placeholder="date, moon, chronograph"></label>
<label>Bracelet / strap<input id="strap"></label>
</div>
<h3>Movement</h3>
<div class="grid2">
<label>Movement manufacturer<input id="movementMaker" placeholder="if not the dial name"></label>
<label>Calibre<input id="calibre"></label>
<label>Calibre family<input id="calibreFamily"></label>
<label>Beat rate<input id="beatRate" placeholder="18000"></label>
<label>Power reserve<input id="powerReserve"></label>
<label>Setting type<input id="settingType" placeholder="pendant, key, quickset"></label>
<label>Jewel count<input id="jewels"></label>
<label>Movement type<input id="movementType" placeholder="bar, 3/4 plate"></label>
<label>Escapement<input id="escapement"></label>
<label>Movement mm<input id="movementMm" inputmode="decimal" placeholder="pillar plate"></label>
<label>Movement serial<input id="serial"></label>
</div>
<h3>Case</h3>
<div class="grid2">
<label>Case style<input id="caseStyle" placeholder="cushion, tonneau, hunter"></label>
<label>Case material<input id="caseMaterial"></label>
<label>Case number<input id="caseNumber"></label>
<label>Case reference<input id="reference"></label>
<label>Caseback type<input id="casebackType" placeholder="screw, snap, display"></label>
<label>Crystal type<input id="crystalType" placeholder="acrylic, mineral, glass"></label>
<label>Crown type<input id="crownType"></label>
<label>Lug width mm<input id="lugWidth" inputmode="decimal"></label>
<label>Width mm<input id="width"></label>
<label>Height mm<input id="height"></label>
<label>Thickness mm<input id="thickness"></label>
<label>Water-resistance marking<input id="waterMark" placeholder="as stamped, or none"></label>
</div>
<h3>Marks</h3>
<label>Hallmarks<textarea id="hallmarks" rows="2"></textarea></label>
<label>Engravings<textarea id="engravings" rows="2"></textarea></label>
<label>Identification notes<textarea id="notes" rows="3"></textarea></label>
<h3>Provenance</h3>
<div class="grid2">
<label>Auction house<input id="auctionHouse"></label>
<label>Lot number<input id="lotNumber"></label>
<label>Auction date<input id="auctionDate" type="date"></label>
<label>Seller<input id="seller"></label>
<label>Invoice number<input id="invoiceNumber"></label>
</div>
<label>Original listing<textarea id="listingText" rows="3"></textarea></label>
<div class="row"><button id="takeInvoice" class="btn secondary" type="button">Invoice photo</button><button id="dropInvoice" class="btn secondary" type="button">Remove invoice</button></div>
<img id="invoiceImg" alt="" style="display:none;width:120px;height:120px;object-fit:cover;border-radius:8px;margin-top:8px">
<input id="invoiceFile" type="file" accept="image/*" hidden>
<h3>Sources</h3>
<div id="sources"></div>
<label>Known incorrect / warnings<textarea id="warnings" rows="3" placeholder="Listings that misname the calibre or the date"></textarea></label>
<label>Research / history<textarea id="history" rows="3"></textarea></label>
<p id="statusText" class="muted small">Loading…</p>
</section></div>
<script src="js/nav.js?v=20"></script>
<script type="module">
import { loadState, saveState, current, PHOTO_SLOTS, compressImage, escapeHtml } from "./js/store.js?v=23";
const $ = id => document.getElementById(id);
const keys = ["confidence","maker","model","country","year","dialMarkings","complications","strap","movementMaker","calibre","calibreFamily","beatRate","powerReserve","settingType","jewels","movementType","escapement","movementMm","serial","caseStyle","caseMaterial","caseNumber","reference","casebackType","crystalType","crownType","lugWidth","width","height","thickness","waterMark","hallmarks","engravings","notes","warnings","auctionHouse","lotNumber","auctionDate","seller","invoiceNumber","listingText","history"];
const SOURCE_KINDS = ["URL","Book","Ranfft","Mikrolisk","Catalogue","Auction listing","Serial database","Other"];
let state = await loadState();
let job = current(state);
let timer;
function hint(t){ $("statusText").textContent = t; }
function capture(){ keys.forEach(k => job.passport[k] = $(k).value); }
function paint(){ job = current(state); $("watchTitle").textContent = job.watchName; keys.forEach(k => $(k).value = job.passport[k] || ""); paintSlots(); paintSources(); paintInvoice(); hint("Ready"); }
function paintInvoice(){
  const src = job.passport.invoicePhoto;
  $("invoiceImg").style.display = src ? "block" : "none";
  if (src) $("invoiceImg").src = src;
}
function paintSources(){
  const rows = (job.passport.sources || []).map((s, i) => `<div class="row"><select class="sk" data-i="${i}">${SOURCE_KINDS.map(k => `<option${k===s.kind?" selected":""}>${k}</option>`).join("")}</select><input class="st" data-i="${i}" value="${escapeHtml(s.title || "")}" placeholder="Title, page, or URL"><button class="btn secondary sx" data-i="${i}" type="button">Remove</button></div>`).join("");
  $("sources").innerHTML = rows + `<button id="addSource" class="btn secondary" type="button">Add source</button>`;
  $("sources").querySelectorAll(".sk").forEach(el => el.onchange = () => { job.passport.sources[el.dataset.i].kind = el.value; scheduleSave(); });
  $("sources").querySelectorAll(".st").forEach(el => el.oninput = () => { job.passport.sources[el.dataset.i].title = el.value; scheduleSave(); });
  $("sources").querySelectorAll(".sx").forEach(b => b.onclick = async () => { job.passport.sources.splice(Number(b.dataset.i), 1); await saveState(state); paintSources(); });
  $("addSource").onclick = async () => { job.passport.sources.push({ kind:"URL", title:"" }); await saveState(state); paintSources(); };
}
function scheduleSave(){ clearTimeout(timer); timer = setTimeout(async () => { capture(); await saveState(state); hint("Saved"); }, 400); }
function paintSlots(){
  $("slots").innerHTML = PHOTO_SLOTS.map(([key, label]) => {
    const src = (job.photos[key] || [])[0] || "";
    const extra = (job.photos[key] || []).length;
    return `<div class="shotrow">${src?`<img src="${src}" alt="">`:`<div class="ph">None</div>`}<div><strong>${escapeHtml(label)}</strong>${extra>1?`<div class="muted small">${extra} photos</div>`:""}<div class="row"><button class="btn secondary take" data-slot="${key}" type="button">Take photo</button><button class="btn secondary up" data-slot="${key}" type="button">Upload</button>${src?`<button class="btn secondary x" data-slot="${key}" type="button">Remove</button>`:""}</div></div><input id="file-${key}" type="file" accept="image/*" hidden></div>`;
  }).join("");
  $("slots").querySelectorAll("button.take").forEach(btn => btn.onclick = () => { const input = $("file-"+btn.dataset.slot); input.setAttribute("capture","environment"); input.click(); });
  $("slots").querySelectorAll("button.up").forEach(btn => btn.onclick = () => { const input = $("file-"+btn.dataset.slot); input.removeAttribute("capture"); input.click(); });
  $("slots").querySelectorAll("input[type=file]").forEach(input => input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    hint("Saving photo…");
    job.photos[input.id.replace("file-","")].push(await compressImage(file));
    await saveState(state);
    paintSlots();
    hint("Saved");
  });
  $("slots").querySelectorAll(".x").forEach(btn => btn.onclick = async (e) => {
    e.preventDefault();
    e.stopPropagation();
    job.photos[btn.dataset.slot].shift();
    await saveState(state);
    paintSlots();
    hint("Removed");
  });
}
keys.forEach(k => $(k).addEventListener("input", scheduleSave));
$("takeInvoice").onclick = () => $("invoiceFile").click();
$("invoiceFile").onchange = async () => { const file = $("invoiceFile").files && $("invoiceFile").files[0]; if (!file) return; job.passport.invoicePhoto = await compressImage(file); await saveState(state); paintInvoice(); hint("Invoice saved"); };
$("dropInvoice").onclick = async () => { job.passport.invoicePhoto = ""; await saveState(state); paintInvoice(); };
paint();
</script></body></html>
