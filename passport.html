<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Passport · Calibre & Co.</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
  <nav class="mainnav"><a class="navbtn" href="index.html">Jobs</a><a class="navbtn" href="workbench.html">Workbench</a><a class="navbtn" href="timegrapher.html">Timegrapher</a><a class="navbtn active" href="passport.html">Passport</a><a class="navbtn" href="business.html">Business</a></nav>
  <div class="hero"><div><div class="kicker">WATCH PASSPORT</div><h2 id="watchTitle">Identity</h2><p class="muted">Maker, calibre and case. Saved on this phone.</p></div></div>
  <section class="card">
    <div class="grid2">
      <label>Maker<input id="maker"></label>
      <label>Calibre<input id="calibre"></label>
      <label>Approx. year<input id="year" placeholder="c. 1900"></label>
      <label>Serial / case number<input id="serial"></label>
      <label>Case material<input id="caseMaterial" placeholder="0.800 silver"></label>
      <label>Escapement<input id="escapement" placeholder="cylinder, lever"></label>
    </div>
    <label>Notes<textarea id="passportNotes" rows="5"></textarea></label>
    <p id="statusText" class="muted small">Ready</p>
  </section>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var state, job, timer;
  function openDB(){ return new Promise(function(res, rej){ var r = indexedDB.open("calibre-co-v1", 1); r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); }; r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
  function readState(){ return openDB().then(function(db){ return new Promise(function(res, rej){ var g = db.transaction("kv").objectStore("kv").get("state"); g.onsuccess = function(){ res(g.result); }; g.onerror = function(){ rej(g.error); }; }); }); }
  function writeState(){ return openDB().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(state, "state"); tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); }; }); }); }
  function current(){ return state.jobs.filter(function(j){ return j.id === state.currentId; })[0] || state.jobs[0]; }
  function capture(){ job.passport = { maker:$("maker").value, calibre:$("calibre").value, year:$("year").value, serial:$("serial").value, caseMaterial:$("caseMaterial").value, escapement:$("escapement").value, notes:$("passportNotes").value }; }
  function paint(){
    job = current(); job.passport = job.passport || {};
    $("watchTitle").textContent = job.watchName || "Identity";
    ["maker","calibre","year","serial","caseMaterial","escapement"].forEach(function(k){ $(k).value = job.passport[k] || ""; });
    $("passportNotes").value = job.passport.notes || "";
  }
  document.querySelectorAll("input,textarea").forEach(function(el){ el.addEventListener("input", function(){ clearTimeout(timer); timer = setTimeout(function(){ capture(); writeState().then(function(){ $("statusText").textContent = "Saved"; }); }, 400); }); });
  readState().then(function(saved){ state = saved; if (!state || !state.jobs) return; paint(); });
})();
</script>
</body>
</html>
