<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Passport · Calibre & Co.</title><link rel="stylesheet" href="css/app.css">
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn" href="index.html">Jobs</a><a class="navbtn" href="workbench.html">Workbench</a><a class="navbtn" href="timegrapher.html">Timegrapher</a><a class="navbtn active" href="passport.html">Passport</a><a class="navbtn" href="business.html">Business</a></nav>
<div class="hero"><div><div class="kicker">WATCH PASSPORT</div><h2 id="watchTitle">Identity</h2></div></div>
<section class="card">
<div class="grid2">
<label>Maker<input id="maker"></label><label>Model<input id="model"></label>
<label>Calibre<input id="calibre"></label><label>Jewel count<input id="jewels"></label>
<label>Movement type<input id="movementType" placeholder="bar, 3/4 plate, lever"></label><label>Escapement<input id="escapement"></label>
<label>Approx. year<input id="year"></label><label>Movement serial<input id="serial"></label>
<label>Case number<input id="caseNumber"></label><label>Case reference<input id="reference"></label>
<label>Case material<input id="caseMaterial"></label><label>Width mm<input id="width"></label>
<label>Height mm<input id="height"></label><label>Thickness mm<input id="thickness"></label>
</div>
<label>Identification notes<textarea id="notes" rows="3"></textarea></label>
<label>Research / history<textarea id="history" rows="4" placeholder="What you have checked, and what is still open."></textarea></label>
<div class="subpanel"><div class="section-head"><h3>Passport photos</h3><label class="btn secondary">Add photo<input id="photoInput" type="file" accept="image/*" hidden></label></div><div id="photoGrid" class="photo-grid"></div></div>
<p id="statusText" class="muted small">Loading…</p>
</section></div>
<script type="module">
import { loadState, saveState, current, compressImage } from "./js/store.js";
const $ = id => document.getElementById(id);
const keys = ["maker","model","calibre","jewels","movementType","escapement","year","serial","caseNumber","reference","caseMaterial","width","height","thickness","notes","history"];
let state = await loadState();
let job = current(state);
let timer;
function hint(t){ $("statusText").textContent = t; }
function capture(){ keys.forEach(k => job.passport[k] = $(k).value); }
function paintPhotos(){
  const box = $("photoGrid"); box.innerHTML = "";
  (job.passport.photos||[]).forEach((src, idx) => {
    const d = document.createElement("div"); d.className = "photo"; d.innerHTML = "<img alt=''><button type='button'>×</button>";
    d.querySelector("img").src = src;
    d.querySelector("button").onclick = async () => { job.passport.photos.splice(idx,1); await saveState(state); paintPhotos(); };
    box.appendChild(d);
  });
}
function paint(){
  job = current(state);
  $("watchTitle").textContent = job.watchName;
  keys.forEach(k => $(k).value = job.passport[k] || "");
  paintPhotos();
  hint("Ready");
}
keys.forEach(k => $(k).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(async () => { capture(); await saveState(state); hint("Saved"); }, 400); }));
$("photoInput").onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  job.passport.photos = job.passport.photos || [];
  if (job.passport.photos.length >= 8) return;
  job.passport.photos.push(await compressImage(file));
  await saveState(state); paintPhotos(); hint("Photo saved");
};
paint();
</script></body></html>
