<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Identity · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=4">
<style>
.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.frame{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:#f7f5f0;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame span{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;background:rgba(23,25,27,.72);color:#fff;font-size:.62rem;letter-spacing:.03em}
.frame .add{position:absolute;inset:0;opacity:0}
.frame.empty{display:grid;place-items:end stretch}
.frame .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(23,25,27,.72);color:#fff;padding:0}
@media(max-width:640px){.frames{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn" href="index.html">Start</a><a class="navbtn" href="workbench.html">Bench</a><a class="navbtn" href="timegrapher.html">Time</a><a class="navbtn active" href="passport.html" aria-current="page">Identity</a><a class="navbtn" href="business.html">Cost</a><a class="navbtn" href="summary.html">Sheet</a><a class="navbtn" href="inventory.html">Stock</a><a class="navbtn" href="suppliers.html">Parts</a></nav>
<div class="hero"><div><div class="kicker">THIS WATCH</div><h2 id="watchTitle">Identity</h2></div></div>
<section class="card">
<h3>Photographs</h3>
<p class="muted small">Tap a frame to add. Tap the cross to remove. Sales hero is the cover on Start.</p>
<div class="frames" id="slots"></div>
</section>
<section class="card">
<h3>Watch</h3>
<div class="grid2">
<label>Maker<input id="maker"></label><label>Model<input id="model"></label>
<label>Approx. year<input id="year"></label><label>Escapement<input id="escapement"></label>
</div>
<h3>Movement</h3>
<div class="grid2">
<label>Calibre<input id="calibre"></label><label>Movement mm<input id="movementMm" inputmode="decimal" placeholder="pillar plate"></label>
<label>Jewel count<input id="jewels"></label><label>Movement type<input id="movementType" placeholder="bar, 3/4 plate"></label>
<label>Movement serial<input id="serial"></label>
</div>
<h3>Case</h3>
<div class="grid2">
<label>Case number<input id="caseNumber"></label><label>Case reference<input id="reference"></label>
<label>Case material<input id="caseMaterial"></label><label>Width mm<input id="width"></label>
<label>Height mm<input id="height"></label><label>Thickness mm<input id="thickness"></label>
</div>
<label>Identification notes<textarea id="notes" rows="3"></textarea></label>
<label>Research / history<textarea id="history" rows="3"></textarea></label>
<p id="statusText" class="muted small">Loading…</p>
</section></div>
<script src="js/nav.js?v=10"></script>
<script type="module">
import { loadState, saveState, current, PHOTO_SLOTS, compressImage, escapeHtml } from "./js/store.js?v=7";
const $ = id => document.getElementById(id);
const keys = ["maker","model","calibre","movementMm","jewels","movementType","escapement","year","serial","caseNumber","reference","caseMaterial","width","height","thickness","notes","history"];
let state = await loadState();
let job = current(state);
let timer;
function hint(t){ $("statusText").textContent = t; }
function capture(){ keys.forEach(k => job.passport[k] = $(k).value); }
function paint(){ job = current(state); $("watchTitle").textContent = job.watchName; keys.forEach(k => $(k).value = job.passport[k] || ""); paintSlots(); hint("Ready"); }
function paintSlots(){
  $("slots").innerHTML = PHOTO_SLOTS.map(([key, label]) => {
    const src = (job.photos[key] || [])[0] || "";
    const extra = (job.photos[key] || []).length;
    return `<div class="frame${src?"":" empty"}"><img src="${src || ""}" alt="" ${src?"":"hidden"}><span>${escapeHtml(label)}${extra>1?" · "+extra:""}</span>${src?`<button class="x" data-slot="${key}" type="button" aria-label="Remove ${escapeHtml(label)}">×</button>`:""}<input class="add" data-slot="${key}" type="file" accept="image/*" capture="environment"></div>`;
  }).join("");
  $("slots").querySelectorAll(".add").forEach(input => input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    hint("Saving photo…");
    job.photos[input.dataset.slot].push(await compressImage(file));
    await saveState(state);
    paintSlots();
    hint("Saved");
  });
  $("slots").querySelectorAll(".x").forEach(btn => btn.onclick = async (e) => {
    e.preventDefault();
    e.stopPropagation();
    job.photos[btn.dataset.slot].shift();
    await saveState(state);
    paintSlots();
    hint("Removed");
  });
}
keys.forEach(k => $(k).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(async () => { capture(); await saveState(state); hint("Saved"); }, 400); }));
paint();
</script></body></html>
