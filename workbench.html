<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workbench · Calibre & Co.</title><link rel="stylesheet" href="css/app.css">
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn" href="index.html">Jobs</a><a class="navbtn active" href="workbench.html">Workbench</a><a class="navbtn" href="timegrapher.html">Timegrapher</a><a class="navbtn" href="passport.html">Passport</a><a class="navbtn" href="business.html">Business</a></nav>
<div class="hero"><div><div class="kicker">ON THE BENCH</div><h2 id="watchTitle">Loading</h2><p id="stageAim" class="muted"></p></div><div class="hero-stats"><div><span>Stage</span><strong id="stageCounter">1/12</strong></div></div></div>
<div id="stageList" class="stage-list" style="display:flex;gap:6px;overflow:auto;margin-bottom:12px"></div>
<section class="card">
<div class="section-head"><div><div id="stageEyebrow" class="kicker">STAGE 01</div><h2 id="stageTitle">Initial check</h2></div><label class="checkline"><input id="stageComplete" type="checkbox"><span>Stage complete</span></label></div>
<label id="decisionWrap">Decision<select id="decision"><option value="">Not decided</option><option>Leave it</option><option>Regulate only</option><option>Case, hands or crystal</option><option>Partial</option><option>Full service</option></select></label>
<p id="decisionNote" class="muted small"></p>
<div id="steps"></div>
<div class="grid2"><label>Watch name<input id="watchName"></label><label>Condition<select id="stageCondition"><option value="">Not set</option><option>Running</option><option>Running, needs a look</option><option>Stopped</option><option>Slipping wind</option><option>Damaged</option></select></label></div>
<label>Notes<textarea id="stageNotes" rows="4" placeholder="What it did, and what you are not doing."></textarea></label>
<div class="grid2"><label>Parts used<input id="stageParts" placeholder="only if this stage used one"></label><label>Measurement<input id="stageMeasure" placeholder="only if this stage needed one"></label></div>
<div class="subpanel"><div class="section-head"><h3>Photos</h3><label class="btn secondary">Add photo<input id="photoInput" type="file" accept="image/*" hidden></label></div><div id="photoGrid" class="photo-grid"></div></div>
<div class="footer-actions"><button id="prevStage" class="btn secondary" type="button">Previous</button><span class="autosave" id="statusText">Loading…</span><button id="nextStage" class="btn" type="button">Next</button></div>
</section></div>
<script type="module">
import { STAGES, loadState, saveState, current, compressImage } from "./js/store.js";
import { STAGE_COPY } from "./js/stages.js";
const $ = id => document.getElementById(id);
let state = await loadState();
let job = current(state);
let timer;
const stage = () => job.stages[job.stage];
function hint(t){ $("statusText").textContent = t; }
function capture(){
  job.watchName = $("watchName").value;
  job.decision = $("decision").value;
  const s = stage();
  s.notes = $("stageNotes").value;
  s.condition = $("stageCondition").value;
  s.parts = $("stageParts").value;
  s.measure = $("stageMeasure").value;
  s.complete = $("stageComplete").checked;
  s.updatedAt = new Date().toISOString();
}
function schedule(){ clearTimeout(timer); hint("Saving…"); timer = setTimeout(async () => { capture(); await saveState(state); hint("Saved"); }, 400); }
function paintPhotos(){
  const box = $("photoGrid"); box.innerHTML = "";
  (stage().photos||[]).forEach((src, idx) => {
    const d = document.createElement("div"); d.className = "photo"; d.innerHTML = "<img alt=''><button type='button'>×</button>";
    d.querySelector("img").src = src;
    d.querySelector("button").onclick = async () => { stage().photos.splice(idx,1); await saveState(state); paintPhotos(); };
    box.appendChild(d);
  });
}
function paint(){
  job = current(state);
  const name = STAGES[job.stage];
  const copy = STAGE_COPY[name] || { title: name, aim: "", steps: [] };
  const s = stage(); s.checks = s.checks || {};
  $("watchTitle").textContent = job.watchName;
  $("watchName").value = job.watchName || "";
  $("stageCounter").textContent = (job.stage+1)+"/12";
  $("stageEyebrow").textContent = "STAGE "+String(job.stage+1).padStart(2,"0");
  $("stageTitle").textContent = copy.title;
  $("stageAim").textContent = copy.aim;
  $("decision").value = job.decision || "";
  $("decisionWrap").style.display = job.stage === 0 ? "" : "none";
  const leave = job.decision === "Leave it" || job.decision === "Case, hands or crystal";
  $("decisionNote").textContent = job.stage === 0 ? "A running watch with no fault does not get a full service." : leave && job.stage > 0 && job.decision === "Leave it" ? "This job was left. Open a later stage only if you change that." : "";
  $("stageNotes").value = s.notes || "";
  $("stageCondition").value = s.condition || "";
  $("stageParts").value = s.parts || "";
  $("stageMeasure").value = s.measure || "";
  $("stageComplete").checked = !!s.complete;
  const box = $("steps"); box.innerHTML = "";
  copy.steps.forEach((text,i) => {
    const label = document.createElement("label"); label.className = "checkline"; label.style.margin = "8px 0";
    const input = document.createElement("input"); input.type = "checkbox"; input.checked = !!s.checks[i];
    input.onchange = async () => { s.checks[i] = input.checked; await saveState(state); hint("Step saved"); };
    const span = document.createElement("span"); span.textContent = text;
    label.appendChild(input); label.appendChild(span); box.appendChild(label);
  });
  const list = $("stageList"); list.innerHTML = "";
  STAGES.forEach((key,i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "stage-btn"+(i===job.stage?" active":"");
    b.textContent = String(i+1).padStart(2,"0")+" "+(STAGE_COPY[key]?STAGE_COPY[key].title:key);
    b.onclick = async () => { capture(); job.stage = i; await saveState(state); paint(); };
    list.appendChild(b);
  });
  paintPhotos();
  hint("On "+copy.title);
}
["watchName","stageNotes","stageParts","stageMeasure"].forEach(id => $(id).addEventListener("input", schedule));
["stageCondition","stageComplete","decision"].forEach(id => $(id).addEventListener("change", () => { schedule(); if (id==="decision") paint(); }));
paint();
$("prevStage").onclick = async () => { capture(); job.stage = Math.max(0, job.stage-1); await saveState(state); paint(); };
$("nextStage").onclick = async () => { capture(); job.stage = Math.min(11, job.stage+1); await saveState(state); paint(); };
$("photoInput").onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  const s = stage(); s.photos = s.photos || [];
  if (s.photos.length >= 8){ hint("Eight photos already."); return; }
  s.photos.push(await compressImage(file)); await saveState(state); paintPhotos(); hint("Photo saved");
};
</script></body></html>
