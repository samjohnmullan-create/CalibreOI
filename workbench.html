<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191b">
<title>Workbench · Calibre & Co.</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <header class="brandbar">
    <a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a>
  </header>
  <nav class="mainnav">
    <a class="navbtn" href="index.html">Jobs</a>
    <a class="navbtn active" href="workbench.html">Workbench</a>
    <a class="navbtn" href="timegrapher.html">Timegrapher</a>
    <a class="navbtn" href="passport.html">Passport</a>
    <a class="navbtn" href="business.html">Business</a>
    <a class="navbtn" href="assistant.html">Brief</a>
  </nav>
  <div class="hero">
    <div><div class="kicker">ACTIVE RESTORATION</div><h2 id="watchTitle">Loading</h2><p class="muted" id="watchSub">Stage notes stay on this phone.</p></div>
    <div class="hero-stats"><div><span>Stage</span><strong id="stageCounter">1/12</strong></div></div>
  </div>
  <div id="stageList" class="stage-list" style="display:flex;gap:6px;overflow:auto;margin-bottom:12px"></div>
  <section class="card">
    <div class="section-head">
      <div><div id="stageEyebrow" class="kicker">STAGE 01</div><h2 id="stageTitle">Intake</h2></div>
      <label class="checkline"><input id="stageComplete" type="checkbox"><span>Complete</span></label>
    </div>
    <label>Watch name<input id="watchName"></label>
    <label>Notes<textarea id="stageNotes" rows="6" placeholder="What you found, what you did, what to revisit."></textarea></label>
    <label>Measurement<input id="stageMeasure" placeholder="arbor 1.20 mm"></label>
    <div class="footer-actions">
      <button id="prevStage" class="btn secondary" type="button">Previous</button>
      <span class="autosave" id="statusText">Buttons ready</span>
      <button id="nextStage" class="btn" type="button">Next</button>
    </div>
  </section>
</div>
<script>
(function(){
  var STAGES = ["Intake","Demagnetising","Strip-down","Inspection","Cleaning","Barrel & Mainspring","Train Test","Escapement","Balance","Lubrication","Regulation","Final QC"];
  var $ = function(id){ return document.getElementById(id); };
  var state = null, job = null;
  function blank(){ return { notes:"", condition:"", parts:"", measure:"", complete:false, photos:[], updatedAt:null }; }
  function hint(t){ $("statusText").textContent = t; }
  function openDB(){
    return new Promise(function(res, rej){
      var r = indexedDB.open("calibre-co-v1", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  function readState(){
    return openDB().then(function(db){
      return new Promise(function(res, rej){
        var g = db.transaction("kv").objectStore("kv").get("state");
        g.onsuccess = function(){ res(g.result); };
        g.onerror = function(){ rej(g.error); };
      });
    });
  }
  function writeState(){
    return openDB().then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction("kv", "readwrite");
        tx.objectStore("kv").put(state, "state");
        tx.oncomplete = res;
        tx.onerror = function(){ rej(tx.error); };
      });
    });
  }
  function current(){
    if (!state || !state.jobs || !state.jobs.length) return null;
    return state.jobs.filter(function(j){ return j.id === state.currentId; })[0] || state.jobs[0];
  }
  function capture(){
    if (!job) return;
    job.watchName = $("watchName").value;
    var s = job.stages[job.stage];
    s.notes = $("stageNotes").value;
    s.measure = $("stageMeasure").value;
    s.complete = $("stageComplete").checked;
    s.updatedAt = new Date().toISOString();
  }
  function paint(){
    job = current();
    if (!job){ hint("No job on this phone."); return; }
    job.stage = job.stage || 0;
    job.stages = job.stages || [];
    while (job.stages.length < 12) job.stages.push(blank());
    var s = job.stages[job.stage];
    $("watchTitle").textContent = job.watchName || "Watch";
    $("watchName").value = job.watchName || "";
    $("stageCounter").textContent = (job.stage + 1) + "/12";
    $("stageEyebrow").textContent = "STAGE " + String(job.stage + 1).padStart(2, "0");
    $("stageTitle").textContent = STAGES[job.stage];
    $("stageNotes").value = s.notes || "";
    $("stageMeasure").value = s.measure || "";
    $("stageComplete").checked = !!s.complete;
    var box = $("stageList");
    box.innerHTML = "";
    STAGES.forEach(function(name, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "stage-btn" + (i === job.stage ? " active" : "");
      b.textContent = String(i + 1).padStart(2, "0") + " " + name;
      b.onclick = function(){ go(i); };
      box.appendChild(b);
    });
    hint("On " + STAGES[job.stage]);
  }
  function go(i){
    if (!job){ hint("No job loaded yet."); return; }
    capture();
    job.stage = Math.max(0, Math.min(11, i));
    paint();
    writeState().then(function(){ hint("Saved · " + STAGES[job.stage]); }).catch(function(){ hint("Moved, save failed."); });
  }
  $("nextStage").addEventListener("click", function(){ go((job ? job.stage : 0) + 1); });
  $("prevStage").addEventListener("click", function(){ go((job ? job.stage : 0) - 1); });
  hint("Buttons ready");
  readState().then(function(saved){
    state = saved;
    if (!state || !state.jobs || !state.jobs.length){
      state = { jobs: [{ id: "job-local", jobId: "CCO-0001", watchName: "Untitled watch", status: "on the bench", stage: 0, stages: [], timingRuns: [], passport: {}, business: {} }], currentId: "job-local" };
    }
    paint();
  }).catch(function(err){ hint("Could not open the job store: " + (err && err.message ? err.message : "unknown")); });
})();
</script>
</body>
</html>
