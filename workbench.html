<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workbench · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=14">
<style>
.wb-toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}.wb-toolbar button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 11px;border-radius:9px;font:inherit;font-size:.74rem}.wb-toolbar button.on{color:var(--ink);border-color:var(--accent);background:var(--surface-2)}
.wb-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:0 0 12px}.wb-summary .card{padding:10px 12px;border-radius:10px}.wb-summary span{display:block;color:var(--muted);font-size:.68rem}.wb-summary strong{display:block;font-size:1.05rem;margin-top:2px}.wb-section{margin:0 0 16px}.wb-section h3{display:flex;align-items:center;gap:7px;margin:0 0 8px;font-size:.92rem}.count{font-size:.67rem;color:var(--muted);font-weight:700}
.wb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:8px}.hub-card{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:11px;color:inherit;position:relative;cursor:pointer}.hub-card:hover{border-color:var(--accent)}.hub-card.priority{box-shadow:inset 3px 0 0 var(--accent)}.hub-card.queued{opacity:.88}.hub-thumb{width:54px;height:54px;border-radius:9px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-weight:800}.hub-main{min-width:0}.hub-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.hub-title{font-weight:800;font-size:.88rem;line-height:1.18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hub-sub{font-size:.68rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hub-line{display:grid;grid-template-columns:54px minmax(0,1fr);gap:6px;font-size:.75rem;line-height:1.3;margin-top:7px}.hub-line strong{font-size:.61rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.hub-line.blocked{color:var(--danger)}.hub-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.pill{font-size:.64rem;border:1px solid var(--line);padding:3px 6px;border-radius:999px;color:var(--muted)}.pill.warn{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}.pill.work{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}.hub-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.hub-actions button{font:inherit;font-size:.67rem;padding:5px 7px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}.hub-actions .primary{border-color:var(--accent);background:var(--surface-2);color:var(--ink);font-weight:700}.empty{padding:18px;border:1px dashed var(--line);border-radius:11px;color:var(--muted)}
@media(min-width:1000px){.wb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:850px){.wb-summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.wb-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.wb-grid{grid-template-columns:1fr}.hub-card{grid-template-columns:58px minmax(0,1fr);padding:10px}.hub-thumb{width:58px;height:58px}.hub-title,.hub-sub{white-space:normal}.hub-actions{grid-column:1/-1}.hub-actions .primary{flex:1 1 100%;min-height:38px}.hub-line{grid-template-columns:46px minmax(0,1fr)}}
</style></head><body>
<div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Workbench</h1></div></a></header><nav class="mainnav"></nav>
<div class="hero"><div><div class="kicker">WORKBENCH</div><h2>What are you working on?</h2><p class="muted">Active and queued Work only. Open an Item for identity, research, media and commercial detail.</p></div></div>
<div id="summary" class="wb-summary"></div><div id="toolbar" class="wb-toolbar"></div><div id="content"></div></div>
<script src="js/nav.js?v=63"></script>
<script type="module">
import {loadState,saveState,money,escapeHtml} from './js/store.js?v=8';
import {workbenchEntries,mutateWorkbenchEntry} from './js/workbench-model.js?v=1';
const esc=escapeHtml,$=id=>document.getElementById(id);let state,filter=new URLSearchParams(location.search).get('view')==='queue'?'Queue':'Active';
const isClosed=e=>e.group==='Closed',isQueued=e=>e.queued===true,isActive=e=>!isClosed(e)&&!isQueued(e);
function card(entry){
  const img=entry.cover||'',id=esc(entry.key),queued=isQueued(entry),initial=(entry.title||'I').trim().charAt(0).toUpperCase(),blockers=entry.blockers||[];
  const value=entry.potential?`${money(entry.potential)} potential`:entry.targetSale?`${money(entry.targetSale)} target`:entry.cashIn?`${money(entry.cashIn)} invested`:'';
  return `<article class="hub-card${entry.priority?' priority':''}${queued?' queued':''}" data-key="${id}">${img?`<img class="hub-thumb" src="${esc(img)}" alt="">`:`<div class="hub-thumb">${esc(initial)}</div>`}<div class="hub-main"><div class="hub-top"><div><div class="hub-title">${esc(entry.title)}</div><div class="hub-sub">${esc(entry.subtitle)}</div></div><span class="pill work">${queued?'Queue':'Work'}</span></div><div class="hub-line"><strong>Next</strong><span>${esc(entry.nextAction||'Review work')}</span></div>${blockers.length?`<div class="hub-line blocked"><strong>Blocked</strong><span>${blockers.map(esc).join(' · ')}</span></div>`:''}<div class="hub-meta">${value?`<span class="pill">${value}</span>`:''}${entry.ageDays?`<span class="pill">${entry.ageDays}d</span>`:''}${entry.priority?'<span class="pill work">Priority</span>':''}</div><div class="hub-actions"><button data-act="open" class="primary" type="button">Open work</button><button data-act="bench" type="button">${queued?'Add to bench':'Move to queue'}</button><button data-act="priority" type="button">${entry.priority?'Unpin':'Prioritise'}</button>${!queued&&entry.group!=='Waiting'&&entry.group!=='Closed'?'<button data-act="wait" type="button">Waiting</button>':''}</div></div></article>`;
}
function openEntry(entry){location.href=entry.openHref;}
function paint(){const entries=workbenchEntries(state),active=entries.filter(isActive),queue=entries.filter(isQueued),attention=active.filter(e=>e.group==='Needs attention'||e.blockers.length),waiting=active.filter(e=>e.group==='Waiting'),ready=active.filter(e=>e.group==='Ready');$('summary').innerHTML=`<div class="card"><span>Active</span><strong>${active.length}</strong></div><div class="card"><span>Queue</span><strong>${queue.length}</strong></div><div class="card"><span>Attention</span><strong>${attention.length}</strong></div><div class="card"><span>Waiting</span><strong>${waiting.length}</strong></div><div class="card"><span>Ready</span><strong>${ready.length}</strong></div>`;const filters=['Active','Queue','Priority','Needs attention','Waiting','Ready','All'];$('toolbar').innerHTML=filters.map(x=>`<button class="${filter===x?'on':''}" data-filter="${x}" type="button">${x}</button>`).join('');$('toolbar').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;paint();});let pool=entries.slice();if(filter==='Active')pool=active;else if(filter==='Queue')pool=queue;else if(filter==='Priority')pool=active.filter(e=>e.priority);else if(filter==='Needs attention')pool=attention;else if(filter==='Waiting')pool=waiting;else if(filter==='Ready')pool=ready;pool.sort((a,b)=>(Number(!!b.priority)-Number(!!a.priority))||(b.ageDays-a.ageDays));const order=['On bench','Needs attention','Waiting','Ready','Queue','Closed'],groups={};pool.forEach(entry=>(groups[entry.group]??=[]).push(entry));$('content').innerHTML=order.map(group=>groups[group]?.length?`<section class="wb-section"><h3>${group} <span class="count">${groups[group].length}</span></h3><div class="wb-grid">${groups[group].map(card).join('')}</div></section>`:'').join('')||'<div class="empty">Nothing matches this view.</div>';document.querySelectorAll('.hub-card').forEach(el=>{el.onclick=async event=>{const entry=workbenchEntries(state).find(row=>row.key===el.dataset.key);if(!entry)return;const action=event.target?.dataset?.act;if(!action){openEntry(entry);return;}event.preventDefault();event.stopPropagation();if(action==='open'){openEntry(entry);return;}if(mutateWorkbenchEntry(state,entry,action)){await saveState(state);paint();}};});}
try{state=await loadState();state.workRecords=Array.isArray(state.workRecords)?state.workRecords:[];paint();}catch(err){$('content').innerHTML=`<div class="empty">Workbench could not load: ${esc(err?.message||'Unknown error')}</div>`;}
</script></body></html>
