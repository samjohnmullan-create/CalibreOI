<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workbench · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=12">
<style>
.wb-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.wb-toolbar button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 12px;border-radius:10px;font:inherit}.wb-toolbar button.on{color:var(--ink);border-color:var(--brass);background:var(--surface-2)}
.wb-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}.wb-summary .card{padding:14px}.wb-summary span{display:block;color:var(--muted);font-size:.78rem}.wb-summary strong{display:block;font-size:1.25rem;margin-top:3px}
.wb-section{margin:0 0 18px}.wb-section h3{display:flex;align-items:center;gap:8px}.count{font-size:.72rem;color:var(--muted);font-weight:700}
.wb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}.hub-card{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;text-decoration:none;color:inherit;position:relative}.hub-card:hover{border-color:var(--brass)}.hub-card.priority{box-shadow:inset 3px 0 0 var(--brass)}.hub-thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line)}.hub-main{min-width:0}.hub-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.hub-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hub-sub{font-size:.78rem;color:var(--muted);margin-top:2px}.hub-line{font-size:.82rem;margin-top:9px}.hub-line strong{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:5px}.hub-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.pill{font-size:.72rem;border:1px solid var(--line);padding:4px 7px;border-radius:999px;color:var(--muted)}.pill.warn{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}.hub-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.hub-actions button{font:inherit;font-size:.74rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
@media(max-width:700px){.wb-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.wb-grid{grid-template-columns:1fr}}
</style></head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"></nav>
<div class="hero"><div><div class="kicker">WORKBENCH</div><h2>Operations hub</h2><p class="muted">Everything currently moving through Calibre — what needs attention, what is waiting, and what is ready next.</p></div></div>
<div id="summary" class="wb-summary"></div>
<div id="toolbar" class="wb-toolbar"></div>
<div id="content"></div>
</div>
<script src="js/nav.js?v=60"></script>
<script type="module">
import { loadState, saveState, money, cashOut, cashProfit, coverPhoto, escapeHtml, stockAge } from "./js/store.js?v=26";
const esc=escapeHtml,$=id=>document.getElementById(id);let state,filter="Active";
const STATUS_GROUP={"Purchased":"Needs attention","Awaiting inspection":"Needs attention","On bench":"On bench","Awaiting parts":"Waiting","Ready for photos":"Ready","Ready to list":"Ready","Listed":"Ready","Sold":"Closed","Spares":"Closed"};
function nextAction(j){if(j.nextAction)return j.nextAction;if(j.status==="Awaiting parts")return "Receive or source required parts";if(j.status==="Purchased"||j.status==="Awaiting inspection")return "Inspect and diagnose";if(j.status==="Ready for photos")return "Photograph for listing";if(j.status==="Ready to list")return "Create listing";if(j.status==="Listed")return "Monitor sale / offers";if(j.status==="Spares")return "Catalogue donor parts";if((j.parts||[]).some(p=>!p.received))return "Check outstanding parts";if(j.diagnosis&&!j.repairPerformed)return "Continue repair";return "Review job and choose next action";}
function blockers(j){const out=[];if(j.status==="Awaiting parts")out.push("Waiting on parts");const missing=(j.parts||[]).filter(p=>!p.received).length;if(missing)out.push(missing+" part"+(missing===1?"":"s")+" outstanding");const critical=(j.faults||[]).filter(f=>f.severity==="Critical"||f.severity==="Parts required").length;if(critical)out.push(critical+" major fault"+(critical===1?"":"s"));if(j.writeOff)out.push("Write-off review");return out;}
function groupOf(j){return STATUS_GROUP[j.status]||"Needs attention";}
function card(j){const img=coverPhoto(j),b=blockers(j),profit=cashProfit(j.business||{}),age=stockAge(j),id=esc(j.id||"");return `<article class="hub-card${j.priority?" priority":""}" data-id="${id}">${img?`<img class="hub-thumb" src="${img}" alt="">`:`<div class="hub-thumb"></div>`}<div class="hub-main"><div class="hub-top"><div><div class="hub-title">${esc(j.watchName||"Untitled watch")}</div><div class="hub-sub">${esc(j.jobId||"")} · ${esc(j.status||"On bench")}</div></div>${j.priority?'<span class="pill">Priority</span>':''}</div><div class="hub-line"><strong>Next</strong>${esc(nextAction(j))}</div>${j.diagnosis?`<div class="hub-line"><strong>Diagnosis</strong>${esc(j.diagnosis)}</div>`:""}<div class="hub-meta"><span class="pill">${money(cashOut(j.business||{}))} in</span>${Number(j.business?.targetSale)?`<span class="pill">${money(j.business.targetSale)} target</span>`:""}${profit?`<span class="pill">${money(profit)} potential</span>`:""}${age?`<span class="pill">${age}d</span>`:""}${b.map(x=>`<span class="pill warn">${esc(x)}</span>`).join("")}</div><div class="hub-actions"><button data-act="open" type="button">Open record</button><button data-act="priority" type="button">${j.priority?"Unpin":"Prioritise"}</button>${j.status!=="Awaiting parts"&&j.status!=="Sold"&&j.status!=="Spares"?'<button data-act="wait" type="button">Await parts</button>':""}</div></div></article>`;}
function paint(){const jobs=state.jobs||[],active=jobs.filter(j=>!["Sold","Spares"].includes(j.status)),attention=active.filter(j=>groupOf(j)==="Needs attention"||blockers(j).length),waiting=active.filter(j=>groupOf(j)==="Waiting"),ready=active.filter(j=>groupOf(j)==="Ready");$("summary").innerHTML=`<div class="card"><span>Active</span><strong>${active.length}</strong></div><div class="card"><span>Needs attention</span><strong>${attention.length}</strong></div><div class="card"><span>Waiting</span><strong>${waiting.length}</strong></div><div class="card"><span>Ready</span><strong>${ready.length}</strong></div>`;const filters=["Active","Priority","Needs attention","Waiting","Ready","All"];$("toolbar").innerHTML=filters.map(x=>`<button class="${filter===x?"on":""}" data-filter="${x}" type="button">${x}</button>`).join("");$("toolbar").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;paint();});let pool=jobs.slice();if(filter==="Active")pool=active;else if(filter==="Priority")pool=active.filter(j=>j.priority);else if(filter==="Needs attention")pool=attention;else if(filter==="Waiting")pool=waiting;else if(filter==="Ready")pool=ready;pool.sort((a,b)=>(Number(!!b.priority)-Number(!!a.priority))||(new Date(b.updatedAt||0)-new Date(a.updatedAt||0)));const order=["On bench","Needs attention","Waiting","Ready","Closed"],groups={};pool.forEach(j=>(groups[groupOf(j)]??=[]).push(j));$("content").innerHTML=order.map(g=>groups[g]?.length?`<section class="wb-section"><h3>${g} <span class="count">${groups[g].length}</span></h3><div class="wb-grid">${groups[g].map(card).join("")}</div></section>`:"").join("")||'<div class="empty">Nothing matches this view.</div>';document.querySelectorAll(".hub-card").forEach(el=>{el.onclick=async e=>{const act=e.target?.dataset?.act,id=el.dataset.id,j=state.jobs.find(x=>x.id===id);if(!j)return;if(act){e.preventDefault();e.stopPropagation();if(act==="priority")j.priority=!j.priority;if(act==="wait")j.status="Awaiting parts";if(act==="open"){state.currentId=id;await saveState(state);location.href="summary.html";return;}await saveState(state);paint();return;}state.currentId=id;await saveState(state);location.href="summary.html";};});}
try{state=await loadState();paint();}catch(err){$("content").innerHTML=`<div class="empty">Workbench could not load: ${esc(err?.message||"Unknown error")}</div>`;}
</script></body></html>
