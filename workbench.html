<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workbench · Calibre & Co.</title><link rel="stylesheet" href="css/app.css">
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn" href="index.html">Jobs</a><a class="navbtn active" href="workbench.html">Workbench</a><a class="navbtn" href="timegrapher.html">Timegrapher</a><a class="navbtn" href="passport.html">Passport</a><a class="navbtn" href="business.html">Business</a></nav>
<div class="hero"><div><div class="kicker">ACTIVE RESTORATION</div><h2 id="watchTitle">Loading</h2></div><div class="hero-stats"><div><span>Stage</span><strong id="stageCounter">1/12</strong></div></div></div>
<div id="stageList" class="stage-list" style="display:flex;gap:6px;overflow:auto;margin-bottom:12px"></div>
<section class="card">
<div class="section-head"><div><div id="stageEyebrow" class="kicker">STAGE 01</div><h2 id="stageTitle">Intake</h2></div><label class="checkline"><input id="stageComplete" type="checkbox"><span>Stage complete</span></label></div>
<div id="steps"></div>
<div class="grid2"><label>Watch name<input id="watchName"></label><label>Condition<select id="stageCondition"><option value="">Not set</option><option>Good</option><option>Serviceable</option><option>Needs attention</option><option>Damaged</option><option>Replaced</option></select></label></div>
<label>Notes<textarea id="stageNotes" rows="4"></textarea></label>
<div class="grid2"><label>Parts / consumables<input id="stageParts" placeholder="mainspring, 9010"></label><label>Measurement<input id="stageMeasure" placeholder="arbor 1.20 mm"></label></div>
<div class="subpanel"><div class="section-head"><h3>Stage photos</h3><label class="btn secondary">Add photo<input id="photoInput" type="file" accept="image/*" hidden></label></div><div id="photoGrid" class="photo-grid"></div></div>
<div class="footer-actions"><button id="prevStage" class="btn secondary" type="button">Previous</button><span class="autosave" id="statusText">Loading…</span><button id="nextStage" class="btn" type="button">Next</button></div>
</section></div>
<script type="module">
import { STAGES, loadState, saveState, current, compressImage } from "./js/store.js";
const STEPS = {
"Intake":["Record maker, model, calibre, serial and jewel count","Wind and set. Note slip, knock, or a stop","Dial up and pendant up before it comes apart","Note hands, crystal, bow and stem"],
"Demagnetising":["Draw the movement out of the coil slowly","Do not stop it in the field","Check for residual pull","Demagnetise again after assembly"],
"Strip-down":["Let the mainspring down before the ratchet screw","Hands off, dial off, dial-foot screws with the dial","Motion works, then the train. Balance last","Screws stay with their bridge"],
"Inspection":["Peg each jewel hole","Pivots bent, scored, or to burnish","Endshake and sideshake","Escape teeth, pallet stones, guard pin","Staff pivots, roller jewel, hairspring","Barrel hook, bridle and wall"],
"Cleaning":["Pegwood until the peg comes out clean","Pith the pivots","Lighter fluid or naphtha, then rinse","Isopropyl off the dial and off shellac","Ultrasonic for plates and steel only","Not the dial, pallet fork, or shellacked hairspring","Rinse, dry, peg again","Hairspring in one-dip or naphtha, dry flat"],
"Barrel & Mainspring":["Let down before the cover comes off","Hook and cover snap","Blued spring: oil the wall only","White alloy: do not oil","Slipping wind: bridle or polished wall","Confirm it hooks"],
"Train Test":["Train in, balance out","One turn, free rundown","Endshake on each arbor","No tight hole, no rubbing wheel"],
"Escapement":["Lock, drop and draw","Guard pin through the passing hollow","Roller jewel firm","Set the beat before a rate"],
"Balance":["Staff pivots straight","Hairspring flat, round, centred","Overcoil clear of the stud","Poise if the rate changes by position"],
"Lubrication":["Train pivots 9010, not on the leaves","Pallet stones 9415","Escape teeth, a film","Barrel wall HP1300 only if blued","Keyless D5, not on the clutch","No oil on the hairspring"],
"Regulation":["Dial up, dial down, pendant up, pendant down","Rate, then beat error","Small regulator move, then rerun","Do not move on a dirty signal"],
"Final QC":["Wind and set a full turn","Hands clear","Case screws and dust cover","Demagnetise again","A day on the rack"]
};
const $ = id => document.getElementById(id);
let state = await loadState();
let job = current(state);
let timer;
const stage = () => job.stages[job.stage];
function hint(t){ $("statusText").textContent = t; }
function capture(){
  job.watchName = $("watchName").value;
  const s = stage();
  s.notes = $("stageNotes").value;
  s.condition = $("stageCondition").value;
  s.parts = $("stageParts").value;
  s.measure = $("stageMeasure").value;
  s.complete = $("stageComplete").checked;
  s.updatedAt = new Date().toISOString();
}
function schedule(){ clearTimeout(timer); hint("Saving…"); timer = setTimeout(async () => { capture(); await saveState(state); hint("Saved"); }, 400); }
function paintPhotos(){
  const box = $("photoGrid"); box.innerHTML = "";
  (stage().photos||[]).forEach((src, idx) => {
    const d = document.createElement("div"); d.className = "photo"; d.innerHTML = "<img alt=''><button type='button'>×</button>";
    d.querySelector("img").src = src;
    d.querySelector("button").onclick = async () => { stage().photos.splice(idx,1); await saveState(state); paintPhotos(); };
    box.appendChild(d);
  });
}
function paint(){
  job = current(state);
  const s = stage(); s.checks = s.checks || {};
  $("watchTitle").textContent = job.watchName;
  $("watchName").value = job.watchName || "";
  $("stageCounter").textContent = (job.stage+1)+"/12";
  $("stageEyebrow").textContent = "STAGE "+String(job.stage+1).padStart(2,"0");
  $("stageTitle").textContent = STAGES[job.stage];
  $("stageNotes").value = s.notes || "";
  $("stageCondition").value = s.condition || "";
  $("stageParts").value = s.parts || "";
  $("stageMeasure").value = s.measure || "";
  $("stageComplete").checked = !!s.complete;
  const box = $("steps"); box.innerHTML = "";
  (STEPS[STAGES[job.stage]]||[]).forEach((text,i) => {
    const label = document.createElement("label"); label.className = "checkline"; label.style.margin = "8px 0";
    const input = document.createElement("input"); input.type = "checkbox"; input.checked = !!s.checks[i];
    input.onchange = async () => { s.checks[i] = input.checked; await saveState(state); hint("Step saved"); };
    const span = document.createElement("span"); span.textContent = text;
    label.appendChild(input); label.appendChild(span); box.appendChild(label);
  });
  const list = $("stageList"); list.innerHTML = "";
  STAGES.forEach((name,i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "stage-btn"+(i===job.stage?" active":"");
    b.textContent = String(i+1).padStart(2,"0")+" "+name;
    b.onclick = async () => { capture(); job.stage = i; await saveState(state); paint(); };
    list.appendChild(b);
  });
  paintPhotos();
  hint("On "+STAGES[job.stage]);
}
["watchName","stageNotes","stageParts","stageMeasure"].forEach(id => $(id).addEventListener("input", schedule));
["stageCondition","stageComplete"].forEach(id => $(id).addEventListener("change", schedule));
$("prevStage").onclick = async () => { capture(); job.stage = Math.max(0, job.stage-1); await saveState(state); paint(); };
$("nextStage").onclick = async () => { capture(); job.stage = Math.min(11, job.stage+1); await saveState(state); paint(); };
$("photoInput").onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  const s = stage(); s.photos = s.photos || [];
  if (s.photos.length >= 8){ hint("Eight photos already."); return; }
  s.photos.push(await compressImage(file));
  await saveState(state); paintPhotos(); hint("Photo saved");
};
paint();
</script></body></html>
