<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workbench · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=10">
<style>
.stage-list{display:flex;gap:8px;overflow:auto;margin-bottom:12px;min-height:92px;padding-bottom:2px}.stage-list .stage-btn{min-width:156px;min-height:90px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:3px;padding:28px 12px 11px;position:relative;background:var(--surface);color:var(--muted);text-align:left}.stage-list .stage-btn.active{background:var(--surface-2);color:var(--ink);border-color:var(--brass)}.stage-list .stage-check{position:absolute;top:9px;right:9px;width:18px;height:18px;border:1.5px solid var(--line);border-radius:4px;display:grid;place-items:center;font-size:.72rem;color:#fff}.stage-list .stage-btn.done .stage-check{background:var(--ok);border-color:var(--ok)}.stage-list .stage-num{font-size:.78rem;color:var(--brass);font-weight:800;font-variant-numeric:tabular-nums}.stage-list .stage-name{font-size:.88rem;line-height:1.15;font-weight:750}.stage-list .stage-btn.upto:not(.active){box-shadow:inset 0 -2px 0 var(--brass)}
.type.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}.workflow-note{border-left:3px solid var(--brass);padding:10px 12px;margin:10px 0;background:var(--surface-2);font-size:.8rem}.question-hidden{display:none}.yn.followup{margin-left:18px;padding-left:12px;border-left:2px solid var(--line)}.section-block{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.section-block h3{margin:0 0 8px}.parts-card{padding:10px;margin-top:8px}.danger-note{color:var(--danger);font-weight:700}.stage-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stage-meta .badge{background:var(--surface-2)}
</style>
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"></nav>
<div class="hero"><div><div class="kicker">ON THE BENCH</div><h2 id="watchTitle">Reading job…</h2><p id="stageAim" class="muted"></p></div><div class="hero-stats"><div><span>Workflow</span><strong id="stageCounter">—</strong></div></div></div>
<div id="stageList" class="stage-list"></div>
<section class="card">
<div class="section-head"><div><div id="stageEyebrow" class="kicker">STAGE</div><h2 id="stageTitle">Assessment</h2><div class="stage-meta"><span id="stageState" class="badge">In progress</span></div></div><label class="checkline"><input id="stageComplete" type="checkbox"><span>Stage complete</span></label></div>

<div class="section-block" style="margin-top:8px;padding-top:0;border-top:0"><h3>Job path</h3><div id="jobTypes" class="row"></div>
<label style="margin-top:10px">Service decision<select id="decision"><option value="">Not decided</option><option>Leave it</option><option>Regulate only</option><option>Case, hands or crystal</option><option>Partial</option><option>Full service</option></select></label>
<div id="decisionNote" class="workflow-note"></div></div>

<div id="steps" class="section-block"></div>
<div id="faults" class="section-block"></div>

<div class="section-block"><h3>Bench record</h3>
<div class="grid2"><label>Watch name<input id="watchName"></label><label>Condition<select id="stageCondition"><option value="">Not set</option><option>Running</option><option>Running, needs a look</option><option>Stopped</option><option>Slipping wind</option><option>Damaged</option></select></label></div>
<label>Diagnosis<textarea id="diagnosis" rows="3" placeholder="What you found — not what you did."></textarea></label>
<label>Repair performed<textarea id="repair" rows="3" placeholder="What you actually repaired or adjusted."></textarea></label>
<label>Stage notes<textarea id="stageNotes" rows="4"></textarea></label>
<label>Measurement / result<input id="stageMeasure" placeholder="Rate, endshake, measurement, observation…"></label></div>

<div id="parts" class="section-block"></div>
<div class="section-block"><h3>Labour & status</h3><div class="row" id="timerRow"><button id="timerBtn" class="btn" type="button">Start timer</button><span id="timerRead" class="muted small"></span><button id="awaitParts" class="btn secondary" type="button">Awaiting parts</button></div></div>

<div class="section-block"><h3>Stage photos</h3><div class="row"><a class="btn secondary" href="passport.html">Identity</a><a class="btn secondary" href="business.html">Cost</a><button id="takeStage" class="btn secondary" type="button">Take photo</button><button id="uploadStage" class="btn secondary" type="button">Upload</button></div><input id="stagePhoto" type="file" accept="image/*" hidden><div id="stageShots" style="display:flex;gap:8px;overflow:auto;margin-top:10px"></div></div>

<div class="footer-actions"><button id="prevStage" class="btn secondary" type="button">Previous</button><button id="completeJob" class="btn" type="button">Complete job</button><button id="writeOff" class="btn secondary" type="button">Write off</button><button id="nextStage" class="btn" type="button">Next</button></div>
<p class="autosave" id="statusText">Loading…</p>
</section></div>
<script src="js/nav.js?v=22"></script>
<script type="module">
import { loadState, saveState, current, markSpares, compressImage, stagesFor, JOB_TYPES, FAULT_CHIPS, SEVERITIES, normalise, blankPart, partsCost, money } from "./js/store.js?v=25";
import { STAGE_COPY } from "./js/stages.js?v=10";
const $=id=>document.getElementById(id);
let state={jobs:[],currentId:null}, job, timer;
try{state=await Promise.race([loadState(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("Jobs are slow to read.")),5000))]);}catch(err){$("statusText").textContent=err.message||"Jobs could not load.";}
job=current(state);
if(!job){$("watchTitle").textContent="No watch open";$("statusText").textContent="Pick a watch on Home.";}else init();

function init(){
  const path=()=>stagesFor(job), stage=()=>job.stages[job.stage];
  const hint=t=>$("statusText").textContent=t;
  function capture(){job.watchName=$("watchName").value;job.diagnosis=$("diagnosis").value;job.repairPerformed=$("repair").value;const s=stage();if(!s)return;s.notes=$("stageNotes").value;s.condition=$("stageCondition").value;s.measure=$("stageMeasure").value;s.complete=$("stageComplete").checked;s.updatedAt=new Date().toISOString();}
  function schedule(){clearTimeout(timer);hint("Saving…");timer=setTimeout(async()=>{capture();await saveState(state);hint("Saved");},350);}
  function stepObj(step,i){return typeof step==="string"?{id:String(i),text:step}:step;}
  function stageByName(name){return (job.stages||[]).find(s=>s.name===name);}
  function answer(s,step,i){const o=stepObj(step,i),c=s&&s.checks||{};return c[o.id]??c[i]??"";}
  function conditionMatches(actual,rule){if(Array.isArray(rule.values))return rule.values.includes(actual);return actual===rule.value;}
  function visible(s,step,i){const o=stepObj(step,i);if(o.when){const dep=(STAGE_COPY[s.name]?.steps||[]).findIndex((x,n)=>stepObj(x,n).id===o.when.id);if(dep<0)return true;if(!conditionMatches(answer(s,(STAGE_COPY[s.name].steps||[])[dep],dep),o.when))return false;}if(o.whenGlobal){const other=stageByName(o.whenGlobal.stage);if(!other)return false;const defs=STAGE_COPY[o.whenGlobal.stage]?.steps||[];const di=defs.findIndex((x,n)=>stepObj(x,n).id===o.whenGlobal.id);if(di<0||!conditionMatches(answer(other,defs[di],di),o.whenGlobal))return false;}return true;}
  function applicableSteps(s,key){const defs=STAGE_COPY[key]?.steps||[];return defs.map((x,i)=>({step:x,i})).filter(x=>visible(s,x.step,x.i));}
  function stageDone(s,key){if(!s)return false;if(s.complete)return true;const app=applicableSteps(s,key);return app.length>0&&app.every(({step,i})=>["yes","na",true].includes(answer(s,step,i)));}
  function elapsedMinutes(){if(!job.labour?.running||!job.labour.startedAt)return 0;return Math.max(0,(Date.now()-new Date(job.labour.startedAt).getTime())/60000);}
  function syncParts(){if(job.parts.length)job.business.partsCost=String(Math.round(partsCost(job)*100)/100);}

  async function changeDecision(value){capture();job.decision=value;const oldName=stage()?.name||"Intake";normalise(job);const idx=job.stages.findIndex(s=>s.name===oldName);job.stage=idx>=0?idx:0;await saveState(state);paint();hint("Workflow updated for: "+(value||"not decided"));}

  function paintFaults(){const chips=FAULT_CHIPS.map(text=>`<button class="btn secondary chip" data-fault="${text}" type="button">${text}</button>`).join("");const rows=(job.faults||[]).map((f,i)=>`<div class="row"><strong>${f.text}</strong><select class="sev" data-i="${i}">${SEVERITIES.map(v=>`<option${v===f.severity?" selected":""}>${v}</option>`).join("")}</select><button class="btn secondary drop" data-i="${i}" type="button">Remove</button></div>`).join("");$("faults").innerHTML=`<h3>Faults found</h3><div class="row">${chips}</div>${rows}<div class="row"><input id="faultText" placeholder="Add a fault"><button id="addFault" class="btn secondary" type="button">Add</button></div>`;$("faults").querySelectorAll(".chip").forEach(b=>b.onclick=async()=>{if(!job.faults.some(f=>f.text===b.dataset.fault))job.faults.push({text:b.dataset.fault,severity:"Moderate"});await saveState(state);paint();});$("faults").querySelectorAll(".sev").forEach(sel=>sel.onchange=async()=>{job.faults[sel.dataset.i].severity=sel.value;await saveState(state);});$("faults").querySelectorAll(".drop").forEach(b=>b.onclick=async()=>{job.faults.splice(Number(b.dataset.i),1);await saveState(state);paint();});$("addFault").onclick=async()=>{const text=$("faultText").value.trim();if(!text)return;job.faults.push({text,severity:"Moderate"});await saveState(state);paint();};}

  function paintParts(){const rows=(job.parts||[]).map((p,i)=>`<div class="card parts-card"><div class="grid2"><label>Part<input class="pf" data-i="${i}" data-k="part" value="${p.part||""}"></label><label>Supplier<input class="pf" data-i="${i}" data-k="supplier" value="${p.supplier||""}"></label><label>Part number<input class="pf" data-i="${i}" data-k="partNumber" value="${p.partNumber||""}"></label><label>Quantity<input class="pf" data-i="${i}" data-k="quantity" value="${p.quantity||"1"}"></label><label>Cost<input class="pf" data-i="${i}" data-k="cost" inputmode="decimal" value="${p.cost||""}"></label><label>Date ordered<input class="pf" data-i="${i}" data-k="ordered" type="date" value="${p.ordered||""}"></label></div><div class="row"><label class="checkline"><input class="pf" data-i="${i}" data-k="received" type="checkbox"${p.received?" checked":""}>Received</label><label class="checkline"><input class="pf" data-i="${i}" data-k="fitted" type="checkbox"${p.fitted?" checked":""}>Fitted</label><button class="btn secondary drop-part" data-i="${i}" type="button">Remove</button></div></div>`).join("");$("parts").innerHTML=`<h3>Parts ${job.parts.length?"· "+money(partsCost(job)):""}</h3>${rows}<button id="addPart" class="btn secondary" type="button">Add part</button>`;$("parts").querySelectorAll(".pf").forEach(el=>el.oninput=el.onchange=()=>{const p=job.parts[el.dataset.i];p[el.dataset.k]=el.type==="checkbox"?el.checked:el.value;syncParts();schedule();});$("parts").querySelectorAll(".drop-part").forEach(b=>b.onclick=async()=>{job.parts.splice(Number(b.dataset.i),1);syncParts();await saveState(state);paint();});$("addPart").onclick=async()=>{job.parts.push(blankPart());await saveState(state);paint();};}

  function paintQuestions(s,key){const copy=STAGE_COPY[key]||{steps:[]};const box=$("steps");box.innerHTML=`<h3>Checks</h3>`;copy.steps.forEach((raw,i)=>{const o=stepObj(raw,i);if(!visible(s,raw,i))return;const row=document.createElement("div");row.className="yn"+(o.when||o.whenGlobal?" followup":"");const p=document.createElement("p");p.textContent=o.text;const btns=document.createElement("div");btns.className="yn-btns";const cur=answer(s,raw,i);[["yes","Yes"],["no","No"],["na","N/A"]].forEach(([value,label])=>{const b=document.createElement("button");b.type="button";b.textContent=label;if(cur===value||cur===true&&value==="yes")b.className="on";b.onclick=async()=>{capture();s.checks[o.id]=(cur===value?"":value);await saveState(state);paint();hint("Answer saved");};btns.appendChild(b);});row.append(p,btns);box.appendChild(row);});}

  function paint(){job=current(state)||job;if(!job)return;const names=path();if(job.stage>=names.length)job.stage=names.length-1;const key=names[job.stage]||names[0],s=job.stages[job.stage],copy=STAGE_COPY[key]||{title:key,aim:"",steps:[]};$("watchTitle").textContent=job.watchName||"Untitled watch";$("watchName").value=job.watchName||"";$("stageTitle").textContent=copy.title;$("stageAim").textContent=copy.aim;$("stageEyebrow").textContent="STAGE "+String(job.stage+1).padStart(2,"0");$("stageState").textContent=stageDone(s,key)?"Complete":"In progress";
    const firstOpen=names.findIndex((k,i)=>!stageDone(job.stages[i],k));const list=$("stageList");list.innerHTML="";names.forEach((k,i)=>{const done=stageDone(job.stages[i],k),b=document.createElement("button");b.type="button";b.className="stage-btn"+(i===job.stage?" active":"")+(done?" done":"")+(i===firstOpen?" upto":"");b.innerHTML=`<span class="stage-check">${done?"✓":""}</span><span class="stage-num">${String(i+1).padStart(2,"0")}</span><span class="stage-name">${STAGE_COPY[k]?.title||k}</span>`;b.onclick=async()=>{capture();job.stage=i;await saveState(state);paint();};list.appendChild(b);});$("stageCounter").textContent=(firstOpen<0?names.length:firstOpen+1)+" / "+names.length;
    $("jobTypes").innerHTML=JOB_TYPES.map(([id,label])=>`<button class="btn secondary type${job.jobType===id?" on":""}" data-type="${id}" type="button">${label}</button>`).join("");$("jobTypes").querySelectorAll(".type").forEach(b=>b.onclick=async()=>{capture();job.jobType=b.dataset.type;normalise(job);job.stage=0;await saveState(state);paint();});
    $("decision").value=job.decision||"";const decisionText={"":"Choose a service level after assessment. Until then, the full diagnostic path remains available.","Leave it":"Only assessment and final documentation are required.","Regulate only":"The path is reduced to assessment, pre-service timing, regulation and final QC. Do not regulate around an unstable or dirty movement.","Case, hands or crystal":"Movement-service stages are removed; the path focuses on uncasing, external/dial-side work, casing and QC.","Partial":"The full path stays visible so irrelevant stages can be marked N/A while the repair scope develops.","Full service":"Full mechanical service path: assess → time → uncase → dismantle/inspect → clean → repair → reassemble/lubricate → test → case → regulate → extended QC."};$("decisionNote").textContent=decisionText[job.decision||""];
    $("stageNotes").value=s?.notes||"";$("stageCondition").value=s?.condition||"";$("stageMeasure").value=s?.measure||"";$("stageComplete").checked=!!s?.complete;$("diagnosis").value=job.diagnosis||"";$("repair").value=job.repairPerformed||"";
    paintQuestions(s,key);paintFaults();paintParts();$("timerBtn").textContent=job.labour?.running?"Pause timer":"Start timer";$("timerRead").textContent=Math.round((Number(job.business.labourMinutes)||0)+elapsedMinutes())+" min logged"+(job.status==="Awaiting parts"?" · awaiting parts":"");
    s.photos=s.photos||[];$("stageShots").innerHTML=s.photos.map((src,i)=>`<figure style="margin:0;position:relative"><img src="${src}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:8px"><button class="shot-x" data-i="${i}" type="button" style="position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(23,25,27,.72);color:#fff">×</button></figure>`).join("");$("stageShots").querySelectorAll(".shot-x").forEach(btn=>btn.onclick=async()=>{s.photos.splice(Number(btn.dataset.i),1);await saveState(state);paint();});hint("On "+copy.title);
  }

  ["watchName","stageNotes","stageMeasure","diagnosis","repair"].forEach(id=>$(id).addEventListener("input",schedule));["stageCondition"].forEach(id=>$(id).addEventListener("change",schedule));$("decision").addEventListener("change",()=>changeDecision($("decision").value));$("stageComplete").addEventListener("change",async()=>{capture();await saveState(state);paint();});
  $("timerBtn").onclick=async()=>{job.labour=job.labour||{running:false,startedAt:null};if(job.labour.running){job.business.labourMinutes=String(Math.round((Number(job.business.labourMinutes)||0)+elapsedMinutes()));job.labour.running=false;job.labour.startedAt=null;}else{job.labour.running=true;job.labour.startedAt=new Date().toISOString();}await saveState(state);paint();};
  $("awaitParts").onclick=async()=>{job.status=job.status==="Awaiting parts"?"On bench":"Awaiting parts";await saveState(state);paint();};
  $("takeStage").onclick=()=>{$("stagePhoto").setAttribute("capture","environment");$("stagePhoto").click();};$("uploadStage").onclick=()=>{$("stagePhoto").removeAttribute("capture");$("stagePhoto").click();};$("stagePhoto").onchange=async()=>{const file=$("stagePhoto").files?.[0];if(!file)return;hint("Saving photo…");const s=stage();s.photos=s.photos||[];s.photos.push(await compressImage(file));await saveState(state);$("stagePhoto").value="";paint();};
  $("prevStage").onclick=async()=>{capture();job.stage=Math.max(0,job.stage-1);await saveState(state);paint();};$("nextStage").onclick=async()=>{capture();job.stage=Math.min(path().length-1,job.stage+1);await saveState(state);paint();};
  $("completeJob").onclick=async()=>{capture();if(!confirm("Mark "+job.watchName+" complete?"))return;job.status="Ready to list";job.completedAt=new Date().toISOString();await saveState(state);location.href="inventory.html";};
  $("writeOff").onclick=async()=>{capture();const reason=prompt("What was lost or damaged?",job.writeOff||"Movement retained for spares.");if(!reason)return;job.writeOff=reason;markSpares(job);job.completedAt=new Date().toISOString();await saveState(state);location.href="suppliers.html";};
  paint();
}
</script></body></html>
