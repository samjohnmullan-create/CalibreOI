<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workbench · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=14">
<style>
.wb-hero{display:flex;justify-content:space-between;gap:18px;align-items:end;margin:8px 0 14px}.wb-hero h2{margin:2px 0 4px}.wb-hero p{margin:0;max-width:720px}.wb-summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:0 0 12px}.wb-stat{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;text-align:left}.wb-stat:hover,.wb-stat.on{border-color:var(--accent);background:var(--surface-2)}.wb-stat span{display:block;color:var(--muted);font-size:.65rem}.wb-stat strong{display:block;font-size:1.12rem;margin-top:2px}.wb-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.wb-toolbar button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 10px;border-radius:7px;font:inherit;font-size:.7rem}.wb-toolbar button.on{color:var(--ink);border-color:var(--accent);background:var(--surface-2)}.wb-section{margin:0 0 18px}.wb-section h3{display:flex;align-items:center;gap:7px;margin:0 0 7px;font-size:.85rem}.count{font-size:.64rem;color:var(--muted);font-weight:700}.wb-list{display:grid;gap:6px}.hub-card{display:grid;grid-template-columns:56px minmax(190px,1.2fr) minmax(150px,.9fr) minmax(180px,1.1fr) minmax(150px,.8fr) auto;gap:12px;align-items:center;padding:9px 10px;border:1px solid var(--line);background:var(--surface);border-radius:9px;color:inherit;cursor:pointer}.hub-card:hover{border-color:var(--accent)}.hub-card.priority{box-shadow:inset 3px 0 0 var(--accent)}.hub-card.queued{opacity:.88}.hub-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-weight:800}.hub-main,.hub-stage,.hub-next,.hub-state{min-width:0}.hub-title{font-weight:800;font-size:.84rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hub-sub,.hub-label{font-size:.62rem;color:var(--muted)}.hub-sub{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hub-label{text-transform:uppercase;letter-spacing:.05em;font-weight:800;margin-bottom:3px}.hub-stage strong,.hub-next strong{display:block;font-size:.74rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stage-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.62rem;margin-top:4px}.progress-track{height:4px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:5px}.progress-fill{height:100%;background:var(--accent);border-radius:inherit}.blocked{color:var(--danger);font-size:.72rem;line-height:1.25}.clear{color:var(--muted);font-size:.68rem}.hub-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.pill{font-size:.61rem;border:1px solid var(--line);padding:2px 5px;border-radius:999px;color:var(--muted)}.pill.work{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}.pill.warn{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}.hub-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}.hub-actions button{font:inherit;font-size:.64rem;padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}.hub-actions .primary{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:800}.empty{padding:18px;border:1px dashed var(--line);border-radius:9px;color:var(--muted)}
@media(max-width:1050px){.wb-summary{grid-template-columns:repeat(3,minmax(0,1fr))}.hub-card{grid-template-columns:54px minmax(180px,1.1fr) minmax(145px,.8fr) minmax(170px,1fr) auto}.hub-state{display:none}}
@media(max-width:760px){.wb-hero{display:block}.wb-summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.wb-stat{padding:9px}.wb-toolbar{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}.wb-toolbar::-webkit-scrollbar{display:none}.wb-toolbar button{flex:0 0 auto;min-height:40px}.hub-card{display:grid;grid-template-columns:58px minmax(0,1fr);gap:9px;padding:10px}.hub-thumb{width:58px;height:58px}.hub-title,.hub-sub,.hub-stage strong,.hub-next strong{white-space:normal}.hub-stage,.hub-next,.hub-state,.hub-actions{grid-column:1/-1}.hub-stage,.hub-next,.hub-state{padding-top:7px;border-top:1px solid var(--line)}.hub-actions{justify-content:stretch}.hub-actions button{min-height:40px;flex:1 1 auto}.hub-actions .primary{flex:1 1 100%}.hub-state{display:block}.stage-meta{font-size:.66rem}}
@media(max-width:430px){.wb-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Workbench</h1></div></a></header><nav class="mainnav"></nav>
<section class="wb-hero"><div><div class="kicker">WORKBENCH</div><h2>Bench command centre</h2><p class="muted">Resume active Work, see exactly where each item is up to, and surface blockers before they stall the bench.</p></div></section>
<div id="summary" class="wb-summary"></div><div id="toolbar" class="wb-toolbar"></div><div id="content"></div></div>
<script src="js/nav.js?v=63"></script>
<script type="module">
import {loadState,saveState,money,escapeHtml} from './js/store.js?v=8';
import {workbenchEntries,mutateWorkbenchEntry} from './js/workbench-model.js?v=2';
const esc=escapeHtml,$=id=>document.getElementById(id);let state,filter=new URLSearchParams(location.search).get('view')==='queue'?'Queue':'Active';
const isClosed=e=>e.group==='Closed',isQueued=e=>e.queued===true,isActive=e=>!isClosed(e)&&!isQueued(e);
function card(entry){
  const img=entry.cover||'',id=esc(entry.key),queued=isQueued(entry),initial=(entry.title||'I').trim().charAt(0).toUpperCase(),blockers=entry.blockers||[];
  const value=entry.potential?`${money(entry.potential)} potential`:entry.targetSale?`${money(entry.targetSale)} target`:entry.cashIn?`${money(entry.cashIn)} invested`:'';
  const stageCount=Number(entry.stageCount)||0,done=Number(entry.doneStages)||0,progress=Math.max(0,Math.min(100,Number(entry.progressPct)||0));
  return `<article class="hub-card${entry.priority?' priority':''}${queued?' queued':''}" data-key="${id}">${img?`<img class="hub-thumb" src="${esc(img)}" alt="">`:`<div class="hub-thumb">${esc(initial)}</div>`}<div class="hub-main"><div class="hub-title">${esc(entry.title)}</div><div class="hub-sub">${esc(entry.workTitle||'Work')} · ${esc(entry.status||'Planned')}</div><div class="hub-meta">${entry.priority?'<span class="pill work">Priority</span>':''}${entry.needsParts?'<span class="pill warn">Needs parts</span>':''}${entry.ageDays?`<span class="pill">${entry.ageDays}d</span>`:''}</div></div><div class="hub-stage"><div class="hub-label">Current stage</div><strong>${esc(entry.stageName||'No workflow yet')}</strong><div class="stage-meta"><span>${stageCount?`${done}/${stageCount} complete`:'Not started'}</span><span>${progress}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div></div><div class="hub-next"><div class="hub-label">Next action</div><strong>${esc(entry.nextAction||'Review work')}</strong></div><div class="hub-state"><div class="hub-label">Blocker / value</div>${blockers.length?`<div class="blocked">${blockers.map(esc).join(' · ')}</div>`:`<div class="clear">No blocker</div>`}${value?`<div class="hub-meta"><span class="pill">${value}</span></div>`:''}</div><div class="hub-actions"><button data-act="open" class="primary" type="button">${queued?'Open work':'Resume'}</button><button data-act="bench" type="button">${queued?'Add to bench':'Queue'}</button><button data-act="priority" type="button">${entry.priority?'Unpin':'Priority'}</button>${!queued&&entry.group!=='Waiting'&&entry.group!=='Closed'?'<button data-act="wait" type="button">Wait</button>':''}</div></article>`;
}
function openEntry(entry){location.href=entry.openHref;}
function paint(){
  const entries=workbenchEntries(state),active=entries.filter(isActive),queue=entries.filter(isQueued),attention=active.filter(e=>e.group==='Needs attention'||e.blockers.length),waiting=active.filter(e=>e.group==='Waiting'),needsParts=active.filter(e=>e.needsParts),ready=active.filter(e=>e.group==='Ready');
  const stats=[['Active',active.length],['Queue',queue.length],['Needs attention',attention.length],['Waiting',waiting.length],['Needs parts',needsParts.length],['Ready',ready.length]];
  $('summary').innerHTML=stats.map(([name,count])=>`<button class="wb-stat${filter===name?' on':''}" data-filter="${name}" type="button"><span>${name}</span><strong>${count}</strong></button>`).join('');
  $('summary').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;paint();});
  const filters=['Active','Queue','Priority','Needs attention','Waiting','Needs parts','Ready','All'];$('toolbar').innerHTML=filters.map(x=>`<button class="${filter===x?'on':''}" data-filter="${x}" type="button">${x}</button>`).join('');$('toolbar').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;paint();});
  let pool=entries.slice();if(filter==='Active')pool=active;else if(filter==='Queue')pool=queue;else if(filter==='Priority')pool=active.filter(e=>e.priority);else if(filter==='Needs attention')pool=attention;else if(filter==='Waiting')pool=waiting;else if(filter==='Needs parts')pool=needsParts;else if(filter==='Ready')pool=ready;
  pool.sort((a,b)=>(Number(!!b.priority)-Number(!!a.priority))||(Number(!!b.needsParts)-Number(!!a.needsParts))||(b.ageDays-a.ageDays));
  const order=['On bench','Needs attention','Waiting','Ready','Queue','Closed'],groups={};pool.forEach(entry=>(groups[entry.group]??=[]).push(entry));
  $('content').innerHTML=order.map(group=>groups[group]?.length?`<section class="wb-section"><h3>${group} <span class="count">${groups[group].length}</span></h3><div class="wb-list">${groups[group].map(card).join('')}</div></section>`:'').join('')||'<div class="empty">Nothing matches this view.</div>';
  document.querySelectorAll('.hub-card').forEach(el=>{el.onclick=async event=>{const entry=workbenchEntries(state).find(row=>row.key===el.dataset.key);if(!entry)return;const action=event.target?.dataset?.act;if(!action){openEntry(entry);return;}event.preventDefault();event.stopPropagation();if(action==='open'){openEntry(entry);return;}if(mutateWorkbenchEntry(state,entry,action)){await saveState(state);paint();}};});
}
try{state=await loadState();state.workRecords=Array.isArray(state.workRecords)?state.workRecords:[];paint();}catch(err){$('content').innerHTML=`<div class="empty">Workbench could not load: ${esc(err?.message||'Unknown error')}</div>`;}
</script></body></html>
