<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workbench · Calibre & Co.</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
  <nav class="mainnav"><a class="navbtn" href="index.html">Jobs</a><a class="navbtn active" href="workbench.html">Workbench</a><a class="navbtn" href="timegrapher.html">Timegrapher</a></nav>
  <div class="hero"><div><div class="kicker">ACTIVE RESTORATION</div><h2 id="watchTitle">Loading</h2><p class="muted">Take the shot in nExt. File it here.</p></div><div class="hero-stats"><div><span>Stage</span><strong id="stageCounter">1/12</strong></div></div></div>
  <div id="stageList" class="stage-list" style="display:flex;gap:6px;overflow:auto;margin-bottom:12px"></div>
  <section class="card">
    <div class="section-head"><div><div id="stageEyebrow" class="kicker">STAGE 01</div><h2 id="stageTitle">Intake</h2></div><label class="checkline"><input id="stageComplete" type="checkbox"><span>Stage complete</span></label></div>
    <div id="steps"></div>
    <label>Watch name<input id="watchName"></label>
    <label>Notes<textarea id="stageNotes" rows="4"></textarea></label>
    <label>Measurement<input id="stageMeasure" placeholder="arbor 1.20 mm"></label>
    <div class="subpanel">
      <div class="section-head"><div><h3>Microscope photo</h3><p class="muted small">Shot in nExt Camera, then picked from the gallery.</p></div><label class="btn">Add microscope photo<input id="photoInput" type="file" accept="image/*" hidden></label></div>
      <div id="photoGrid" class="photo-grid"></div>
    </div>
    <div class="footer-actions"><button id="prevStage" class="btn secondary" type="button">Previous</button><span class="autosave" id="statusText">Buttons ready</span><button id="nextStage" class="btn" type="button">Next</button></div>
  </section>
</div>
<script>
(function(){
  var STAGES = ["Intake","Demagnetising","Strip-down","Inspection","Cleaning","Barrel & Mainspring","Train Test","Escapement","Balance","Lubrication","Regulation","Final QC"];
  var STEPS = {"Cleaning":["Peg jewel holes with pegwood until the peg comes out clean","Pith the pivots","Lighter fluid or naphtha on plates and steel","Isopropyl off the dial and off shellac","Ultrasonic for plates and steel only","Rinse, dry, peg the jewels again"],"Inspection":["Peg each jewel hole","Check pivots","Endshake and sideshake","Escape teeth, pallet stones, guard pin","Staff pivots and hairspring","Barrel hook, bridle and wall"],"Barrel & Mainspring":["Let down before the cover comes off","Check hook and cover snap","Blued spring: oil the wall only","White alloy spring: do not oil","Confirm it hooks"]};
  var $ = function(id){ return document.getElementById(id); };
  var state = null, job = null;
  function blank(){ return { notes:"", measure:"", complete:false, photos:[], checks:{} }; }
  function hint(t){ $("statusText").textContent = t; }
  function openDB(){ return new Promise(function(res, rej){ var r = indexedDB.open("calibre-co-v1", 1); r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); }; r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
  function readState(){ return openDB().then(function(db){ return new Promise(function(res, rej){ var g = db.transaction("kv").objectStore("kv").get("state"); g.onsuccess = function(){ res(g.result); }; g.onerror = function(){ rej(g.error); }; }); }); }
  function writeState(){ return openDB().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(state, "state"); tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); }; }); }); }
  function current(){ if (!state || !state.jobs || !state.jobs.length) return null; return state.jobs.filter(function(j){ return j.id === state.currentId; })[0] || state.jobs[0]; }
  function capture(){ if (!job) return; job.watchName = $("watchName").value; var s = job.stages[job.stage]; s.notes = $("stageNotes").value; s.measure = $("stageMeasure").value; s.complete = $("stageComplete").checked; }
  function paintPhotos(){
    var box = $("photoGrid"); box.innerHTML = "";
    var s = job.stages[job.stage]; s.photos = s.photos || [];
    s.photos.forEach(function(src, idx){
      var d = document.createElement("div"); d.className = "photo"; d.innerHTML = "<img alt=''><button type='button'>×</button>";
      d.querySelector("img").src = src;
      d.querySelector("button").onclick = function(){ s.photos.splice(idx, 1); writeState().then(paint); };
      box.appendChild(d);
    });
  }
  function paint(){
    job = current(); if (!job){ hint("No job on this phone."); return; }
    job.stage = job.stage || 0; job.stages = job.stages || []; while (job.stages.length < 12) job.stages.push(blank());
    var s = job.stages[job.stage]; s.checks = s.checks || {};
    $("watchTitle").textContent = job.watchName || "Watch"; $("watchName").value = job.watchName || "";
    $("stageCounter").textContent = (job.stage + 1) + "/12"; $("stageEyebrow").textContent = "STAGE " + String(job.stage + 1).padStart(2, "0");
    $("stageTitle").textContent = STAGES[job.stage]; $("stageNotes").value = s.notes || ""; $("stageMeasure").value = s.measure || ""; $("stageComplete").checked = !!s.complete;
    var steps = $("steps"); steps.innerHTML = "";
    (STEPS[STAGES[job.stage]] || ["Work this stage, then note what you found."]).forEach(function(text, i){
      var label = document.createElement("label"); label.className = "checkline"; label.style.margin = "8px 0";
      var input = document.createElement("input"); input.type = "checkbox"; input.checked = !!s.checks[i];
      input.onchange = function(){ s.checks[i] = input.checked; writeState().then(function(){ hint("Step saved"); }); };
      var span = document.createElement("span"); span.textContent = text; label.appendChild(input); label.appendChild(span); steps.appendChild(label);
    });
    var list = $("stageList"); list.innerHTML = "";
    STAGES.forEach(function(name, i){ var b = document.createElement("button"); b.type = "button"; b.className = "stage-btn" + (i === job.stage ? " active" : ""); b.textContent = String(i + 1).padStart(2, "0") + " " + name; b.onclick = function(){ go(i); }; list.appendChild(b); });
    paintPhotos(); hint("On " + STAGES[job.stage]);
  }
  function go(i){ if (!job) return; capture(); job.stage = Math.max(0, Math.min(11, i)); paint(); writeState().then(function(){ hint("Saved · " + STAGES[job.stage]); }); }
  $("nextStage").onclick = function(){ go((job ? job.stage : 0) + 1); };
  $("prevStage").onclick = function(){ go((job ? job.stage : 0) - 1); };
  $("photoInput").onchange = function(e){
    var file = e.target.files[0]; e.target.value = ""; if (!file || !job) return;
    var img = new Image(); var url = URL.createObjectURL(file);
    img.onload = function(){
      var scale = Math.min(1, 900 / Math.max(img.width, img.height));
      var c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      var s = job.stages[job.stage]; s.photos = s.photos || []; if (s.photos.length >= 8){ hint("Eight photos already on this stage."); return; }
      s.photos.push(c.toDataURL("image/jpeg", 0.72)); writeState().then(function(){ paint(); hint("Microscope photo saved"); });
    };
    img.src = url;
  };
  readState().then(function(saved){ state = saved; if (!state || !state.jobs || !state.jobs.length) state = { jobs: [{ id: "job-local", watchName: "Untitled watch", stage: 0, stages: [] }], currentId: "job-local" }; paint(); }).catch(function(){ hint("Could not open the job store."); });
})();
</script>
</body>
</html>
