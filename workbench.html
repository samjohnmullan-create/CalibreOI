<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workbench · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=9">
<style>
.stage-list .stage-btn{min-width:148px;min-height:96px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:2px;padding:28px 12px 12px;position:relative;background:#fff;color:#656a6f;text-align:left}
.stage-list .stage-btn.active{background:var(--nav);color:#fff}
.stage-list .stage-check{position:absolute;top:10px;right:10px;width:18px;height:18px;border:1.5px solid #bbb7ae;border-radius:4px;display:grid;place-items:center;font-size:.72rem;line-height:1;color:#fff}
.stage-list .stage-btn.done .stage-check{background:var(--ok);border-color:var(--ok)}
.stage-list .stage-btn.active .stage-check{border-color:#fff}
.stage-list .stage-btn.active.done .stage-check{background:var(--ok);border-color:var(--ok)}
.stage-list .stage-num{font-size:1rem;color:var(--brass);font-weight:800}
.stage-list .stage-btn.active .stage-num{color:var(--brass-soft)}
.stage-list .stage-name{font-size:.92rem;line-height:1.15}
.stage-list .stage-btn.done .stage-name{color:#3e7752}
.stage-list .stage-btn.active.done .stage-name{color:#fff}
.stage-list .stage-btn.upto:not(.active){box-shadow:inset 0 0 0 1.5px var(--brass)}
</style>
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn" href="index.html">Start</a><a class="navbtn active" href="workbench.html" aria-current="page">Bench</a><a class="navbtn" href="timegrapher.html">Time</a><a class="navbtn" href="passport.html">Identity</a><a class="navbtn" href="business.html">Cost</a><a class="navbtn" href="summary.html">Sheet</a><a class="navbtn" href="inventory.html">Stock</a><a class="navbtn" href="suppliers.html">Parts</a></nav>
<div class="hero"><div><div class="kicker">ON THE BENCH</div><h2 id="watchTitle">Reading jobs…</h2><p id="stageAim" class="muted"></p></div><div class="hero-stats"><div><span>Up to</span><strong id="stageCounter">1/12</strong></div></div></div>
<div id="stageList" class="stage-list" style="display:flex;gap:8px;overflow:auto;margin-bottom:12px;min-height:96px">
<button class="stage-btn active" type="button"><span class="stage-num">01</span><span class="stage-name">Intake</span></button>
<button class="stage-btn" type="button"><span class="stage-num">02</span><span class="stage-name">Strip</span></button>
<button class="stage-btn" type="button"><span class="stage-num">03</span><span class="stage-name">Inspection</span></button>
</div>
<section class="card">
<div class="section-head"><div><div id="stageEyebrow" class="kicker">STAGE 01</div><h2 id="stageTitle">Initial check</h2></div><label class="checkline"><input id="stageComplete" type="checkbox"><span>Stage complete</span></label></div>
<div id="jobTypes" class="row">
<button class="btn secondary type" data-type="manual" type="button">Mechanical manual</button>
<button class="btn secondary type" data-type="automatic" type="button">Automatic</button>
<button class="btn secondary type" data-type="quartz" type="button">Quartz</button>
<button class="btn secondary type" data-type="pocket" type="button">Pocket watch</button>
<button class="btn secondary type" data-type="clock" type="button">Clock</button>
<button class="btn secondary type" data-type="inspect" type="button">Inspection only</button>
</div>
<label id="decisionWrap2">Decision<select id="decision"><option value="">Not decided</option><option>Leave it</option><option>Regulate only</option><option>Case, hands or crystal</option><option>Partial</option><option>Full service</option></select></label>
<p id="decisionNote" class="muted small"></p>
<div id="steps"></div>
<div id="faults"></div>
<label>Diagnosis<textarea id="diagnosis" rows="3" placeholder="What you found. Not what you did."></textarea></label>
<label>Repair performed<textarea id="repair" rows="3" placeholder="What you actually fixed."></textarea></label>
<div class="grid2"><label>Watch name<input id="watchName"></label><label>Condition<select id="stageCondition"><option value="">Not set</option><option>Running</option><option>Running, needs a look</option><option>Stopped</option><option>Slipping wind</option><option>Damaged</option></select></label></div>
<label>Notes<textarea id="stageNotes" rows="4"></textarea></label>
<div id="parts"></div>
<div class="row" id="timerRow"><button id="timerBtn" class="btn" type="button">Start timer</button><span id="timerRead" class="muted small"></span><button id="awaitParts" class="btn secondary" type="button">Awaiting parts</button></div>
<label>Measurement<input id="stageMeasure"></label>
<div class="row"><a class="btn secondary" href="passport.html">Identity</a><a class="btn secondary" href="business.html">Cost</a><button id="takeStage" class="btn secondary" type="button">Take photo</button><button id="uploadStage" class="btn secondary" type="button">Upload</button></div>
<input id="stagePhoto" type="file" accept="image/*" hidden>
<div id="stageShots" style="display:flex;gap:8px;overflow:auto;margin-top:10px"></div>
<div class="footer-actions">
<button id="prevStage" class="btn secondary" type="button">Previous</button>
<button id="completeJob" class="btn" type="button">Complete job</button>
<button id="writeOff" class="btn secondary" type="button">Write off</button>
<button id="nextStage" class="btn" type="button">Next</button>
</div>
<p class="autosave" id="statusText">Loading…</p>
</section></div>
<script>
(function(){
  var paths = {
    manual:["Intake","Demagnetising","Strip-down","Inspection","Cleaning","Barrel","Train","Escapement","Balance","Lubrication","Regulation","Final QC"],
    automatic:["Intake","Demagnetising","Strip-down","Inspection","Cleaning","Barrel","Rotor","Train","Escapement","Balance","Lubrication","Regulation","Final QC"],
    quartz:["Intake","Case and strap","Battery","Inspection","Movement secure","Hands","Regulation","Final QC"],
    pocket:["Intake","Demagnetising","Bow and pendant","Strip-down","Inspection","Cleaning","Barrel","Train","Escapement","Balance","Lubrication","Regulation","Final QC"],
    clock:["Intake","Case","Inspection","Cleaning","Train","Escapement","Pendulum","Strike","Regulation","Final QC"],
    inspect:["Intake","Inspection","Final QC"]
  };
  var list = document.getElementById("stageList");
  var note = document.getElementById("statusText");
  function draw(type){
    var names = paths[type] || paths.manual;
    list.innerHTML = names.map(function(name, i){
      return "<button class=\"stage-btn"+(i===0?" active":"")+"\" type=\"button\"><span class=\"stage-num\">"+String(i+1).padStart(2,"0")+"</span><span class=\"stage-name\">"+name+"</span></button>";
    }).join("");
    document.getElementById("stageCounter").textContent = "1/"+names.length;
    if (note) note.textContent = "Path set. Saving when the job is ready.";
  }
  document.getElementById("jobTypes").onclick = function(e){
    var b = e.target.closest(".type");
    if (!b) return;
    sessionStorage.setItem("calibre-type", b.dataset.type);
    draw(b.dataset.type);
  };
  list.onclick = function(e){
    var b = e.target.closest(".stage-btn");
    if (!b) return;
    list.querySelectorAll(".stage-btn").forEach(function(x){ x.classList.remove("active"); });
    b.classList.add("active");
    document.getElementById("stageTitle").textContent = b.querySelector(".stage-name").textContent;
  };
})();
</script>
<script src="js/nav.js?v=17"></script>
<script type="module">
import { loadState, saveState, current, markSpares, compressImage, stagesFor, JOB_TYPES, FAULT_CHIPS, SEVERITIES, normalise, blankPart, partsCost, money } from "./js/store.js?v=22";
import { STAGE_COPY } from "./js/stages.js?v=9";
const $ = id => document.getElementById(id);
let state = { jobs:[], currentId:null };
try { state = await Promise.race([loadState(), new Promise(function(_, rej){ setTimeout(function(){ rej(new Error("Jobs are slow to read.")); }, 4000); })]); }
catch (err) { $("statusText").textContent = err.message || "Jobs are slow to read."; }
let job = current(state);
if (!job) { $("watchTitle").textContent = "No watch open"; $("statusText").textContent = "Pick a job on Jobs."; }
else {
document.getElementById("jobTypes").onclick = async (e) => {
  const b = e.target.closest(".type");
  if (!b) return;
  job.jobType = b.dataset.type;
  normalise(job);
  job.stage = 0;
  await saveState(state);
  paint();
  $("statusText").textContent = "Path set: " + b.textContent;
};
let timer;
const path = () => stagesFor(job);
const stage = () => job.stages[job.stage];
function hint(t){ $("statusText").textContent = t; }
function capture(){
  job.watchName = $("watchName").value; job.decision = $("decision").value;
  job.diagnosis = $("diagnosis").value; job.repairPerformed = $("repair").value;
  const s = stage(); if (!s) return;
  s.notes = $("stageNotes").value; s.condition = $("stageCondition").value; s.measure = $("stageMeasure").value; s.complete = $("stageComplete").checked; s.updatedAt = new Date().toISOString();
}
function elapsedMinutes(){
  if (!job.labour || !job.labour.running || !job.labour.startedAt) return 0;
  return Math.max(0, (Date.now() - new Date(job.labour.startedAt).getTime()) / 60000);
}
function syncParts(){ if (job.parts.length) job.business.partsCost = String(Math.round(partsCost(job) * 100) / 100); }
function schedule(){ clearTimeout(timer); hint("Saving…"); timer = setTimeout(async () => { capture(); await saveState(state); hint("Saved"); }, 400); }
function stageDone(s, i){
  if (!s || s.complete) return !s ? false : true;
  const steps = (STAGE_COPY[path()[i]] || {}).steps || [];
  if (!steps.length) return false;
  const checks = s.checks || {};
  return steps.every((_, n) => checks[n] === "yes" || checks[n] === "na" || checks[n] === true);
}
function paintFaults(){
  const chips = FAULT_CHIPS.map(text => `<button class="btn secondary chip" data-fault="${text}" type="button">${text}</button>`).join("");
  const rows = (job.faults || []).map((f, i) => `<div class="row"><strong>${f.text}</strong><select class="sev" data-i="${i}">${SEVERITIES.map(v => `<option${v===f.severity?" selected":""}>${v}</option>`).join("")}</select><button class="btn secondary drop" data-i="${i}" type="button">Remove</button></div>`).join("");
  $("faults").innerHTML = `<h3>Faults found</h3><div class="row">${chips}</div>${rows}<div class="row"><input id="faultText" placeholder="Add a fault"><button id="addFault" class="btn secondary" type="button">Add</button></div>`;
  $("faults").querySelectorAll(".chip").forEach(b => b.onclick = async () => { if (!job.faults.some(f => f.text === b.dataset.fault)) job.faults.push({ text: b.dataset.fault, severity: "Moderate" }); await saveState(state); paint(); });
  $("faults").querySelectorAll(".sev").forEach(sel => sel.onchange = async () => { job.faults[sel.dataset.i].severity = sel.value; await saveState(state); });
  $("faults").querySelectorAll(".drop").forEach(b => b.onclick = async () => { job.faults.splice(Number(b.dataset.i), 1); await saveState(state); paint(); });
  $("addFault").onclick = async () => { const text = $("faultText").value.trim(); if (!text) return; job.faults.push({ text, severity: "Moderate" }); await saveState(state); paint(); };
}
function paintParts(){
  const rows = (job.parts || []).map((p, i) => `<div class="card" style="padding:10px;margin-top:8px">
    <div class="grid2"><label>Part<input class="pf" data-i="${i}" data-k="part" value="${p.part || ""}"></label><label>Supplier<input class="pf" data-i="${i}" data-k="supplier" value="${p.supplier || ""}"></label>
    <label>Part number<input class="pf" data-i="${i}" data-k="partNumber" value="${p.partNumber || ""}"></label><label>Quantity<input class="pf" data-i="${i}" data-k="quantity" inputmode="decimal" value="${p.quantity || ""}"></label>
    <label>Cost<input class="pf" data-i="${i}" data-k="cost" inputmode="decimal" value="${p.cost || ""}"></label><label>Date ordered<input class="pf" data-i="${i}" data-k="ordered" type="date" value="${p.ordered || ""}"></label></div>
    <div class="row"><label class="checkline"><input class="pf" data-i="${i}" data-k="received" type="checkbox"${p.received?" checked":""}>Received</label><label class="checkline"><input class="pf" data-i="${i}" data-k="fitted" type="checkbox"${p.fitted?" checked":""}>Fitted</label><button class="btn secondary drop-part" data-i="${i}" type="button">Remove</button></div>
  </div>`).join("");
  $("parts").innerHTML = `<h3>Parts ${job.parts.length ? "· " + money(partsCost(job)) : ""}</h3>${rows}<button id="addPart" class="btn secondary" type="button">Add part</button>`;
  $("parts").querySelectorAll(".pf").forEach(el => el.oninput = el.onchange = () => {
    const p = job.parts[el.dataset.i];
    p[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value;
    syncParts();
    schedule();
  });
  $("parts").querySelectorAll(".drop-part").forEach(b => b.onclick = async () => { job.parts.splice(Number(b.dataset.i), 1); syncParts(); await saveState(state); paint(); });
  $("addPart").onclick = async () => { job.parts.push(blankPart()); await saveState(state); paint(); };
}
function paintTimer(){
  const booked = Number(job.business.labourMinutes) || 0;
  const live = elapsedMinutes();
  $("timerBtn").textContent = job.labour.running ? "Pause timer" : "Start timer";
  $("timerRead").textContent = Math.round(booked + live) + " min on cost" + (job.status === "waiting parts" ? " · awaiting parts" : "");
}
function paint(){
  job = current(state) || job;
  if (!job) return;
  const names = path();
  $("watchTitle").textContent = job.watchName || "Untitled watch";
  if ($("watchName")) $("watchName").value = job.watchName || "";
  const name = names[job.stage] || names[0];
  const copy = STAGE_COPY[name] || { title: name, aim: "", steps: [] };
  job.stages = job.stages || [];
  const s = job.stages[job.stage] || job.stages[0] || { checks:{}, photos:[], notes:"", condition:"", measure:"", complete:false };
  s.checks = s.checks || {};
  const upto = job.stages.findIndex((st, i) => !stageDone(st, i));
  const list = $("stageList");
  list.innerHTML = "";
  names.forEach((key,i) => {
    const st = job.stages[i] || {};
    const done = stageDone(st, i);
    const title = STAGE_COPY[key] ? STAGE_COPY[key].title : key;
    const b = document.createElement("button"); b.type = "button";
    b.className = "stage-btn" + (i === job.stage ? " active" : "") + (done ? " done" : "") + (i === upto ? " upto" : "");
    b.innerHTML = `<span class="stage-check">${done ? "✓" : ""}</span><span class="stage-num">${String(i+1).padStart(2,"0")}</span><span class="stage-name">${title}</span>`;
    b.onclick = async () => { job.stage = i; await saveState(state); paint(); };
    list.appendChild(b);
  });
  $("stageCounter").textContent = upto < 0 ? names.length + "/" + names.length : (upto + 1) + "/" + names.length;
  $("stageEyebrow").textContent = "STAGE " + String(job.stage + 1).padStart(2, "0");
  $("stageTitle").textContent = copy.title; $("stageAim").textContent = copy.aim;
  $("jobTypes").innerHTML = JOB_TYPES.map(([id, label]) => `<button class="btn secondary type${job.jobType===id?" on":""}" data-type="${id}" type="button">${label}</button>`).join("");
  $("jobTypes").querySelectorAll(".type").forEach(b => b.onclick = async () => {
    capture();
    job.jobType = b.dataset.type;
    normalise(job);
    job.stage = 0;
    await saveState(state);
    paint();
  });
  $("decision").value = job.decision || "";
  $("decisionNote").textContent = job.stage === 0 ? "A quartz watch does not take the barrel and balance path." : "";
  $("stageNotes").value = s.notes || ""; $("stageCondition").value = s.condition || ""; $("stageMeasure").value = s.measure || ""; $("stageComplete").checked = !!s.complete;
  $("diagnosis").value = job.diagnosis || ""; $("repair").value = job.repairPerformed || "";
  try { paintFaults(); paintParts(); paintTimer(); } catch (err) { hint(err.message); }
  s.photos = s.photos || [];
  $("stageShots").innerHTML = s.photos.map((src, i) => `<figure style="margin:0;position:relative"><img src="${src}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:8px"><button class="shot-x" data-i="${i}" type="button" aria-label="Remove photo" style="position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(23,25,27,.72);color:#fff">×</button></figure>`).join("");
  $("stageShots").querySelectorAll(".shot-x").forEach(btn => btn.onclick = async () => { s.photos.splice(Number(btn.dataset.i), 1); await saveState(state); paint(); });
  const box = $("steps"); box.innerHTML = "";
  copy.steps.forEach((text,i) => {
    const row = document.createElement("div"); row.className = "yn";
    const p = document.createElement("p"); p.textContent = text;
    const btns = document.createElement("div"); btns.className = "yn-btns";
    const current = s.checks[i] === true ? "yes" : (s.checks[i] === "yes" || s.checks[i] === "no" || s.checks[i] === "na" ? s.checks[i] : "");
    [["yes","Yes"],["no","No"],["na","N/A"]].forEach(([value, label]) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = label;
      if (current === value) b.className = "on";
      b.onclick = async () => {
        capture();
        s.checks[i] = current === value ? "" : value;
        await saveState(state); hint("Answer saved"); paint();
      };
      btns.appendChild(b);
    });
    row.appendChild(p); row.appendChild(btns); box.appendChild(row);
  });
  hint("On " + copy.title);
}
["watchName","stageNotes","stageMeasure","diagnosis","repair"].forEach(id => $(id).addEventListener("input", schedule));
["stageCondition","stageComplete","decision"].forEach(id => $(id).addEventListener("change", schedule));
$("timerBtn").onclick = async () => {
  job.labour = job.labour || { running:false, startedAt:null };
  if (job.labour.running) {
    job.business.labourMinutes = String(Math.round((Number(job.business.labourMinutes) || 0) + elapsedMinutes()));
    job.labour.running = false; job.labour.startedAt = null;
  } else { job.labour.running = true; job.labour.startedAt = new Date().toISOString(); }
  await saveState(state); paint();
};
$("awaitParts").onclick = async () => { job.status = job.status === "Awaiting parts" ? "On bench" : "Awaiting parts"; await saveState(state); paint(); };
$("takeStage").onclick = () => { $("stagePhoto").setAttribute("capture", "environment"); $("stagePhoto").click(); };
$("uploadStage").onclick = () => { $("stagePhoto").removeAttribute("capture"); $("stagePhoto").click(); };
$("stagePhoto").onchange = async () => {
  const file = $("stagePhoto").files && $("stagePhoto").files[0];
  if (!file) return;
  hint("Saving photo…");
  const s = stage();
  s.photos = s.photos || [];
  s.photos.push(await compressImage(file));
  await saveState(state);
  $("stagePhoto").value = "";
  paint();
  hint("Saved");
};
$("stageComplete").addEventListener("change", async () => { capture(); await saveState(state); paint(); });
$("prevStage").onclick = async () => { capture(); job.stage = Math.max(0, job.stage-1); await saveState(state); paint(); };
$("nextStage").onclick = async () => { capture(); job.stage = Math.min(path().length - 1, job.stage+1); await saveState(state); paint(); };
$("completeJob").onclick = async () => {
  capture();
  if (!confirm("Mark "+job.watchName+" complete?")) return;
  job.status = "complete"; job.completedAt = new Date().toISOString();
  await saveState(state); location.href = "inventory.html";
};
$("writeOff").onclick = async () => {
  capture();
  const reason = prompt("What was lost or damaged?", job.writeOff || "Keyless works lost. Movement is spares.");
  if (!reason) return;
  job.writeOff = reason; markSpares(job); job.completedAt = new Date().toISOString();
  await saveState(state); location.href = "suppliers.html";
};
paint();
}
</script></body></html>
