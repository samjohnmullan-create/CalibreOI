<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workbench · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=14">
<style>
.wb-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.wb-toolbar button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 12px;border-radius:10px;font:inherit}.wb-toolbar button.on{color:var(--ink);border-color:var(--brass);background:var(--surface-2)}
.wb-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 14px}.wb-summary .card{padding:14px}.wb-summary span{display:block;color:var(--muted);font-size:.78rem}.wb-summary strong{display:block;font-size:1.25rem;margin-top:3px}.wb-section{margin:0 0 18px}.wb-section h3{display:flex;align-items:center;gap:8px}.count{font-size:.72rem;color:var(--muted);font-weight:700}
.wb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}.hub-card{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;color:inherit;position:relative;cursor:pointer}.hub-card:hover{border-color:var(--brass)}.hub-card.priority{box-shadow:inset 3px 0 0 var(--brass)}.hub-card.queued{opacity:.92}.hub-thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-weight:800}.hub-main{min-width:0}.hub-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.hub-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hub-sub{font-size:.78rem;color:var(--muted);margin-top:2px}.hub-line{font-size:.82rem;margin-top:9px}.hub-line strong{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:5px}.hub-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.pill{font-size:.72rem;border:1px solid var(--line);padding:4px 7px;border-radius:999px;color:var(--muted)}.pill.warn{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}.pill.work{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}.hub-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.hub-actions button{font:inherit;font-size:.74rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}.hub-actions .primary{border-color:var(--brass)}.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
@media(max-width:850px){.wb-summary{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.wb-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.wb-grid{grid-template-columns:1fr}}
</style></head><body>
<div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Workbench</h1></div></a></header><nav class="mainnav"></nav>
<div class="hero"><div><div class="kicker">WORKBENCH</div><h2>Operations hub</h2><p class="muted">Active work stays on the bench. Watches, clocks and general Item work now share the same queue.</p></div></div>
<div id="summary" class="wb-summary"></div><div id="toolbar" class="wb-toolbar"></div><div id="content"></div></div>
<script src="js/nav.js?v=62"></script>
<script type="module">
import {loadState,saveState,money,coverPhoto,escapeHtml} from './js/store.js?v=8';
import {workbenchEntries,mutateWorkbenchEntry} from './js/workbench-model.js?v=1';
const esc=escapeHtml,$=id=>document.getElementById(id);let state,filter=new URLSearchParams(location.search).get('view')==='queue'?'Queue':'Active';
const isClosed=e=>e.group==='Closed',isQueued=e=>e.queued===true,isActive=e=>!isClosed(e)&&!isQueued(e);
function legacyCover(entry){if(entry.kind!=='legacy-job')return entry.cover||'';const job=(state.jobs||[]).find(j=>String(j.id)===String(entry.sourceId));return job?coverPhoto(job):'';}
function card(entry){const img=legacyCover(entry),id=esc(entry.key),queued=isQueued(entry),initial=(entry.title||'I').trim().charAt(0).toUpperCase();return `<article class="hub-card${entry.priority?' priority':''}${queued?' queued':''}" data-key="${id}">${img?`<img class="hub-thumb" src="${esc(img)}" alt="">`:`<div class="hub-thumb">${esc(initial)}</div>`}<div class="hub-main"><div class="hub-top"><div><div class="hub-title">${esc(entry.title)}</div><div class="hub-sub">${esc(entry.subtitle)}</div></div><span class="pill ${entry.kind==='work'?'work':''}">${entry.kind==='work'?'Work':queued?'Queue':'Watch job'}</span></div><div class="hub-line"><strong>Next</strong>${esc(entry.nextAction)}</div>${entry.diagnosis?`<div class="hub-line"><strong>${entry.kind==='work'?'Findings':'Diagnosis'}</strong>${esc(entry.diagnosis)}</div>`:''}<div class="hub-meta"><span class="pill">${money(entry.cashIn)} in</span>${entry.targetSale?`<span class="pill">${money(entry.targetSale)} target</span>`:''}${entry.potential?`<span class="pill">${money(entry.potential)} potential</span>`:''}${entry.ageDays?`<span class="pill">${entry.ageDays}d</span>`:''}${entry.blockers.map(x=>`<span class="pill warn">${esc(x)}</span>`).join('')}</div><div class="hub-actions"><button data-act="open" class="primary" type="button">${entry.kind==='work'?'Open work':'Open service'}</button><button data-act="bench" type="button">${queued?'Add to Workbench':'Remove from Workbench'}</button><button data-act="priority" type="button">${entry.priority?'Unpin':'Prioritise'}</button>${!queued&&entry.group!=='Waiting'&&entry.group!=='Closed'?'<button data-act="wait" type="button">Mark waiting</button>':''}</div></div></article>`;}
function openEntry(entry){location.href=entry.openHref;}
function paint(){const entries=workbenchEntries(state),active=entries.filter(isActive),queue=entries.filter(isQueued),attention=active.filter(e=>e.group==='Needs attention'||e.blockers.length),waiting=active.filter(e=>e.group==='Waiting'),ready=active.filter(e=>e.group==='Ready');$('summary').innerHTML=`<div class="card"><span>On Workbench</span><strong>${active.length}</strong></div><div class="card"><span>Queue</span><strong>${queue.length}</strong></div><div class="card"><span>Needs attention</span><strong>${attention.length}</strong></div><div class="card"><span>Waiting</span><strong>${waiting.length}</strong></div><div class="card"><span>Ready</span><strong>${ready.length}</strong></div>`;const filters=['Active','Queue','Priority','Needs attention','Waiting','Ready','All'];$('toolbar').innerHTML=filters.map(x=>`<button class="${filter===x?'on':''}" data-filter="${x}" type="button">${x}</button>`).join('');$('toolbar').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;paint();});let pool=entries.slice();if(filter==='Active')pool=active;else if(filter==='Queue')pool=queue;else if(filter==='Priority')pool=active.filter(e=>e.priority);else if(filter==='Needs attention')pool=attention;else if(filter==='Waiting')pool=waiting;else if(filter==='Ready')pool=ready;pool.sort((a,b)=>(Number(!!b.priority)-Number(!!a.priority))||(b.ageDays-a.ageDays));const order=['On bench','Needs attention','Waiting','Ready','Queue','Closed'],groups={};pool.forEach(entry=>(groups[entry.group]??=[]).push(entry));$('content').innerHTML=order.map(group=>groups[group]?.length?`<section class="wb-section"><h3>${group} <span class="count">${groups[group].length}</span></h3><div class="wb-grid">${groups[group].map(card).join('')}</div></section>`:'').join('')||'<div class="empty">Nothing matches this view.</div>';document.querySelectorAll('.hub-card').forEach(el=>{el.onclick=async event=>{const entry=workbenchEntries(state).find(row=>row.key===el.dataset.key);if(!entry)return;const action=event.target?.dataset?.act;if(!action){openEntry(entry);return;}event.preventDefault();event.stopPropagation();if(action==='open'){openEntry(entry);return;}if(mutateWorkbenchEntry(state,entry,action)){await saveState(state);paint();}};});}
try{state=await loadState();state.workRecords=Array.isArray(state.workRecords)?state.workRecords:[];paint();}catch(err){$('content').innerHTML=`<div class="empty">Workbench could not load: ${esc(err?.message||'Unknown error')}</div>`;}
</script></body></html>
