utton class="btn" id="printSelected">Print selected</button><button class="btn secondary" id="selectAll">Select all</button><button class="btn secondary" id="clearAll">Clear</button><a class="btn secondary" href="qr-scan.html">Open scanner</a></div><p class="print-note">QR artwork is generated in your browser. If the QR library cannot load, the label still shows the permanent Calibre Item ID and scan target.</p><div id="labels" class="label-grid"></div><p id="msg" class="muted small"></p></div><script src="js/nav.js?v=62"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script type="module" src="js/qr-labels-runtime.js?v=1"></script></body></html>
