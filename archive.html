<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Archive · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=14">
<style>
.ar-shell{max-width:1080px;margin:0 auto}.ar-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:8px 0 12px}.ar-head h2{margin:2px 0 3px}.ar-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.ar-tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:8px 10px;font:inherit;font-size:.7rem}.ar-tabs button.on{border-color:var(--accent);color:var(--ink);background:var(--surface-2)}.ar-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ar-card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px}.ar-list{display:grid;gap:7px;margin-top:8px}.ar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}.ar-row strong{display:block;font-size:.78rem}.ar-row small{display:block;color:var(--muted);font-size:.63rem;margin-top:3px;line-height:1.35}.ar-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.ar-actions button{min-height:34px;font-size:.64rem}.ar-empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:.7rem}.ar-status{min-height:20px;color:var(--muted);font-size:.68rem;margin-top:8px}.warn{color:var(--danger)}
@media(max-width:760px){.ar-head{display:block}.ar-grid{grid-template-columns:1fr}.ar-row{grid-template-columns:1fr}.ar-actions{justify-content:flex-start}.ar-head .btn{width:100%;margin-top:8px}}
</style></head><body><div class="shell ar-shell">
<header class="brandbar"><a class="brand" href="inventory.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Archive</h1></div></a></header><nav class="mainnav"></nav>
<div class="ar-head"><div><div class="kicker">SAFE REMOVAL</div><h2>Archive & Restore</h2><p class="muted small">Hide records from active work without deleting identity, Work, finance, donor or provenance history.</p></div><a class="btn secondary" href="inventory.html">Back to Items</a></div>
<div id="tabs" class="ar-tabs"></div><div id="content" class="ar-grid"></div><div id="status" class="ar-status"></div>
</div><script src="js/nav.js?v=63"></script><script type="module">
import {loadStructuredArchiveInventory,archiveRecord,restoreRecord} from './js/structured-archive.js?v=1';
const $=id=>document.getElementById(id);let state=null,filter='all';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titleCase=v=>String(v||'').replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase());
function setStatus(t){$('status').textContent=t||'';}
function filtered(rows){return filter==='all'?rows:rows.filter(r=>r.type===filter);}
function detail(record){const r=record.row;if(record.type==='item')return [r.type,r.purpose,r.status,r.item_number?`#${r.item_number}`:''].filter(Boolean).join(' · ');if(record.type==='part')return [r.part_type,r.manufacturer,r.reference,r.condition,r.quantity!=null?`Qty ${r.quantity}`:''].filter(Boolean).join(' · ');return [r.category,r.brand,r.model,r.storage_location,r.quantity!=null?`Qty ${r.quantity}`:''].filter(Boolean).join(' · ');}
function row(record,archived){const active=record.activeWork||[],blocked=record.type==='item'&&active.length;return `<div class="ar-row"><div><strong>${esc(record.label)}</strong><small>${esc(detail(record)||titleCase(record.type))}</small>${blocked?`<small class="warn">Active Work: ${esc(active.map(w=>w.title||w.status).join(' · '))}</small>`:''}${archived&&record.row.archive_reason?`<small>Reason: ${esc(record.row.archive_reason)}</small>`:''}</div><div class="ar-actions">${archived?`<button class="btn secondary" data-restore="${esc(record.type)}:${esc(record.row.id)}" type="button">Restore</button>`:`<button class="btn secondary" ${blocked?'disabled':''} data-archive="${esc(record.type)}:${esc(record.row.id)}" type="button">Archive</button>`}</div></div>`;}
function paint(){const kinds=['all','item','part','tool','consumable'];$('tabs').innerHTML=kinds.map(k=>`<button type="button" class="${filter===k?'on':''}" data-filter="${k}">${k==='all'?'All':titleCase(k)}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;paint();});const active=filtered(state.active||[]),archived=filtered(state.archived||[]);$('content').innerHTML=`<section class="ar-card"><div class="kicker">ACTIVE</div><h3 style="margin:2px 0">Available records <span class="muted">${active.length}</span></h3><div class="ar-list">${active.length?active.map(r=>row(r,false)).join(''):'<div class="ar-empty">No active records in this view.</div>'}</div></section><section class="ar-card"><div class="kicker">ARCHIVED</div><h3 style="margin:2px 0">Hidden records <span class="muted">${archived.length}</span></h3><div class="ar-list">${archived.length?archived.map(r=>row(r,true)).join(''):'<div class="ar-empty">Archive is empty.</div>'}</div></section>`;document.querySelectorAll('[data-archive]').forEach(btn=>btn.onclick=async()=>{const [type,id]=btn.dataset.archive.split(':'),record=state.active.find(r=>r.type===type&&String(r.row.id)===id);if(!record)return;const reason=prompt(`Archive ${record.label}. Reason (optional):`,'');if(reason===null)return;btn.disabled=true;try{await archiveRecord(type,id,reason);await refresh();setStatus(`${record.label} archived. History was retained.`);}catch(err){setStatus(err?.message||'Archive failed.');}finally{btn.disabled=false;}});document.querySelectorAll('[data-restore]').forEach(btn=>btn.onclick=async()=>{const [type,id]=btn.dataset.restore.split(':'),record=state.archived.find(r=>r.type===type&&String(r.row.id)===id);if(!record)return;btn.disabled=true;try{await restoreRecord(type,id);await refresh();setStatus(`${record.label} restored to active inventory.`);}catch(err){setStatus(err?.message||'Restore failed.');}finally{btn.disabled=false;}});}
async function refresh(){state=await loadStructuredArchiveInventory();paint();}
try{await refresh();}catch(err){$('content').innerHTML=`<div class="ar-empty">Archive could not load: ${esc(err?.message||'Unknown error')}</div>`;}
</script></body></html>
