name: Clean Calibre certificate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    if: github.event.head_commit.message != 'Remove certificate image and simplify layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean certificate layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('documents.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
            '.cert-watch{display:grid;grid-template-columns:54mm minmax(0,1fr);gap:12mm;align-items:center;margin:9mm 0}.cert-hero{width:54mm;height:64mm;border:1px solid #bda77f;background:#ebe5d8;padding:4mm;display:grid;place-items:center;overflow:hidden}.cert-hero>img{width:100%;height:100%;object-fit:contain;display:block}',
            '.cert-watch{margin:11mm 0 7mm;text-align:center}.cert-watch h2{font-size:31px!important;font-weight:400;margin:0 0 3mm!important;line-height:1.08}.cert-watch .watch-subline{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#716a60;margin:0 0 8mm;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.cert-meta{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:5mm 7mm!important;text-align:left;max-width:160mm;margin:0 auto}'
          )

          old='''<div class="cert-watch"><div class="cert-hero">${hero()}</div><div><div class="caps">Recorded Watch</div><h2>${esc(name)}</h2><p class="muted-print" style="font-size:11px;margin:0 0 6mm">${esc(idLine||"Vintage mechanical watch")}</p><div class="cert-meta">\n<div class="cert-field"><span>Maker</span><strong>${val(p.maker)}</strong></div><div class="cert-field"><span>Model</span><strong>${val(p.model)}</strong></div>\n<div class="cert-field"><span>Calibre</span><strong>${val(p.calibre)}</strong></div><div class="cert-field"><span>Jewels</span><strong>${val(p.jewels)}</strong></div>\n<div class="cert-field"><span>Approx. year</span><strong>${val(p.year)}</strong></div><div class="cert-field"><span>Serial / case no.</span><strong>${val(first(p.serial,p.caseNumber))}</strong></div>\n</div></div></div>'''
          new='''<div class="cert-watch"><div class="caps">Recorded Watch</div><h2>${esc(name)}</h2><p class="watch-subline">${esc(idLine||"Vintage mechanical watch")}</p><div class="cert-meta">\n<div class="cert-field"><span>Maker</span><strong>${val(p.maker)}</strong></div><div class="cert-field"><span>Model</span><strong>${val(p.model)}</strong></div>\n<div class="cert-field"><span>Calibre</span><strong>${val(p.calibre)}</strong></div><div class="cert-field"><span>Jewels</span><strong>${val(p.jewels)}</strong></div>\n<div class="cert-field"><span>Approx. year</span><strong>${val(p.year)}</strong></div><div class="cert-field"><span>Serial / case no.</span><strong>${val(first(p.serial,p.caseNumber))}</strong></div>\n</div></div>'''
          if old not in s:
              raise SystemExit('certificate block pattern not found')
          s=s.replace(old,new)

          s=s.replace('.cert-statement{margin:9mm 0 8mm;', '.cert-statement{margin:10mm 0 9mm;')
          s=s.replace('.cert-work{display:grid;grid-template-columns:1fr 1fr;gap:9mm;margin-top:6mm}', '.cert-work{display:grid;grid-template-columns:1fr 1fr;gap:14mm;margin-top:8mm;padding-top:6mm;border-top:1px solid #d8ccb4}')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit certificate cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documents.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove certificate image and simplify layout'
          git push
