name: Bump Documents nav
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bump:
    if: github.event.head_commit.message != 'Bump Calibre navigation for Documents'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump shared navigation version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = re.sub(r'js/nav\.js\?v=\d+', 'js/nav.js?v=51', text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
          PY
      - name: Commit bumped references
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Bump Calibre navigation for Documents'
          git push
