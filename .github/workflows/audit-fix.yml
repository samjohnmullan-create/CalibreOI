name: Calibre integration audit fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Calibre integration issues found in audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch integration issues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')

          p=Path('sales.html'); s=read(p)
          old='document.querySelectorAll("#statusBtns button").forEach(b=>b.onclick=async()=>{job.status=b.dataset.status;if(job.status==="Listed"){job.sale=job.sale||{};job.sale.listedDate=job.sale.listedDate||today();$("listedDate").value=job.sale.listedDate;}if(job.status==="Sold"){if(!num(job.business?.actualSale)){$("saleMsg").textContent="Enter the actual sale price before marking Sold.";return;}job.business.soldDate=job.business.soldDate||today();$("soldDate").value=job.business.soldDate;}capture();await saveState(state);paint();$("saleMsg").textContent=`Marked ${job.status}.`;});'
          new='document.querySelectorAll("#statusBtns button").forEach(b=>b.onclick=async()=>{const next=b.dataset.status;if(next==="Sold"&&!num(job.business?.actualSale)){$("saleMsg").textContent="Enter the actual sale price before marking Sold.";return;}job.status=next;if(job.status==="Listed"){job.sale=job.sale||{};job.sale.listedDate=job.sale.listedDate||today();$("listedDate").value=job.sale.listedDate;}if(job.status==="Sold"){job.business.soldDate=job.business.soldDate||today();$("soldDate").value=job.business.soldDate;}capture();await saveState(state);paint();$("saleMsg").textContent=`Marked ${job.status}.`;});'
          if old not in s: raise SystemExit('sales status handler pattern not found')
          s=s.replace(old,new); write(p,s)

          p=Path('passport.html'); s=read(p)
          old='function overallConfidence(){const vals=Object.values(job.passport.fieldConfidence||{});if(vals.includes("Confirmed"))return "Confirmed";if(vals.includes("Probable"))return "Probable";if(vals.includes("Estimated"))return "Estimated";return "Unknown";}'
          new='function overallConfidence(){const fc=job.passport.fieldConfidence||{},core=["maker","model","year","calibre"].filter(k=>String(job.passport[k]||"").trim()).map(k=>fc[k]||"Unknown");if(!core.length)return "Unknown";if(core.includes("Unknown"))return "Unknown";if(core.includes("Estimated"))return "Estimated";if(core.includes("Probable"))return "Probable";return "Confirmed";}'
          if old not in s: raise SystemExit('passport confidence pattern not found')
          s=s.replace(old,new); write(p,s)

          p=Path('documents.html'); s=read(p)
          s=s.replace('.cert-placeholder{display:grid;place-items:center;color:#787269;font-family:Inter,sans-serif;font-size:11px}.cert-watch h2{font-size:28px;font-weight:400;margin:0 0 4mm;line-height:1.05}.cert-meta{display:grid;grid-template-columns:1fr 1fr;gap:4mm 8mm}', '')
          old='function confidenceText(p){const c=first(p.confidence,p.identityConfidence,"Recorded");return c.charAt(0).toUpperCase()+c.slice(1);}'
          new='function confidenceText(p){const fc=p.fieldConfidence||{},core=["maker","model","year","calibre"].filter(k=>raw(p[k])).map(k=>raw(fc[k]||"Unknown"));if(core.length){if(core.includes("Unknown"))return "Unknown";if(core.includes("Estimated"))return "Estimated";if(core.includes("Probable"))return "Probable";return "Confirmed";}const c=first(p.confidence,p.identityConfidence,"Unknown");return c.charAt(0).toUpperCase()+c.slice(1);}'
          if old not in s: raise SystemExit('documents confidence pattern not found')
          s=s.replace(old,new)
          s=s.replace('p.lot&&`Lot: ${p.lot}`','(p.lotNumber||p.lot)&&`Lot: ${p.lotNumber||p.lot}`')
          s=s.replace('${spec("Family",p.movementFamily)}','${spec("Family",first(p.calibreFamily,p.movementFamily))}')
          s=s.replace('${spec("Caseback",p.caseback)}','${spec("Caseback",first(p.casebackType,p.caseback))}')
          s=s.replace('${spec("Crystal",p.crystal)}','${spec("Crystal",first(p.crystalType,p.crystal))}')
          s=s.replace('${spec("Crown",p.crown)}','${spec("Crown",first(p.crownType,p.crown))}')
          s=s.replace('${spec("Water resistance marks",p.waterResistance)}','${spec("Water resistance marks",first(p.waterMark,p.waterResistance))}')
          s=s.replace('${spec("Original listing",p.originalListing)}','${spec("Original listing",first(p.listingText,p.originalListing))}')
          write(p,s)

          p=Path('summary.html'); s=read(p)
          s=s.replace('<button id="buyerSheet" class="btn secondary" type="button">Buyer passport</button>','<button id="buyerSheet" class="btn secondary" type="button">Customer documents</button>')
          old='$("buyerSheet").onclick=()=>{mode=mode==="buyer"?"internal":"buyer";$("buyerSheet").textContent=mode==="buyer"?"Workshop sheet":"Buyer passport";draw();};'
          new='$("buyerSheet").onclick=()=>{location.href="documents.html";};'
          if old not in s: raise SystemExit('summary buyer handler pattern not found')
          s=s.replace(old,new); write(p,s)

          p=Path('js/store-base.js'); s=read(p)
          s=s.replace('export const CHANNELS = ["Not listed","eBay","Etsy","Instagram","Shop","Auction","Other"];','export const CHANNELS = ["Not listed","eBay","Facebook Marketplace","Instagram","Shopify","Etsy","Auction","Private sale","Other"];')
          s=s.replace('confidence:"Unknown",dialMarkings:', 'confidence:"Unknown",fieldConfidence:{},dialMarkings:')
          old='job.business=Object.assign(blankBusiness(),job.business); if(!job.business.partsCost&&job.business.repairCost)job.business.partsCost=job.business.repairCost;'
          new='job.business=Object.assign(blankBusiness(),job.business); if(!job.business.partsCost&&job.business.repairCost)job.business.partsCost=job.business.repairCost;\n  job.sale=Object.assign({listedDate:"",notes:"",listingTitle:"",listingText:"",shortText:""},job.sale||{});'
          if old not in s: raise SystemExit('store-base business normalise pattern not found')
          s=s.replace(old,new); write(p,s)

          p=Path('js/store-cloud.js'); s=read(p)
          old='  state.incoming=(Array.isArray(state.incoming)?state.incoming:[]).map(normalisePurchase);\n  if(state.jobs.length&&!state.jobs.some(j=>j.id===state.currentId))state.currentId=state.jobs[0].id;'
          new='  state.incoming=(Array.isArray(state.incoming)?state.incoming:[]).map(normalisePurchase);\n  state.tools=Array.isArray(state.tools)?state.tools:[];\n  state.partsStock=Array.isArray(state.partsStock)?state.partsStock:[];\n  if(state.jobs.length&&!state.jobs.some(j=>j.id===state.currentId))state.currentId=state.jobs[0].id;'
          if old not in s: raise SystemExit('store-cloud normaliseState pattern not found')
          s=s.replace(old,new)
          marker='function mergeStates(local,cloud){'
          helper='function mergeRecordLists(a=[],b=[]){\n  const byId=new Map();\n  [...a,...b].forEach(item=>{\n    if(!item||typeof item!=="object")return;\n    const key=String(item.id||[item.name,item.reference,item.model,item.location].filter(Boolean).join("|")||Math.random());\n    const prev=byId.get(key);\n    if(!prev||ms(item.updatedAt)>=ms(prev.updatedAt))byId.set(key,structuredClone(item));\n  });\n  return [...byId.values()];\n}\n'
          if helper not in s:
              if marker not in s: raise SystemExit('store-cloud mergeStates marker not found')
              s=s.replace(marker,helper+marker)
          s=s.replace('    incoming:mergePurchaseLists(cloud.incoming,local.incoming),\n    currentId:', '    incoming:mergePurchaseLists(cloud.incoming,local.incoming),\n    tools:mergeRecordLists(cloud.tools,local.tools),\n    partsStock:mergeRecordLists(cloud.partsStock,local.partsStock),\n    currentId:')
          write(p,s)

          for path in Path('.').glob('*.html'):
              text=read(path)
              text=re.sub(r'js/nav\.js\?v=\d+', 'js/nav.js?v=53', text)
              write(path,text)
          PY
      - name: Static syntax audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys, os
          failures=[]
          for path in Path('js').glob('*.js'):
              r=subprocess.run(['node','--check',str(path)],capture_output=True,text=True)
              if r.returncode: failures.append((str(path),r.stderr))
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              blocks=re.findall(r'<script\s+type=["\']module["\'][^>]*>(.*?)</script>',text,re.S|re.I)
              for i,code in enumerate(blocks):
                  with tempfile.NamedTemporaryFile('w',suffix='.mjs',delete=False,encoding='utf-8') as f:
                      f.write(code); name=f.name
                  try:
                      r=subprocess.run(['node','--check',name],capture_output=True,text=True)
                      if r.returncode: failures.append((f'{path} inline module {i+1}',r.stderr))
                  finally:
                      os.unlink(name)
          if failures:
              for name,err in failures: print('\nFAIL',name,'\n',err)
              sys.exit(1)
          print('Static JavaScript syntax audit passed.')
          PY
      - name: Integration assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
            'sales.html':['const next=b.dataset.status','js/nav.js?v=53'],
            'documents.html':['p.calibreFamily','p.casebackType','p.crystalType','p.crownType','p.waterMark','p.listingText','js/nav.js?v=53'],
            'passport.html':['core=["maker","model","year","calibre"]','js/nav.js?v=53'],
            'summary.html':['Customer documents','location.href="documents.html"','js/nav.js?v=53'],
            'inventory.html':['Tool Library','Loose Parts Stock','js/nav.js?v=53'],
            'js/store-cloud.js':['mergeRecordLists','partsStock:mergeRecordLists','tools:mergeRecordLists'],
            'js/store-base.js':['fieldConfidence:{}','job.sale=Object.assign','Facebook Marketplace','Private sale']
          }
          for file,needles in checks.items():
              text=Path(file).read_text(encoding='utf-8')
              missing=[x for x in needles if x not in text]
              if missing: raise SystemExit(f'{file} missing: {missing}')
          print('Integration assertions passed.')
          PY
      - name: Commit audit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' js/store-base.js js/store-cloud.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Calibre integration issues found in audit'
          git push
