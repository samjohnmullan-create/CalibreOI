name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust deployed asset caches
        shell: bash
        run: |
          sed -i "s#js/publish-controls.js?v=2#js/publish-controls.js?v=${GITHUB_SHA}#g" sales.html
          sed -i "s#css/site.css#css/site.css?v=${GITHUB_SHA}#g" public-site/index.html public-site/watch.html
          sed -i "s#js/catalogue.js#js/catalogue.js?v=${GITHUB_SHA}#g" public-site/index.html public-site/watch.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
