<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Summary · Calibre & Co.</title><link rel="stylesheet" href="css/app.css">
<style>
@media print { .mainnav,.footer-actions,.no-print{display:none!important} body{background:#fff} .card{box-shadow:none} }
.sheet h2{margin-bottom:4px} .line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)} .line span{color:var(--muted)}
</style></head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav no-print"><a class="navbtn" href="index.html">Jobs</a><a class="navbtn" href="workbench.html">Workbench</a><a class="navbtn" href="summary.html">Summary</a><a class="navbtn" href="business.html">Business</a></nav>
<div class="hero no-print"><div><div class="kicker">FINISH</div><h2>Job sheet</h2><p class="muted">Print saves a PDF. The job card is what you give ChatGPT.</p></div></div>
<section class="card sheet" id="sheet"><p class="muted">Loading…</p></section>
<div class="footer-actions no-print">
<button id="printSheet" class="btn" type="button">Save PDF</button>
<button id="exportCard" class="btn secondary" type="button">Export job card</button>
<button id="copyBrief" class="btn secondary" type="button">Copy for ChatGPT</button>
</div>
<p id="statusText" class="muted small no-print"></p>
</div>
<script type="module">
import { STAGES, loadState, current, exportCard, money, labourCost, investment } from "./js/store.js";
import { STAGE_COPY } from "./js/stages.js";
const $ = id => document.getElementById(id);
const state = await loadState();
const job = current(state);
const p = job.passport || {}, b = job.business || {};
const sale = Number(b.actualSale) || Number(b.targetSale) || 0;
const total = investment(b);
const lines = [
  ["Decision", job.decision || "Not set"],
  ["Maker", p.maker], ["Model", p.model], ["Calibre", p.calibre], ["Jewels", p.jewels],
  ["Serial", p.serial], ["Case", [p.caseMaterial, p.caseNumber].filter(Boolean).join(" ")],
  ["Purchase", b.purchasePrice ? money(b.purchasePrice) : ""],
  ["Parts", b.partsCost ? money(b.partsCost) : ""],
  ["Labour", labourCost(b) ? money(labourCost(b)) : ""],
  ["Investment", money(total)],
  ["Sale", sale ? money(sale) : ""],
  ["Profit", sale ? money(sale - total) : ""]
].filter(x => x[1]);
const stages = job.stages.map((s,i) => {
  const title = (STAGE_COPY[STAGES[i]] && STAGE_COPY[STAGES[i]].title) || STAGES[i];
  const bits = [s.condition, s.measure, s.parts, s.notes].filter(Boolean).join(" · ");
  if (!bits && !s.complete) return "";
  return "<div class='line'><span>"+title+"</span><strong>"+(s.complete?"Done. ":"")+(bits||"Opened")+"</strong></div>";
}).join("");
const runs = (job.timingRuns||[]).slice(0,4).map(r => "<div class='line'><span>"+r.position+"</span><strong>"+(r.rate>=0?"+":"")+Number(r.rate).toFixed(0)+" s/day · beat "+(r.beatError==null?"n/a":Number(r.beatError).toFixed(1)+" ms")+"</strong></div>").join("");
$("sheet").innerHTML = "<div class='kicker'>CALIBRE & CO.</div><h2>"+job.watchName+"</h2><p class='muted small'>"+job.jobId+"</p>"
  + lines.map(x => "<div class='line'><span>"+x[0]+"</span><strong>"+x[1]+"</strong></div>").join("")
  + (p.notes?"<p>"+p.notes+"</p>":"")
  + "<h3>Work</h3>"+(stages||"<p class='muted'>No stage notes.</p>")
  + (runs?"<h3>Timing</h3>"+runs:"");
function download(name, data){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})); a.download = name; a.click(); }
$("printSheet").onclick = () => window.print();
$("exportCard").onclick = () => { const card = exportCard(job); download((card.pushId||"job")+".calibrejob", card); $("statusText").textContent = "Job card saved. Give that file to ChatGPT."; };
$("copyBrief").onclick = async () => {
  const text = ["Write a one-page service summary from this Calibre job. Only claim work that is marked done. No hype.", "", JSON.stringify(exportCard(job), null, 2)].join("\n");
  try { await navigator.clipboard.writeText(text); $("statusText").textContent = "Copied. Paste it into ChatGPT."; }
  catch { $("statusText").textContent = "Copy failed. Use Export job card."; }
};
</script></body></html>
