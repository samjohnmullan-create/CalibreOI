<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bench Mode · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=14">
<style>
.bench-shell{max-width:980px;margin:0 auto;padding-bottom:92px}.bench-head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin:8px 0 12px}.bench-head h2{margin:2px 0 3px;font-size:1.55rem}.bench-session{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.bench-lifecycle{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;width:100%}.bench-lifecycle .btn{min-height:32px;padding:5px 8px;font-size:.62rem}.bench-lifecycle .danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}.bench-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:10px}.bench-card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px}.bench-label{font-size:.62rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.055em;margin-bottom:4px}.bench-current{font-size:1.2rem;font-weight:850;line-height:1.25}.bench-next{font-size:.82rem;font-weight:750}.bench-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.bench-pill{border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:.64rem;color:var(--muted)}.bench-pill.warn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}.bench-steps{display:grid;gap:6px;margin-top:8px}.bench-step{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}.bench-step strong{font-size:.74rem}.bench-step small{display:block;color:var(--muted);font-size:.62rem;margin-top:2px}.bench-step button{min-height:36px}.bench-list{display:grid;gap:6px}.bench-list-row{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:.7rem}.bench-list-row strong{display:block;margin-bottom:2px}.bench-exception{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}.bench-exception[data-severity="critical"]{border-color:color-mix(in srgb,var(--danger) 48%,var(--line))}.bench-exception[data-severity="warning"]{border-color:color-mix(in srgb,var(--accent) 52%,var(--line))}.bench-exception[data-severity="success"]{border-color:color-mix(in srgb,var(--ok) 52%,var(--line))}.bench-exception-icon{font-size:.9rem}.bench-exception strong{display:block;font-size:.72rem}.bench-exception small{display:block;color:var(--muted);font-size:.63rem;line-height:1.35;margin-top:2px}.bench-exception button{min-height:32px;padding:4px 7px;font-size:.62rem}.bench-actions{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(940px,calc(100% - 20px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:7px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);z-index:20}.bench-actions button{min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.7rem;font-weight:750;display:grid;place-items:center;text-align:center;padding:5px}.bench-actions .live{border-color:var(--accent)}.bench-status{min-height:18px;margin-top:7px;font-size:.68rem;color:var(--muted)}
@media(max-width:760px){.bench-head{display:block}.bench-session{margin-top:10px;justify-content:flex-start}.bench-lifecycle{justify-content:flex-start}.bench-grid{grid-template-columns:1fr}.bench-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.bench-current{font-size:1.08rem}.bench-exception{grid-template-columns:auto minmax(0,1fr)}.bench-exception button{grid-column:2;width:max-content}}
</style></head><body><div class="shell bench-shell"><header class="brandbar"><a class="brand" href="workbench.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Bench Mode</h1></div></a></header><nav class="mainnav"></nav>
<div class="bench-head"><div><div class="kicker">LIVE WORKSHOP</div><h2 id="itemTitle">Loading…</h2><p id="workTitle" class="muted"></p></div><div class="bench-session"><span id="sessionClock" class="badge">No active session</span><button id="sessionBtn" class="btn" type="button">Start Bench Session</button><div class="bench-lifecycle"><button id="pauseWork" class="btn secondary" type="button">Pause Work</button><button id="removeBench" class="btn secondary" type="button">Remove from Bench</button><button id="cancelQc" class="btn secondary" type="button" hidden>Cancel QC</button><button id="cancelWork" class="btn secondary danger" type="button">Cancel Work</button></div></div></div>
<div class="bench-grid"><div>
<section class="bench-card"><div class="bench-label">Current task</div><div id="currentTask" class="bench-current">—</div><div class="section-rule"><div class="bench-label">Next task</div><div id="nextTask" class="bench-next">—</div></div><div id="meta" class="bench-meta"></div><div id="status" class="bench-status"></div></section>
<section class="bench-card" id="workflowCard" style="margin-top:10px"><div class="bench-label">Workflow</div><div id="steps" class="bench-steps"></div></section>
</div><div>
<section class="bench-card"><div class="bench-label">Exceptions / next attention</div><div id="exceptions" class="bench-list"></div></section>
<section class="bench-card" style="margin-top:10px"><div class="bench-label">Recent measurements</div><div id="measurements" class="bench-list"></div></section>
<section class="bench-card" style="margin-top:10px"><div class="bench-label">Recent timing</div><div id="timing" class="bench-list"></div></section>
</div></div>
<div class="bench-actions"><button id="photoBtn" class="live" type="button">📷 Photo</button><button id="noteBtn" class="live" type="button">✎ Note</button><button id="measureBtn" class="live" type="button">📏 Measure</button><button id="partBtn" class="live" type="button">🔩 Part</button><button id="timingBtn" class="live" type="button">⏱ Timing</button><button id="problemBtn" class="live" type="button">⚠ Problem</button></div>
</div><script src="js/nav.js?v=63"></script><script type="module">
import {loadStructuredBenchDetail,startStructuredBenchSession,finishStructuredBenchSession,patchStructuredWork,addStructuredMeasurement,updateStructuredStep,transitionStructuredWork} from './js/structured-cloud.js?v=5';
import {deriveBenchExceptions,exceptionRank} from './js/bench-exceptions.js?v=1';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),workId=params.get('work')||params.get('id')||'';let detail=null,timer=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSeconds=n=>{n=Math.max(0,Math.floor(n||0));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;};
function setStatus(text){$('status').textContent=text||'';}
function isPaused(){const w=detail?.work||{};return String(w.status)==='waiting'&&String(w.waiting_reason)==='other'&&!String(w.blocker||'').trim();}
function paintClock(){if(timer)clearInterval(timer);const active=detail?.activeSession;if(!active){$('sessionClock').textContent='No active session';$('sessionBtn').textContent='Start Bench Session';return;}const start=Date.parse(active.started_at)||Date.now();const tick=()=>{$('sessionClock').textContent=`Bench ${fmtSeconds((Date.now()-start)/1000)}`;};tick();timer=setInterval(tick,1000);$('sessionBtn').textContent='Finish Session';}
function paintLifecycle(){const status=String(detail?.work?.status||'');const terminal=['complete','cancelled'].includes(status);$('pauseWork').hidden=terminal||status==='queued'||status==='qc';$('pauseWork').textContent=isPaused()?'Resume Work':'Pause Work';$('removeBench').hidden=terminal||status==='queued';$('cancelQc').hidden=status!=='qc';$('cancelWork').hidden=terminal;$('sessionBtn').disabled=terminal||status==='queued'||status==='qc';}
function runExceptionAction(action){if(action==='parts')location.href=`parts-finder.html?work=${encodeURIComponent(workId)}`;else if(action==='timing')location.href=`bench-timegrapher.html?work=${encodeURIComponent(workId)}`;else if(action==='problem')$('problemBtn').click();else if(['workflow','qc'].includes(action))$('workflowCard').scrollIntoView({behavior:'smooth',block:'start'});}
function paint(){const d=detail,item=d.item||{},identity=d.identity||{},work=d.work||{},cur=d.currentStep,next=d.nextStep;$('itemTitle').textContent=item.title||[identity.maker,identity.model].filter(Boolean).join(' ')||'Item';$('workTitle').textContent=`${work.title||'Work'} · ${String(work.status||'').replaceAll('_',' ')}`;$('currentTask').textContent=cur?.label||cur?.description||'Review work';$('nextTask').textContent=next?.label||next?.description||'Final review / QC';$('meta').innerHTML=[identity.maker,identity.model,d.passport?.calibre,work.type].filter(Boolean).map(x=>`<span class="bench-pill">${esc(x)}</span>`).join('');
$('steps').innerHTML=(d.steps||[]).map(step=>`<div class="bench-step"><div><strong>${esc(step.label||step.description||'Step')}</strong><small>${esc(step.status||'not started')}${step.required?' · required':''}${step.blocked_reason?` · ${esc(step.blocked_reason)}`:''}</small></div>${String(step.status||'').toLowerCase()==='done'?'✅':`<button class="btn secondary" data-step="${esc(step.id)}" type="button">Done</button>`}</div>`).join('')||'<div class="muted small">No checklist steps yet.</div>';
$('steps').querySelectorAll('[data-step]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;try{await updateStructuredStep(btn.dataset.step,'done');await refresh();}catch(err){setStatus(err?.message||'Could not update step.');}finally{btn.disabled=false;}});
const exceptions=deriveBenchExceptions(d).sort((a,b)=>exceptionRank(a.severity)-exceptionRank(b.severity));$('exceptions').innerHTML=exceptions.length?exceptions.map((x,i)=>`<div class="bench-exception" data-severity="${esc(x.severity)}"><div class="bench-exception-icon">${esc(x.icon||'•')}</div><div><strong>${esc(x.title)}</strong><small>${esc(x.detail||'')}</small></div>${x.action?`<button class="btn secondary" data-exception="${i}" type="button">Open</button>`:''}</div>`).join(''):'<div class="bench-list-row">✅ Nothing needs attention right now.</div>';$('exceptions').querySelectorAll('[data-exception]').forEach(btn=>btn.onclick=()=>runExceptionAction(exceptions[Number(btn.dataset.exception)]?.action));
$('measurements').innerHTML=(d.measurements||[]).map(m=>`<div class="bench-list-row"><strong>${esc(m.measurement_type)}</strong>${esc(m.value)} ${esc(m.unit||'')}</div>`).join('')||'<div class="muted small">No measurements yet.</div>';
$('timing').innerHTML=(d.timing||[]).slice(0,5).map(t=>`<div class="bench-list-row"><strong>${esc((t.phase||'timing').replaceAll('_',' '))} · ${esc((t.position||'').replaceAll('_',' '))}</strong>${t.rate_seconds_per_day==null?'—':esc(t.rate_seconds_per_day)+' s/d'} · BE ${t.beat_error_ms==null?'—':esc(t.beat_error_ms)+' ms'}${t.bph?` · ${esc(t.bph)} BPH`:''}</div>`).join('')||'<div class="muted small">No timing runs yet.</div>';paintClock();paintLifecycle();}
async function refresh(){detail=await loadStructuredBenchDetail(workId);paint();}
$('sessionBtn').onclick=async()=>{try{if(detail?.activeSession){const note=prompt('Session note (optional):','')||'';await finishStructuredBenchSession(detail.activeSession.id,note);}else{if(isPaused())await transitionStructuredWork(workId,'resume',{reason:'Bench session restarted'});await startStructuredBenchSession(workId);}await refresh();}catch(err){setStatus(err?.message||'Bench session could not be changed.');}};
$('pauseWork').onclick=async()=>{const resume=isPaused();if(!resume&&!confirm('Pause this Work? It will stay open but leave active bench work.'))return;try{await transitionStructuredWork(workId,resume?'resume':'pause',{reason:resume?'Resumed from Bench Mode':'Paused from Bench Mode'});if(resume){await refresh();setStatus('Work resumed.');}else location.href='workbench.html';}catch(err){setStatus(err?.message||'Work state could not be changed.');}};
$('removeBench').onclick=async()=>{if(!confirm('Remove this Work from the bench and return it to the queue? The Work record and history will stay open.'))return;try{await transitionStructuredWork(workId,'queue',{reason:'Removed from Bench Mode'});location.href='workbench.html';}catch(err){setStatus(err?.message||'Work could not be removed from the bench.');}};
$('cancelWork').onclick=async()=>{const reason=prompt('Reason for cancelling this Work:','Cancelled from Bench Mode');if(reason===null)return;if(!confirm('Cancel this Work record? Its workshop history will be kept.'))return;try{await transitionStructuredWork(workId,'cancel',{reason});location.href='workbench.html';}catch(err){setStatus(err?.message||'Work could not be cancelled.');}};
$('cancelQc').onclick=async()=>{if(!confirm('Cancel Final QC and return this Work to the bench? QC history already recorded will be kept.'))return;try{await transitionStructuredWork(workId,'cancel_qc',{reason:'Final QC cancelled from Bench Mode'});await refresh();setStatus('Final QC cancelled. Work returned to the bench.');}catch(err){setStatus(err?.message||'Final QC could not be cancelled.');}};
$('noteBtn').onclick=async()=>{const existing=detail?.work?.notes||'',note=prompt('Bench note:',existing);if(note===null)return;try{await patchStructuredWork(workId,{notes:note});await refresh();setStatus('Note saved.');}catch(err){setStatus(err?.message||'Note could not be saved.');}};
$('problemBtn').onclick=async()=>{const problem=prompt('What problem did you find?',detail?.work?.blocker||'');if(problem===null)return;try{await patchStructuredWork(workId,{blocker:problem,status:problem?'waiting':'on_bench',waiting_reason:problem?'other':null});await refresh();setStatus(problem?'Problem recorded.':'Problem cleared.');}catch(err){setStatus(err?.message||'Problem could not be saved.');}};
$('measureBtn').onclick=async()=>{const type=prompt('Measurement type (e.g. crystal diameter, pivot, stem):','');if(!type)return;const value=prompt('Value:','');if(value===null)return;const unit=prompt('Unit:','mm')||'mm';try{await addStructuredMeasurement(workId,detail.item.id,{type,value,unit});await refresh();setStatus('Measurement saved.');}catch(err){setStatus(err?.message||'Measurement could not be saved.');}};
$('photoBtn').onclick=()=>{if(!workId)return;location.href=`bench-capture.html?work=${encodeURIComponent(workId)}&role=progress`;};$('partBtn').onclick=()=>{if(!workId)return;location.href=`parts-finder.html?work=${encodeURIComponent(workId)}`;};$('timingBtn').onclick=()=>{if(!workId)return;location.href=`bench-timegrapher.html?work=${encodeURIComponent(workId)}`;};
if(!workId){$('itemTitle').textContent='No Work selected';$('workTitle').textContent='Open Bench Mode from Workbench.';$('sessionBtn').disabled=true;}else{try{await refresh();}catch(err){$('itemTitle').textContent='Bench Mode could not load';$('workTitle').textContent=err?.message||'Unknown error';$('sessionBtn').disabled=true;}}
</script></body></html>
