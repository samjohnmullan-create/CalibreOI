<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bench Mode · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=14">
<style>
.bench-shell{max-width:980px;margin:0 auto;padding-bottom:92px}.bench-head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin:8px 0 12px}.bench-head h2{margin:2px 0 3px;font-size:1.55rem}.bench-session{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.bench-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:10px}.bench-card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px}.bench-label{font-size:.62rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.055em;margin-bottom:4px}.bench-current{font-size:1.2rem;font-weight:850;line-height:1.25}.bench-next{font-size:.82rem;font-weight:750}.bench-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.bench-pill{border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:.64rem;color:var(--muted)}.bench-pill.warn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}.bench-steps{display:grid;gap:6px;margin-top:8px}.bench-step{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}.bench-step strong{font-size:.74rem}.bench-step small{display:block;color:var(--muted);font-size:.62rem;margin-top:2px}.bench-step button{min-height:36px}.bench-list{display:grid;gap:6px}.bench-list-row{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:.7rem}.bench-list-row strong{display:block;margin-bottom:2px}.bench-actions{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(940px,calc(100% - 20px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:7px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);z-index:20}.bench-actions button,.bench-actions a{min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.7rem;font-weight:750;display:grid;place-items:center;text-align:center;text-decoration:none;padding:5px}.bench-actions .live{border-color:var(--accent)}.bench-status{min-height:18px;margin-top:7px;font-size:.68rem;color:var(--muted)}
@media(max-width:760px){.bench-head{display:block}.bench-session{margin-top:10px}.bench-grid{grid-template-columns:1fr}.bench-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.bench-current{font-size:1.08rem}}
</style></head><body><div class="shell bench-shell"><header class="brandbar"><a class="brand" href="workbench.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Bench Mode</h1></div></a></header><nav class="mainnav"></nav>
<div class="bench-head"><div><div class="kicker">LIVE WORKSHOP</div><h2 id="itemTitle">Loading…</h2><p id="workTitle" class="muted"></p></div><div class="bench-session"><span id="sessionClock" class="badge">No active session</span><button id="sessionBtn" class="btn" type="button">Start Bench Session</button></div></div>
<div class="bench-grid"><div>
<section class="bench-card"><div class="bench-label">Current task</div><div id="currentTask" class="bench-current">—</div><div class="section-rule"><div class="bench-label">Next task</div><div id="nextTask" class="bench-next">—</div></div><div id="meta" class="bench-meta"></div><div id="status" class="bench-status"></div></section>
<section class="bench-card" style="margin-top:10px"><div class="bench-label">Workflow</div><div id="steps" class="bench-steps"></div></section>
</div><div>
<section class="bench-card"><div class="bench-label">Exceptions / blockers</div><div id="exceptions" class="bench-list"></div></section>
<section class="bench-card" style="margin-top:10px"><div class="bench-label">Recent measurements</div><div id="measurements" class="bench-list"></div></section>
<section class="bench-card" style="margin-top:10px"><div class="bench-label">Recent timing</div><div id="timing" class="bench-list"></div></section>
</div></div>
<div class="bench-actions"><button id="photoBtn" type="button">📷 Photo</button><button id="noteBtn" class="live" type="button">✎ Note</button><button id="measureBtn" class="live" type="button">📏 Measure</button><button id="partBtn" type="button">🔩 Part</button><a id="timingBtn" href="timegrapher.html">⏱ Timing</a><button id="problemBtn" class="live" type="button">⚠ Problem</button></div>
</div><script src="js/nav.js?v=63"></script><script type="module">
import {loadStructuredBenchDetail,startStructuredBenchSession,finishStructuredBenchSession,patchStructuredWork,addStructuredMeasurement,updateStructuredStep} from './js/structured-cloud.js?v=3';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),workId=params.get('work')||params.get('id')||'';let detail=null,timer=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSeconds=n=>{n=Math.max(0,Math.floor(n||0));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;};
function setStatus(text){$('status').textContent=text||'';}
function paintClock(){if(timer)clearInterval(timer);const active=detail?.activeSession;if(!active){$('sessionClock').textContent='No active session';$('sessionBtn').textContent='Start Bench Session';return;}const start=Date.parse(active.started_at)||Date.now();const tick=()=>{$('sessionClock').textContent=`Bench ${fmtSeconds((Date.now()-start)/1000)}`;};tick();timer=setInterval(tick,1000);$('sessionBtn').textContent='Finish Session';}
function paint(){const d=detail,item=d.item||{},identity=d.identity||{},work=d.work||{},cur=d.currentStep,next=d.nextStep;$('itemTitle').textContent=item.title||[identity.maker,identity.model].filter(Boolean).join(' ')||'Item';$('workTitle').textContent=`${work.title||'Work'} · ${String(work.status||'').replaceAll('_',' ')}`;$('currentTask').textContent=cur?.label||cur?.description||'Review work';$('nextTask').textContent=next?.label||next?.description||'Final review / QC';$('meta').innerHTML=[identity.maker,identity.model,d.passport?.calibre,work.type].filter(Boolean).map(x=>`<span class="bench-pill">${esc(x)}</span>`).join('');
$('steps').innerHTML=(d.steps||[]).map(step=>`<div class="bench-step"><div><strong>${esc(step.label||step.description||'Step')}</strong><small>${esc(step.status||'not started')}${step.required?' · required':''}</small></div>${String(step.status||'').toLowerCase()==='done'?'✅':`<button class="btn secondary" data-step="${esc(step.id)}" type="button">Done</button>`}</div>`).join('')||'<div class="muted small">No checklist steps yet.</div>';
$('steps').querySelectorAll('[data-step]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;try{await updateStructuredStep(btn.dataset.step,'done');await refresh();}catch(err){setStatus(err?.message||'Could not update step.');}finally{btn.disabled=false;}});
const exceptions=[];if(work.blocker)exceptions.push(`⚠ ${work.blocker}`);for(const need of d.partNeeds||[])exceptions.push(`🔧 ${need.part_type||need.description||'Part needed'} · ${need.status||'needed'}`);if(!exceptions.length)exceptions.push('✅ No active blocker');$('exceptions').innerHTML=exceptions.map(x=>`<div class="bench-list-row">${esc(x)}</div>`).join('');
$('measurements').innerHTML=(d.measurements||[]).map(m=>`<div class="bench-list-row"><strong>${esc(m.measurement_type)}</strong>${esc(m.value)} ${esc(m.unit||'')}</div>`).join('')||'<div class="muted small">No measurements yet.</div>';
$('timing').innerHTML=(d.timing||[]).map(t=>`<div class="bench-list-row"><strong>${esc(t.position||'Timing run')}</strong>${t.rate_seconds_per_day==null?'—':esc(t.rate_seconds_per_day)+' s/d'} · BE ${t.beat_error_ms==null?'—':esc(t.beat_error_ms)+' ms'}${t.bph?` · ${esc(t.bph)} BPH`:''}</div>`).join('')||'<div class="muted small">No timing runs yet.</div>';
$('timingBtn').href=`timegrapher.html?id=${encodeURIComponent(workId)}&item=${encodeURIComponent(item.id||'')}`;paintClock();}
async function refresh(){detail=await loadStructuredBenchDetail(workId);paint();}
$('sessionBtn').onclick=async()=>{try{if(detail?.activeSession){const note=prompt('Session note (optional):','')||'';await finishStructuredBenchSession(detail.activeSession.id,note);}else{await startStructuredBenchSession(workId);}await refresh();}catch(err){setStatus(err?.message||'Bench session could not be changed.');}};
$('noteBtn').onclick=async()=>{const existing=detail?.work?.notes||'',note=prompt('Bench note:',existing);if(note===null)return;try{await patchStructuredWork(workId,{notes:note});await refresh();setStatus('Note saved.');}catch(err){setStatus(err?.message||'Note could not be saved.');}};
$('problemBtn').onclick=async()=>{const problem=prompt('What problem did you find?',detail?.work?.blocker||'');if(problem===null)return;try{await patchStructuredWork(workId,{blocker:problem,status:problem?'waiting':'on_bench',waiting_reason:problem?'other':null});await refresh();setStatus(problem?'Problem recorded.':'Problem cleared.');}catch(err){setStatus(err?.message||'Problem could not be saved.');}};
$('measureBtn').onclick=async()=>{const type=prompt('Measurement type (e.g. crystal diameter, pivot, stem):','');if(!type)return;const value=prompt('Value:','');if(value===null)return;const unit=prompt('Unit:','mm')||'mm';try{await addStructuredMeasurement(workId,detail.item.id,{type,value,unit});await refresh();setStatus('Measurement saved.');}catch(err){setStatus(err?.message||'Measurement could not be saved.');}};
$('photoBtn').onclick=()=>setStatus('Photo bridge is next: structured Work media needs to be connected to Capture Station before this button writes evidence.');$('partBtn').onclick=()=>setStatus('Parts quick-action is next: this will open the donor/parts finder in current Work context.');
if(!workId){$('itemTitle').textContent='No Work selected';$('workTitle').textContent='Open Bench Mode from Workbench.';$('sessionBtn').disabled=true;}else{try{await refresh();}catch(err){$('itemTitle').textContent='Bench Mode could not load';$('workTitle').textContent=err?.message||'Unknown error';$('sessionBtn').disabled=true;}}
</script></body></html>
