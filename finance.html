<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Funds · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=9">
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"></nav>
<div class="hero"><div><div class="kicker">MONEY</div><h2>Funds</h2><p class="muted">What came in, what went out, and what is left to spend.</p></div></div>
<div class="business-metrics" id="totals"></div>
<section class="card">
<div class="grid2">
<label>Movement<select id="kind"><option value="in">Money in</option><option value="out">Money spent</option><option value="taken">Funds taken</option></select></label>
<label>On<select id="category"><option>Watches</option><option>Parts</option><option>Tools</option><option>Consumables</option></select></label>
<label>How<select id="method"><option>EFT</option><option>Transfer</option><option>Cash</option></select></label>
<label>Amount<input id="amount" inputmode="decimal" placeholder="0.00"></label>
<label>Date<input id="when" type="date"></label>
<label>Note<input id="note" placeholder="Sale, parts, drawings"></label>
</div>
<button id="add" class="btn" type="button">Add</button>
<div id="rows"></div>
<p id="statusText" class="muted small"></p>
</section>
</div>
<script src="js/nav.js?v=13"></script>
<script type="module">
import { loadState, saveState, money, escapeHtml, cashOut } from "./js/store.js?v=22";
const $ = id => document.getElementById(id);
let state = await loadState();
$("when").value = new Date().toISOString().slice(0, 10);
function sum(kind, method){
  return (state.ledger || []).filter(e => e.kind === kind && (!method || e.method === method)).reduce((n, e) => n + (Number(e.amount) || 0), 0);
}
function jobSpend(keys){
  return (state.jobs || []).reduce((n, j) => n + keys.reduce((m, k) => m + (Number(j.business && j.business[k]) || 0), 0), 0);
}
function book(category){
  return (state.ledger || []).filter(e => e.kind === "out" && (e.category || "Watches") === category).reduce((n, e) => n + (Number(e.amount) || 0), 0);
}
function paint(){
  const watches = jobSpend(["purchasePrice","buyerPremium","postage","strapCost","batteryCost","externalService","marketplaceFees","shippingToBuyer","otherCost"]) + book("Watches");
  const parts = jobSpend(["partsCost"]) + book("Parts");
  const tools = book("Tools");
  const consumables = jobSpend(["consumables"]) + book("Consumables");
  const out = watches + parts + tools + consumables;
  const inn = sum("in"), taken = sum("taken");
  const available = inn - out - taken;
  $("totals").innerHTML = [["Money in", inn],["Money spent", out],["Funds taken", taken],["Available", available],["Watches", watches],["Parts", parts],["Tools", tools],["Consumables", consumables]].map(([label, n]) => `<div><span>${label}</span><strong>${money(n)}</strong></div>`).join("");
  $("rows").innerHTML = (state.ledger || []).map((e, i) => `<div class="line"><span>${e.when || ""} · ${e.kind === "in" ? "In" : e.kind === "taken" ? "Taken" : "Spent"} · ${escapeHtml(e.category || "")} · ${escapeHtml(e.method)} · ${escapeHtml(e.note || "")}</span><strong>${money(e.amount)}</strong> <button class="btn secondary drop" data-i="${i}" type="button">Remove</button></div>`).join("") || "<p class='muted'>No movements yet. Watch costs already on a job are counted above.</p>";
  $("rows").querySelectorAll(".drop").forEach(b => b.onclick = async () => { state.ledger.splice(Number(b.dataset.i), 1); await saveState(state); paint(); });
}
$("add").onclick = async () => {
  try {
    const amount = $("amount").value;
    if (!amount) { $("statusText").textContent = "Enter an amount."; return; }
    if (!Array.isArray(state.ledger)) state.ledger = [];
    state.ledger.unshift({ kind:$("kind").value, method:$("method").value, category:$("category").value, amount, when:$("when").value, note:$("note").value });
    $("amount").value = ""; $("note").value = "";
    await saveState(state); paint();
    $("statusText").textContent = "Saved on this phone.";
  } catch (err) { $("statusText").textContent = err.message || "Could not add."; }
};
paint();
</script></body></html>
