<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Time · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=10">
<style>
.tg{display:grid;gap:14px}.scale{position:relative;height:92px;border-radius:14px;background:var(--surface-2);overflow:hidden}.band{position:absolute;left:37.5%;right:37.5%;top:0;bottom:0;background:rgba(62,119,82,.16)}.centre{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--brass)}.marker{position:absolute;top:28px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--nav);border:2px solid var(--brass)}.ticks{display:flex;justify-content:space-between;padding:8px 10px 0;color:var(--muted);font-size:.68rem}.rate{font-size:3rem;margin:0;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.pill{display:inline-block;border-radius:999px;padding:4px 10px;font-weight:800;font-size:.75rem}.good{background:#e5f0e8;color:#245c38}.attention{background:#f6ecd4;color:#8a5a12}.adjust{background:#f6e4e2;color:#8d342e}.poor{background:var(--surface-2);color:var(--muted)}.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}.bar span{display:block;height:100%;background:var(--brass)}.trace{width:100%;height:120px;background:#050505;border-radius:12px}.dash{display:grid;gap:12px}.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cell{background:var(--surface-2);border-radius:12px;padding:10px}.cell span{display:block;color:var(--muted);font-size:.68rem;letter-spacing:.04em}.cell strong{display:block;margin-top:4px;font-size:1.15rem}@media(max-width:640px){.board{grid-template-columns:1fr 1fr}}
</style>
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"></nav>
<div class="hero"><div><div class="kicker">RATE</div><h2 id="watchTitle">Time</h2></div></div>
<section class="card tg dash">
<p class="kicker">EASY</p><p class="rate" id="rate">—</p><span class="pill poor" id="status">Tap Start</span>
<div class="scale"><div class="band"></div><div class="centre"></div><div class="marker" id="marker" style="left:50%"></div></div><div class="ticks"><span>Slow</span><span>Perfect</span><span>Fast</span></div>
<p id="advice">Put the watch by the phone microphone, then start.</p><div class="bar"><span id="level" style="width:0"></span></div><p id="stabLabel" class="small">Not enough data</p><canvas class="trace" id="trace" width="900" height="160"></canvas>
<p class="kicker">ADVANCED</p><div class="board"><div class="cell"><span>Rate</span><strong id="advRate">—</strong></div><div class="cell"><span>BPH</span><strong id="advBph">—</strong></div><div class="cell"><span>Beat error</span><strong id="advBeat">—</strong></div><div class="cell"><span>Confidence</span><strong id="advConf">—</strong></div><div class="cell"><span>Samples</span><strong id="advSamples">—</strong></div><div class="cell"><span>Jitter</span><strong id="advJitter">—</strong></div></div>
<p class="kicker">TIMEGRAPHER</p>
<div class="grid2"><label>Beat rate<select id="bph"><option value="0">Auto</option><option>14400</option><option>18000</option><option>19800</option><option>21600</option><option>25200</option><option>28800</option><option>36000</option></select></label><label>Lift angle<select id="lift"><option>44</option><option>49</option><option selected>52</option><option>58</option><option>62</option></select></label><label>Position<select id="position"><option>Dial up</option><option>Dial down</option><option>Crown left</option><option>Crown right</option><option>Crown up</option><option>Crown down</option></select></label><label>Measure<select id="window"><option value="10">10 s</option><option value="20" selected>20 s</option><option value="30">30 s</option><option value="60">60 s</option></select></label><label>Gain<select id="gain"><option value="1.6">Low</option><option value="2.2" selected>Normal</option><option value="3">High</option></select></label></div>
<canvas class="trace" id="paper" width="900" height="220"></canvas><label>Tag<select id="phase"><option>Before service</option><option>During service</option><option>After service</option><option>Regulation test</option><option>Final test</option></select></label>
<div class="row"><button id="start" class="btn" type="button">Start</button><button id="stop" class="btn secondary" type="button">Stop</button><button id="save" class="btn secondary" type="button">Save run</button></div><p id="hint" class="muted small"></p>
</section></div>
<script src="js/nav.js?v=30"></script>
<script type="module">
import { loadState, saveState, current } from "./js/store.js?v=26";
import { analyse, advice } from "./js/timing-engine.js?v=1";
const $=id=>document.getElementById(id);
let state,job,stream,ac,node,source,silent,beats=[],trace=[],last=null,running=false;
function drawTrace(){const c=$("trace"),g=c.getContext("2d"),w=c.width,h=c.height;g.fillStyle="#050505";g.fillRect(0,0,w,h);g.strokeStyle="#5b8fa8";g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();g.fillStyle="#8fb7ca";trace.slice(-50).forEach((rate,i,arr)=>{const x=arr.length<2?w/2:i/(arr.length-1)*(w-16)+8,y=h/2-Math.max(-70,Math.min(70,rate))*.7;g.beginPath();g.arc(x,y,3.5,0,6.3);g.fill();});}
function drawPaper(){const c=$("paper"),g=c.getContext("2d"),w=c.width,h=c.height;g.fillStyle="#050505";g.fillRect(0,0,w,h);g.strokeStyle="#16303c";for(let y=20;y<h;y+=20){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}const bph=Number($("bph").value)||(last&&last.bph)||18000,nominal=3600/bph;g.fillStyle="#8fb7ca";beats.slice(-80).forEach((beat,i,arr)=>{if(!i)return;const gap=beat.t-arr[i-1].t,slip=((gap-nominal)/nominal)*h*4,x=i/arr.length*w,y=(h/2+slip)%h;g.fillRect(x,y<0?y+h:y,3,8);});}
function show(result){last=result;if(!result||!result.ready){$("advice").textContent=result?result.stage:"Listening";return;}const rate=result.rateSecondsPerDay;$("rate").textContent=(rate>=0?"+":"")+rate.toFixed(0);$("status").textContent=result.status==="good"?"Timing Good":result.status==="attention"?"Needs attention":result.status==="adjust"?"Needs adjustment":"Poor signal";$("status").className="pill "+result.status;$("marker").style.left=Math.max(6,Math.min(94,50+rate/60*50))+"%";$("advice").textContent=advice(result);$("stabLabel").textContent=result.stabilityLabel;$("advRate").textContent=(rate>=0?"+":"")+rate.toFixed(1)+" s/day";$("advBph").textContent=result.bph||"—";$("advBeat").textContent=result.beatErrorMs==null?"Not enough data":result.beatErrorMs.toFixed(1)+" ms";$("advConf").textContent=Math.round(result.confidence*100)+"%";$("advSamples").textContent=result.samples;$("advJitter").textContent=result.jitterMs.toFixed(1)+" ms";trace.push(rate);if(trace.length>60)trace.shift();drawTrace();drawPaper();}
function hear(t){const seconds=Number($("window").value)||20;beats.push({t});beats=beats.filter(b=>t-b.t<seconds);show(analyse(beats,Number($("bph").value)||0));$("hint").textContent=beats.length+" ticks · "+$("position").value;}
async function stopAudio(){running=false;if(node){try{node.disconnect();}catch{}node=null;}if(source){try{source.disconnect();}catch{}source=null;}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}if(ac){try{await ac.close();}catch{}ac=null;}$("level").style.width="0%";}
$("gain").onchange=()=>{if(node)node.port.postMessage({sens:Number($("gain").value)||2.2});};
$("start").onclick=async()=>{await stopAudio();$("status").textContent="Opening";$("hint").textContent="Opening the microphone.";try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ac=new AudioContext();if(ac.state==="suspended")await ac.resume();await ac.audioWorklet.addModule("js/tg-processor.js?v=2");source=ac.createMediaStreamSource(stream);node=new AudioWorkletNode(ac,"calibre-tick");silent=ac.createGain();silent.gain.value=0;node.port.onmessage=e=>{const d=e.data||{};if(d.kind==="level")$("level").style.width=Math.min(100,Math.max(0,d.pk*400))+"%";if(d.kind==="beat"&&running)hear(d.t);};node.port.postMessage({sens:Number($("gain").value)||2.2});source.connect(node);node.connect(silent);silent.connect(ac.destination);running=true;beats=[];trace=[];last=null;$("status").textContent="Listening";$("hint").textContent=stream.getAudioTracks()[0].label||"Microphone open";}catch(err){await stopAudio();$("status").textContent="Blocked";$("hint").textContent=(err.name||"Error")+" — "+(err.message||"could not open microphone");}};
$("stop").onclick=async()=>{await stopAudio();$("status").textContent="Stopped";$("hint").textContent="Microphone closed.";};
$("save").onclick=async()=>{if(!last||!last.ready||!job){$("hint").textContent="Not enough data to save.";return;}job.timingRuns=job.timingRuns||[];job.timingRuns.unshift({...last,phase:$("phase").value,position:$("position").value,liftAngle:Number($("lift").value)||null,savedAt:new Date().toISOString()});await saveState(state);$("hint").textContent="Saved as "+$("phase").value+" · "+$("position").value+".";};
window.addEventListener("pagehide",()=>{stopAudio();});
state=await loadState();job=current(state);$("watchTitle").textContent=job?job.watchName:"Time";drawTrace();drawPaper();
</script></body></html>
