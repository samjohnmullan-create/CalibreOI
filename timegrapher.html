<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Time · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=9">
<style>
.tg{display:grid;gap:14px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1}
.tabs button.on{background:var(--nav);color:#f3efe6;border-color:var(--nav)}
.scale{position:relative;height:92px;border-radius:14px;background:var(--surface-2);overflow:hidden}
.band{position:absolute;left:37.5%;right:37.5%;top:0;bottom:0;background:rgba(62,119,82,.16)}
.centre{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--brass)}
.marker{position:absolute;top:28px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--nav);border:2px solid var(--brass)}
.ticks{display:flex;justify-content:space-between;padding:8px 10px 0;color:var(--muted);font-size:.68rem}
.rate{font-family:Georgia,serif;font-size:3rem;margin:0;letter-spacing:-.03em}
.pill{display:inline-block;border-radius:999px;padding:4px 10px;font-weight:800;font-size:.75rem}
.good{background:#e5f0e8;color:#245c38}.attention{background:#f6ecd4;color:#8a5a12}.adjust{background:#f6e4e2;color:#8d342e}.poor{background:var(--surface-2);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--brass)}
.trace{width:100%;height:120px;background:#111315;border-radius:12px}
.adv{display:none}
body.advanced .adv{display:block}
body.advanced .easy-only{display:none}
</style>
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"></nav>
<div class="hero"><div><div class="kicker">RATE</div><h2 id="watchTitle">Time</h2></div></div>
<section class="card tg">
<div class="tabs"><button id="easyTab" class="btn secondary on" type="button">Easy</button><button id="advTab" class="btn secondary" type="button">Advanced</button></div>
<label>Microphone<select id="mic"><option value="">Phone default</option></select></label>
<div class="bar"><span id="level" style="width:0"></span></div>
<p class="rate" id="rate">—</p>
<span class="pill poor" id="status">Waiting</span>
<div class="scale"><div class="band"></div><div class="centre"></div><div class="marker" id="marker" style="left:50%"></div></div>
<div class="ticks"><span>Slow</span><span>Perfect</span><span>Fast</span></div>
<p id="advice">Put the watch on the capsule, then start.</p>
<div class="easy-only"><span class="muted small">Stability</span><div class="bar"><span id="stab" style="width:0"></span></div><p id="stabLabel" class="small">Not enough data</p></div>
<canvas class="trace" id="trace" width="900" height="160"></canvas>
<div class="adv">
<div class="grid2">
<label>BPH<select id="bph"><option value="0">Auto</option><option>14400</option><option>18000</option><option>19800</option><option>21600</option><option>25200</option><option>28800</option><option>36000</option></select></label>
<label>Tag<select id="phase"><option>Before service</option><option>During service</option><option>After service</option><option>Regulation test</option><option>Final test</option></select></label>
</div>
<p class="small" id="detail">Beat, confidence and sample count appear here.</p>
</div>
<div class="row"><button id="start" class="btn" type="button">Start</button><button id="stop" class="btn secondary" type="button" disabled>Stop</button><button id="save" class="btn secondary" type="button">Save run</button></div>
<p id="hint" class="muted small"></p>
</section>
</div>
<script>
document.getElementById("start").addEventListener("click", function(){
  var stage = document.getElementById("stage");
  if (stage && stage.textContent === "Listening...") stage.textContent = "Button pressed";
});
</script>
<script src="js/nav.js?v=18"></script>
<script type="module">
import { loadState, saveState, current } from "./js/store.js?v=22";
import { analyse, advice } from "./js/timing-engine.js?v=1";
const $ = id => document.getElementById(id);
let state, job, stream, ac, node, running = false, beats = [], trace = [], locked = 0, last = null;
function drawTrace(){
  const c = $("trace"), g = c.getContext("2d"), w = c.width, h = c.height;
  g.fillStyle = "#111315"; g.fillRect(0,0,w,h);
  g.strokeStyle = "#a87a2b"; g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
  g.fillStyle = "#f3efe6";
  trace.slice(-50).forEach((rate, i, arr) => {
    const x = arr.length < 2 ? w/2 : i / (arr.length - 1) * (w - 16) + 8;
    const y = h/2 - Math.max(-70, Math.min(70, rate)) * 0.7;
    g.beginPath(); g.arc(x, y, 3.5, 0, 6.3); g.fill();
  });
}
function show(result){
  last = result;
  if (!result || !result.ready){ $("stage").textContent = result ? result.stage : "Listening..."; $("rate").textContent = "—"; return; }
  const rate = result.rateSecondsPerDay;
  $("stage").textContent = result.stage;
  $("rate").textContent = (rate >= 0 ? "+" : "") + rate.toFixed(0);
  $("status").textContent = result.status === "good" ? "Good" : result.status === "attention" ? "Needs attention" : result.status === "adjust" ? "Needs adjustment" : "Poor signal";
  $("status").className = "pill " + result.status;
  $("marker").style.left = Math.max(6, Math.min(94, 50 + rate / 60 * 50)) + "%";
  $("advice").textContent = advice(result);
  $("stab").style.width = Math.round(result.confidence * 100) + "%";
  $("stabLabel").textContent = result.stabilityLabel;
  $("detail").textContent = "BPH " + result.bph + " · beat " + (result.beatErrorMs == null ? "not enough data" : result.beatErrorMs.toFixed(1) + " ms") + " · confidence " + Math.round(result.confidence * 100) + "% · " + result.samples + " intervals · jitter " + result.jitterMs.toFixed(1) + " ms";
  trace.push(rate); if (trace.length > 60) trace.shift();
  drawTrace();
}
$("easyTab").onclick = () => { document.body.classList.remove("advanced"); $("easyTab").classList.add("on"); $("advTab").classList.remove("on"); };
$("advTab").onclick = () => { document.body.classList.add("advanced"); $("advTab").classList.add("on"); $("easyTab").classList.remove("on"); };
async function stop(){ running = false; if (stream) stream.getTracks().forEach(t => t.stop()); if (ac && ac.state !== "closed") { try { await ac.close(); } catch {} } $("start").disabled = false; $("stop").disabled = true; }
async function listMics(){
  const devices = await navigator.mediaDevices.enumerateDevices();
  const mics = devices.filter(d => d.kind === "audioinput");
  $("mic").innerHTML = "<option value=''>Phone default</option>" + mics.map(d => `<option value="${d.deviceId}">${d.label || "Microphone"}</option>`).join("");
}
function onBeat(t){ beats.push({ t }); if (beats.length > 80) beats.shift(); show(analyse(beats, locked)); if (!locked && last && last.bph) locked = last.bph; }
async function openMic(){
  const id = $("mic").value;
  const audio = id ? { deviceId:{ exact:id } } : true;
  return navigator.mediaDevices.getUserMedia({ audio });
}
$("start").onclick = async () => {
  $("hint").textContent = "Asking for the microphone…";
  $("stage").textContent = "Asking…";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $("hint").textContent = "This browser has no microphone. Use Chrome."; return; }
  try {
    stream = await openMic();
    await listMics();
    const track = stream.getAudioTracks()[0];
    ac = new AudioContext(); if (ac.state === "suspended") await ac.resume();
    const src = ac.createMediaStreamSource(stream);
    beats = []; trace = []; locked = Number($("bph").value) || 0;
    try {
      await ac.audioWorklet.addModule("js/tg-processor.js");
      node = new AudioWorkletNode(ac, "calibre-tick");
      node.port.onmessage = (e) => {
        if (!running) return;
        if (e.data.kind === "level") $("level").style.width = Math.min(100, e.data.pk * 400) + "%";
        if (e.data.kind === "beat") onBeat(e.data.t);
      };
      src.connect(node);
      const silent = ac.createGain(); silent.gain.value = 0;
      node.connect(silent); silent.connect(ac.destination);
    } catch {
      const proc = ac.createScriptProcessor(2048, 1, 1);
      proc.onaudioprocess = (ev) => {
        const ch = ev.inputBuffer.getChannelData(0);
        let pk = 0;
        for (let i = 0; i < ch.length; i++) { const a = Math.abs(ch[i]); if (a > pk) pk = a; }
        $("level").style.width = Math.min(100, pk * 400) + "%";
        if (pk > 0.08 && running) onBeat(ac.currentTime);
      };
      src.connect(proc); proc.connect(ac.destination);
    }
    running = true; $("start").disabled = true; $("stop").disabled = false;
    $("stage").textContent = "Listening...";
    $("hint").textContent = "Connected: " + (track.label || "microphone") + ". The bar should move.";
  } catch (err) {
    $("stage").textContent = "No microphone";
    $("hint").textContent = "Microphone failed: " + (err.name ? err.name + " — " : "") + (err.message || "permission blocked");
    if (stream) stream.getTracks().forEach(t => t.stop());
  }
};
$("stop").onclick = () => stop();
$("save").onclick = async () => {
  if (!last || !last.ready) { $("hint").textContent = "Not enough data to save."; return; }
  job.timingRuns = job.timingRuns || [];
  job.timingRuns.unshift({ ...last, phase:$("phase").value, position:"Dial up" });
  await saveState(state);
  $("hint").textContent = "Saved on this job as " + $("phase").value + ".";
};
state = await loadState(); job = current(state); $("watchTitle").textContent = job ? job.watchName : "Time";
drawTrace();
</script></body></html>
