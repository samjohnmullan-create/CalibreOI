<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calibre & Co.</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/app.css?v=12">
<style>
.start-top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:16px 0 12px}.start-top h2{margin:2px 0;font-size:1.55rem}.start-top p{margin:3px 0 0}.start-actions{display:flex;gap:8px;flex-wrap:wrap}.start-actions .btn{min-width:112px}.current-card{margin-bottom:12px}.current-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:10px}.current{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:start}.current img,.ph{width:112px;height:112px;object-fit:cover;border-radius:12px;background:var(--surface-2)}.ph{display:grid;place-items:center;color:var(--muted);font-size:.72rem}.current h2{margin:0 0 2px}.stage-pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:.72rem;color:var(--muted);background:var(--surface-2)}.kv2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;margin-top:10px;font-size:.78rem}.kv2 span{display:block;color:var(--muted);font-size:.68rem;margin-bottom:2px}.kv2 strong{display:block;min-width:0;overflow-wrap:anywhere}.current-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.current-actions .btn:first-child{flex:1 1 180px}.dash{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}.stat{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px;text-align:left;min-height:72px}.stat span{display:block;color:var(--muted);font-size:.68rem}.stat strong{display:block;margin-top:5px;font-size:1.2rem;font-variant-numeric:tabular-nums}.stat.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}.fin-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:12px}.fin-strip button{border:0;background:var(--surface);color:var(--ink);padding:11px;text-align:left}.fin-strip span{display:block;color:var(--muted);font-size:.66rem}.fin-strip strong{display:block;margin-top:3px;font-size:1rem}.start-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:12px;align-items:start}.search-card{margin-bottom:12px}.section-head-start{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.section-head-start h3{margin:0}.count{font-size:.72rem;color:var(--muted)}.job-card{grid-template-columns:58px minmax(0,1fr) auto}.job-card-actions{display:flex;align-items:center;gap:2px}.job-card .del{min-height:34px;padding:6px 9px;font-size:.72rem}.job-card-stage{display:block;margin-top:2px;color:var(--muted);font-size:.72rem}.side-stack{display:grid;gap:12px}.tools summary{cursor:pointer;font-weight:800}.tools-inner{padding-top:12px}.tools textarea{min-height:92px}.empty-home{text-align:center;padding:18px 8px}@media(max-width:900px){.start-grid{grid-template-columns:1fr}.side-stack{grid-template-columns:1fr 1fr}.dash{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.start-top{align-items:stretch;flex-direction:column}.start-actions .btn{flex:1}.current{grid-template-columns:88px minmax(0,1fr)}.current img,.ph{width:88px;height:88px}.kv2{grid-template-columns:1fr 1fr}.side-stack{grid-template-columns:1fr}.fin-strip{grid-template-columns:1fr 1fr}.fin-strip button:last-child{grid-column:1/-1}.job-card{grid-template-columns:52px minmax(0,1fr) auto}.job-card .del{display:none}}
</style></head><body>
<div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header><nav class="mainnav"></nav>
<div class="start-top"><div><div class="kicker">WORKBENCH HOME</div><h2>Your watches at a glance</h2><p class="muted small">Pick up where you left off or jump straight to a job.</p></div><div class="start-actions"><button id="newJob" class="btn" type="button">+ New job</button></div></div>
<section class="card current-card" id="currentCard"></section><div class="dash" id="dash"></div><div class="fin-strip" id="financeStrip"></div>
<section class="card search-card"><label>Find a watch<input id="q" autocomplete="off" enterkeyhint="search" placeholder="Brand, model, serial, calibre or part"></label><div id="found" class="jobs"></div></section>
<div class="start-grid"><section class="card"><div class="section-head-start"><h3 id="listTitle">All jobs</h3><span class="count" id="listCount"></span></div><div id="jobList" class="jobs"></div></section><div class="side-stack"><section class="card"><h3>Recently completed</h3><div id="doneList" class="jobs"></div></section><details class="card tools"><summary>Job card & backup tools</summary><div class="tools-inner"><div class="row"><button id="saveBackup" class="btn secondary" type="button">Save backup</button><button id="loadCard" class="btn secondary" type="button">Load job card</button></div><input id="jobFile" type="file" accept="application/json,text/plain,.json,.txt,.calibrejob,.calibrejobs,*/*" hidden><label style="margin-top:12px">Paste a job card<textarea id="pasteCard" rows="3" placeholder="Paste Calibre job-card JSON"></textarea></label><button id="pasteCardBtn" class="btn secondary" type="button">Add pasted card</button><p id="statusText" class="muted small"></p></div></details></div></div></div>
<script src="js/nav.js?v=50"></script><script type="module">
import { STAGES, loadState, saveState, blankJob, current, importCard, money, investment, escapeHtml, coverPhoto, normalise } from "./js/store.js?v=26";
import { STAGE_COPY } from "./js/stages.js?v=10";
import { fillResults } from "./js/search.js?v=7";
const $=id=>document.getElementById(id);let state={jobs:[],currentId:null},filter="all";try{state=await loadState();}catch(err){$("jobList").innerHTML="<p class='muted'>Jobs could not load. "+escapeHtml(err?.message||"")+"</p>";}if(!state||!Array.isArray(state.jobs))state={jobs:[],currentId:null};
const num=v=>Number(v)||0,held=j=>j.status!=="Sold"&&j.status!=="Spares",bench=j=>j.status==="On bench",waiting=j=>j.status==="Awaiting parts",ready=j=>["Ready for photos","Ready to list","Listed"].includes(j.status);
function stageName(j){const key=j.stages?.[j.stage]?.name||STAGES[j.stage]||STAGES[0];return STAGE_COPY[key]?.title||key||"Stage";}function jStage(j){return escapeHtml(String((Number(j.stage)||0)+1).padStart(2,"0")+" · "+stageName(j));}function stockValue(j){return num(j.business?.actualSale)||num(j.business?.targetSale)||investment(j.business||{});}function profit(j){const sale=num(j.business?.actualSale)||num(j.business?.targetSale);return sale?sale-investment(j.business||{}):0;}
function card(j){const src=coverPhoto(j);return `<a class="job-card" data-id="${escapeHtml(j.id)}" href="workbench.html">${src?`<img class="thumb" src="${src}" alt="">`:`<span class="thumb"></span>`}<div><strong>${escapeHtml(j.watchName||"Untitled")}</strong><div class="muted small">${escapeHtml(j.jobId||"")} · ${escapeHtml(j.status||"On bench")}</div><span class="job-card-stage">${jStage(j)}</span></div><div class="job-card-actions"><button class="star" data-id="${escapeHtml(j.id)}" type="button" aria-label="Priority">${j.priority?"★":"☆"}</button><button class="btn secondary del" data-id="${escapeHtml(j.id)}" type="button">Delete</button></div></a>`;}
async function openJob(id,href){state.currentId=id;await saveState(state);location.href=href;}function bind(root){root.querySelectorAll(".job-card").forEach(a=>a.onclick=e=>{if(e.target.closest(".star,.del"))return;e.preventDefault();openJob(a.dataset.id,"workbench.html");});root.querySelectorAll(".star").forEach(b=>b.onclick=async e=>{e.preventDefault();e.stopPropagation();const j=state.jobs.find(x=>x.id===b.dataset.id);if(!j)return;j.priority=!j.priority;await saveState(state);paint();});root.querySelectorAll(".del").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();removeJob(state.jobs.find(x=>x.id===b.dataset.id));});}
function paint(){const jobs=state.jobs||[],job=current(state),onBench=jobs.filter(bench),parts=jobs.filter(waiting),forSale=jobs.filter(ready),holding=jobs.filter(held),invested=holding.reduce((n,j)=>n+investment(j.business||{}),0),value=forSale.reduce((n,j)=>n+stockValue(j),0),projected=holding.reduce((n,j)=>n+profit(j),0);if(!job){$("currentCard").innerHTML=`<div class="empty-home"><div class="kicker">CURRENT WATCH</div><h2>No active watch yet</h2><p class="muted">Create a job or load a card to get started.</p><button id="newFromEmpty" class="btn" type="button">Create first job</button></div>`;$("newFromEmpty").onclick=()=>$("newJob").click();}else{const src=coverPhoto(job),p=job.passport||{},b=job.business||{};$("currentCard").innerHTML=`<div class="current-head"><div class="kicker">CURRENT WATCH</div><span class="stage-pill">${jStage(job)}</span></div><div class="current">${src?`<img src="${src}" alt="">`:`<div class="ph">No photo</div>`}<div><h2>${escapeHtml(job.watchName||"Untitled watch")}</h2><p class="muted small" style="margin:0">${escapeHtml(job.jobId||"")} · ${escapeHtml(job.status||"On bench")}</p><div class="kv2"><div><span>Maker</span><strong>${escapeHtml(p.maker||"—")}</strong></div><div><span>Model</span><strong>${escapeHtml(p.model||"—")}</strong></div><div><span>Calibre</span><strong>${escapeHtml(p.calibre||"—")}</strong></div><div><span>Purchase</span><strong>${b.purchasePrice?money(b.purchasePrice):"—"}</strong></div><div><span>Target sale</span><strong>${b.targetSale?money(b.targetSale):"—"}</strong></div><div><span>Open faults</span><strong>${(job.diagnosticFaults||[]).filter(f=>f.status!=="ruledout").length}</strong></div></div></div></div><div class="current-actions"><a class="btn" href="workbench.html">Continue this job</a><a class="btn secondary" href="timegrapher.html">Time it</a><a class="btn secondary" href="passport.html">Identity & photos</a></div>`;}
 const stats=[["all","All jobs",jobs.length],["bench","On bench",onBench.length],["parts","Awaiting parts",parts.length],["ready","Ready for sale",forSale.length]];$("dash").innerHTML=stats.map(([id,label,val])=>`<button class="stat${filter===id?" on":""}" data-f="${id}" type="button"><span>${label}</span><strong>${val}</strong></button>`).join("");$("financeStrip").innerHTML=[["value","Ready stock value",money(value)],["invested","Capital tied up",money(invested)],["profit","Projected profit",money(projected)]].map(([id,label,val])=>`<button data-f="${id}" type="button"><span>${label}</span><strong>${val}</strong></button>`).join("");document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;paint();});const ordered=jobs.slice().sort((a,b)=>(b.priority===true)-(a.priority===true)),listed=filter==="all"?ordered:filter==="parts"?parts:filter==="ready"||filter==="value"?forSale:filter==="profit"?holding.filter(j=>num(j.business?.targetSale)||num(j.business?.actualSale)):filter==="invested"?holding:onBench;const titles={all:"All jobs",bench:"On the bench",parts:"Awaiting parts",ready:"Ready for sale",value:"Ready for sale",invested:"Capital currently tied up",profit:"Jobs with a sale target"};$("listTitle").textContent=titles[filter]||"Jobs";$("listCount").textContent=listed.length+" shown";$("jobList").innerHTML=listed.map(card).join("")||"<p class='muted'>None in this group.</p>";bind($("jobList"));const done=jobs.filter(j=>["Sold","Ready to list","Listed"].includes(j.status)).sort((a,b)=>String(b.completedAt||b.updatedAt).localeCompare(String(a.completedAt||a.updatedAt))).slice(0,5);$("doneList").innerHTML=done.map(j=>`<a class="job-card" data-id="${escapeHtml(j.id)}" href="summary.html"><div><strong>${escapeHtml(j.watchName||"Untitled")}</strong><div class="muted small">${escapeHtml(j.status||"")}</div></div></a>`).join("")||"<p class='muted'>Nothing completed yet.</p>";$("doneList").querySelectorAll(".job-card").forEach(a=>a.onclick=e=>{e.preventDefault();openJob(a.dataset.id,"summary.html");});}
async function removeJob(j){if(!j||!confirm("Delete "+j.watchName+"? This stays deleted on this phone."))return;state.jobs=state.jobs.filter(x=>x.id!==j.id);if(state.currentId===j.id)state.currentId=state.jobs[0]?.id||null;await saveState(state);$("statusText").textContent=j.watchName+" deleted.";paint();}
$("newJob").onclick=async()=>{const n=blankJob({watchName:"Untitled watch"});state.jobs.unshift(n);state.currentId=n.id;await saveState(state);location.href="workbench.html";};
$("saveBackup").onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({type:"calibrejobs",version:4,savedAt:new Date().toISOString(),currentId:state.currentId,jobs:state.jobs},null,2)],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download="calibre-jobs.calibrejobs";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$("statusText").textContent="Backup saved.";};
function readCardText(text){const clean=String(text||"").replace(/^\uFEFF/,"").trim(),start=clean.indexOf("{"),end=clean.lastIndexOf("}");if(start<0||end<start)throw new Error("No JSON in that card");return JSON.parse(clean.slice(start,end+1));}
async function takeCard(data){if(data?.type==="calibrejobs"&&Array.isArray(data.jobs)){const byId=new Map(state.jobs.map(j=>[j.id,j]));data.jobs.forEach(j=>{const n=normalise(j);byId.set(n.id,n);});state.jobs=[...byId.values()];if(data.currentId&&state.jobs.some(j=>j.id===data.currentId))state.currentId=data.currentId;await saveState(state);paint();$("statusText").textContent=state.jobs.length+" jobs loaded.";return;}const n=importCard(data),existing=state.jobs.find(j=>n.pushId&&j.pushId===n.pushId);if(existing){state.currentId=existing.id;$("statusText").textContent="That job card is already on this phone. Opened the existing job.";await saveState(state);location.href="workbench.html";return;}state.jobs.unshift(n);state.currentId=n.id;await saveState(state);location.href="workbench.html";}
$("loadCard").onclick=()=>{$("jobFile").value="";$("jobFile").click();};$("jobFile").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{await takeCard(readCardText(await file.text()));}catch(err){$("statusText").textContent="That card could not be read. "+(err?.message||"");}e.target.value="";};$("pasteCardBtn").onclick=async()=>{try{await takeCard(readCardText($("pasteCard").value));}catch(err){$("statusText").textContent="That paste could not be read. "+(err?.message||"");}};
const cardSlug=new URLSearchParams(location.search).get("card");if(cardSlug){try{const res=await fetch("cards/"+encodeURIComponent(cardSlug)+".calibrejob",{cache:"no-store"});if(!res.ok)throw new Error("That card is not in the repo yet");await takeCard(readCardText(await res.text()));}catch(err){$("statusText").textContent="Link did not load the card. "+(err?.message||"");}}
function go(j){state.currentId=j.id;return saveState(state).then(()=>{location.href=j.status==="Spares"?"suppliers.html":["Sold","Ready to list","Listed"].includes(j.status)?"summary.html":"workbench.html";});}$("q").addEventListener("input",()=>fillResults($("found"),state.jobs,$("q").value,go));paint();
</script></body></html>
