<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jobs · Calibre & Co.</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/app.css">
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn active" href="index.html">Jobs</a><a class="navbtn" href="workbench.html">Workbench</a><a class="navbtn" href="timegrapher.html">Timegrapher</a><a class="navbtn" href="passport.html">Passport</a><a class="navbtn" href="business.html">Business</a></nav>
<div class="hero"><div><div class="kicker">SHOP</div><h2>Jobs on the bench</h2><p class="muted">A card link opens the job. The file has to be in cards/ first.</p></div></div>
<section class="card">
<div class="section-head"><h3>Current jobs</h3><button id="newJob" class="btn" type="button">New job</button></div>
<div id="jobList" class="jobs"></div>
<div class="row">
<label class="btn brass">Import job<input id="jobFile" type="file" accept=".calibrejob,application/json" hidden></label>
<button id="exportJob" class="btn secondary" type="button">Save open job</button>
<button id="copyLink" class="btn secondary" type="button">Copy import link</button>
</div>
<p id="statusText" class="muted small">Loading…</p>
<p id="linkLine" class="muted small"></p>
</section></div>
<script type="module">
import { loadState, saveState, blankJob, current, progress, escapeHtml, importCard, exportCard } from "./js/store.js";
const $ = id => document.getElementById(id);
let state = await loadState();
function paint(){
  const cur = current(state);
  $("jobList").innerHTML = state.jobs.map(j => `<a class="job-card" data-id="${j.id}" href="workbench.html"><div><strong>${escapeHtml(j.watchName)}</strong><div class="muted small">${escapeHtml(j.jobId)} · ${escapeHtml(j.passport.maker||"")} ${escapeHtml(j.passport.calibre||"")}</div><div class="muted small">${progress(j)}% · ${escapeHtml(j.status)}</div></div><div>${j.id===state.currentId?'<span class="badge">Open</span>':""}</div></a>`).join("");
  $("jobList").querySelectorAll(".job-card").forEach(a => a.onclick = async () => { state.currentId = a.dataset.id; await saveState(state); });
  const card = exportCard(cur);
  $("linkLine").textContent = card.importUrl;
  $("statusText").textContent = "Local";
}
paint();
$("newJob").onclick = async () => {
  const job = blankJob({ watchName: "Untitled watch" });
  state.jobs.unshift(job); state.currentId = job.id; await saveState(state); location.href = "workbench.html";
};
function download(name, data){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:"application/json" }));
  a.download = name; a.click();
}
$("exportJob").onclick = () => {
  const job = current(state);
  const card = exportCard(job);
  job.pushId = card.pushId;
  saveState(state);
  download(card.pushId+".calibrejob", card);
  $("statusText").textContent = "Saved. Put the file in cards/ before the link works.";
};
$("copyLink").onclick = async () => {
  const card = exportCard(current(state));
  try { await navigator.clipboard.writeText(card.importUrl); $("statusText").textContent = "Link copied."; }
  catch { $("statusText").textContent = card.importUrl; }
};
async function takeCard(raw){
  if (!raw || (raw.type && raw.type !== "calibrejob")){ $("statusText").textContent = "Not a calibre job card."; return; }
  const stamp = raw.pushId || raw.jobId || raw.watchName;
  if (stamp && state.jobs.some(j => j.pushId === stamp || j.jobId === raw.jobId)){ $("statusText").textContent = "Already on this phone."; return; }
  const job = importCard(raw);
  state.jobs.unshift(job); state.currentId = job.id;
  await saveState(state);
  if (stamp) localStorage.setItem("calibre-last-push", stamp);
  location.href = "workbench.html";
}
$("jobFile").onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try { await takeCard(JSON.parse(await file.text())); } catch { $("statusText").textContent = "That card could not be read."; }
};
async function pullInbox(){
  const named = new URLSearchParams(location.search).get("card");
  if (!named) return;
  try {
    const res = await fetch("cards/"+named+".calibrejob?t="+Date.now(), { cache:"no-store" });
    if (!res.ok){ $("statusText").textContent = "No card named "+named+"."; return; }
    const raw = await res.json();
    const stamp = raw.pushId || named;
    if (localStorage.getItem("calibre-last-push") === stamp){ $("statusText").textContent = "Already imported."; return; }
    await takeCard(raw);
  } catch { $("statusText").textContent = "Card link failed."; }
}
pullInbox();
</script></body></html>
