<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calibre & Co.</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/app.css?v=4">
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn active" href="index.html" aria-current="page">Start</a><a class="navbtn" href="workbench.html">Bench</a><a class="navbtn" href="timegrapher.html">Time</a><a class="navbtn" href="passport.html">Identity</a><a class="navbtn" href="business.html">Cost</a><a class="navbtn" href="summary.html">Sheet</a><a class="navbtn" href="inventory.html">Stock</a><a class="navbtn" href="suppliers.html">Parts</a></nav>
<div class="hero"><div><div class="kicker">OPEN WATCH</div><h2 id="watchTitle">Loading</h2><p id="watchMeta" class="muted"></p></div></div>
<section class="card">
<a class="btn" href="workbench.html">Continue on the bench</a>
<div class="row" style="margin-top:14px">
<a class="btn secondary" href="inventory.html">Stock <span id="stockCount"></span></a>
<a class="btn secondary" href="summary.html">Sheet</a>
</div>
</section>
<section class="card"><h3>Still open</h3><div id="jobList" class="jobs"></div>
<div class="row"><button id="newJob" class="btn secondary" type="button">New job</button><label class="btn secondary">Import<input id="jobFile" type="file" accept=".calibrejob,application/json" hidden></label></div>
<p id="statusText" class="muted small"></p></section>
<section class="card"><h3>Inventory</h3><p class="muted small">Finished watches and the ones that became parts.</p><div id="stockList" class="jobs"></div></section>
</div>
<script src="js/nav.js?v=4"></script>
<script type="module">
import { loadState, saveState, blankJob, current, importCard } from "./js/store.js";
const state = await loadState();
const job = current(state);
document.getElementById("watchTitle").textContent = job.watchName;
document.getElementById("watchMeta").textContent = [job.decision, job.passport.maker, job.passport.calibre].filter(Boolean).join(" · ") || "No decision yet";
const open = state.jobs.filter(j => j.status !== "complete" && j.status !== "sold" && j.status !== "spares");
const stock = state.jobs.filter(j => j.status === "complete" || j.status === "sold" || j.status === "spares");
document.getElementById("stockCount").textContent = stock.length ? "("+stock.length+")" : "";
document.getElementById("jobList").innerHTML = open.map(j => `<a class="job-card" data-id="${j.id}" href="workbench.html"><div><strong>${j.watchName}</strong><div class="muted small">${j.decision || "on the bench"}</div></div></a>`).join("") || "<p class='muted'>No open jobs.</p>";
document.getElementById("stockList").innerHTML = stock.map(j => `<a class="job-card" data-id="${j.id}" href="summary.html"><div><strong>${j.watchName}</strong><div class="muted small">${j.status === "spares" ? (j.writeOff || "Spares") : "Complete"}</div></div><div><span class="badge">${j.status}</span></div></a>`).join("") || "<p class='muted'>Nothing finished or written off yet.</p>";
document.querySelectorAll(".job-card").forEach(a => a.onclick = async () => { state.currentId = a.dataset.id; await saveState(state); });
document.getElementById("newJob").onclick = async () => { const n = blankJob({ watchName:"Untitled watch" }); state.jobs.unshift(n); state.currentId = n.id; await saveState(state); location.href = "workbench.html"; };
document.getElementById("jobFile").onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try { const n = importCard(JSON.parse(await file.text())); state.jobs.unshift(n); state.currentId = n.id; await saveState(state); location.href = "workbench.html"; }
  catch { document.getElementById("statusText").textContent = "That card could not be read."; }
};
</script></body></html>
