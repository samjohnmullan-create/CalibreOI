<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calibre & Co.</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/app.css?v=9">
<style>
.dash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left}
.stat span{display:block;color:var(--muted);font-size:.68rem;letter-spacing:.04em}
.stat strong{display:block;margin-top:4px;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat.on{box-shadow:inset 0 0 0 1.5px var(--brass)}
.current{display:grid;grid-template-columns:108px minmax(0,1fr);gap:12px;align-items:start}
.current img,.ph{width:108px;height:108px;object-fit:cover;border-radius:10px;background:#ece9e1}
.ph{display:grid;place-items:center;color:var(--muted);font-size:.72rem}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px;font-size:.78rem}
.kv2 span{color:var(--muted)}
@media(max-width:640px){.dash{grid-template-columns:1fr 1fr}.current{grid-template-columns:84px minmax(0,1fr)}.current img,.ph{width:84px;height:84px}}
</style>
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn active" href="index.html" aria-current="page">Start</a><a class="navbtn" href="workbench.html">Bench</a><a class="navbtn" href="timegrapher.html">Time</a><a class="navbtn" href="passport.html">Identity</a><a class="navbtn" href="business.html">Cost</a><a class="navbtn" href="summary.html">Sheet</a><a class="navbtn" href="inventory.html">Stock</a><a class="navbtn" href="suppliers.html">Parts</a></nav>
<section class="card" id="currentCard"></section>
<div class="dash" id="dash"></div>
<section class="card">
<label>Search<input id="q" autocomplete="off" enterkeyhint="search" placeholder="Serial, brand, part, calibre"></label>
<div id="found" class="jobs"></div>
</section>
<section class="card"><h3 id="listTitle">All jobs</h3><div id="jobList" class="jobs"></div>
<div class="row"><button id="newJob" class="btn secondary" type="button">New job</button><button id="saveDrive" class="btn secondary" type="button">Save to Drive</button><label class="btn secondary">Load from Drive<input id="jobFile" type="file" accept=".calibrejob,.calibrejobs,application/json" hidden></label></div>
<p id="statusText" class="muted small"></p></section>
<section class="card"><h3>Recently completed</h3><div id="doneList" class="jobs"></div></section>
</div>
<script src="js/nav.js?v=20"></script>
<script type="module">
import { STAGES, loadState, saveState, blankJob, current, importCard, money, investment, escapeHtml, coverPhoto, normalise } from "./js/store.js?v=22";
import { STAGE_COPY } from "./js/stages.js?v=9";
import { fillResults } from "./js/search.js?v=7";
const $ = id => document.getElementById(id);
let state = { jobs:[], currentId:null };
try { state = await loadState(); }
catch (err) { $("jobList").innerHTML = "<p class='muted'>Jobs could not load. " + escapeHtml(err && err.message || "") + "</p>"; }
if (!state || !Array.isArray(state.jobs)) state = { jobs:[], currentId:null };
let filter = "all";
const num = v => Number(v) || 0;
const held = j => j.status !== "Sold" && j.status !== "Spares";
const bench = j => j.status === "On bench";
const parts = j => j.status === "Awaiting parts";
const ready = j => j.status === "Ready to list" || j.status === "Listed" || j.status === "Ready for photos";
function card(j){
  const src = coverPhoto(j);
  return `<a class="job-card" data-id="${j.id}" href="workbench.html">${src ? `<img class="thumb" src="${src}" alt="">` : `<span class="thumb"></span>`}<div><strong>${escapeHtml(j.watchName || "Untitled")}</strong><div class="muted small">${escapeHtml(j.jobId || "")} · ${escapeHtml(j.status || "On bench")}</div></div><button class="star" data-id="${j.id}" type="button" aria-label="Priority">${j.priority ? "★" : "☆"}</button></a>`;
}
function stageName(j){
  const stages = j.stages || [];
  const key = (stages[j.stage] && stages[j.stage].name) || STAGES[j.stage] || STAGES[0];
  return (STAGE_COPY[key] && STAGE_COPY[key].title) || key || "Stage";
}
function stockValue(j){ return num(j.business.actualSale) || num(j.business.targetSale) || investment(j.business); }
function profit(j){
  const sale = num(j.business.targetSale) || num(j.business.actualSale);
  return sale ? sale - investment(j.business) : 0;
}
function openJob(id, href){
  state.currentId = id;
  return saveState(state).then(() => { location.href = href; });
}
function paint(){
  const jobs = state.jobs || [];
  const job = current(state);
  const ordered = jobs.slice().sort((a,b) => (b.priority===true) - (a.priority===true));
  $("jobList").innerHTML = ordered.map(card).join("") || "<p class='muted'>No jobs on this phone.</p>";
  $("listTitle").textContent = "All jobs · " + jobs.length;
  $("jobList").querySelectorAll(".job-card").forEach(a => a.onclick = e => { if (e.target.closest(".del")) return; e.preventDefault(); openJob(a.dataset.id, "workbench.html"); });
  $("jobList").querySelectorAll(".del").forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); removeJob(jobs.find(j => j.id === b.dataset.id)); });
  if (!job){
    $("currentCard").innerHTML = `<div class="kicker">CURRENT WATCH</div><p class="muted">No job on this phone.</p><button id="newFromEmpty" class="btn" type="button">New job</button>`;
    $("newFromEmpty").onclick = () => $("newJob").click();
    $("dash").innerHTML = "";
    $("doneList").innerHTML = "<p class='muted'>Nothing completed yet.</p>";
    return;
  }
  const onBench = jobs.filter(bench);
  const waiting = jobs.filter(parts);
  const forSale = jobs.filter(ready);
  const holding = jobs.filter(held);
  const invested = holding.reduce((n, j) => n + investment(j.business), 0);
  const value = forSale.reduce((n, j) => n + stockValue(j), 0);
  const projected = holding.reduce((n, j) => n + profit(j), 0);
  const src = photo(job);
  const p = job.passport, b = job.business;
  $("currentCard").innerHTML = `
    <div class="kicker">CURRENT WATCH</div>
    <div class="current">
      ${src ? `<img src="${src}" alt="">` : `<div class="ph">No photo</div>`}
      <div>
        <h2 style="margin:0">${escapeHtml(job.watchName)}</h2>
        <p class="muted small">${escapeHtml(job.jobId)} · ${escapeHtml(stageName(job))}</p>
        <div class="kv2">
          <div><span>Maker</span><strong>${escapeHtml(p.maker || "—")}</strong></div>
          <div><span>Model</span><strong>${escapeHtml(p.model || "—")}</strong></div>
          <div><span>Calibre</span><strong>${escapeHtml(p.calibre || "—")}</strong></div>
          <div><span>Purchase</span><strong>${b.purchasePrice ? money(b.purchasePrice) : "—"}</strong></div>
          <div><span>Target sale</span><strong>${b.targetSale ? money(b.targetSale) : "—"}</strong></div>
          <div><span>Stage</span><strong>${jStage(job)}</strong></div>
        </div>
      </div>
    </div>
    <div class="row">
      <label>Status<select id="watchStatus">${["Purchased","Awaiting inspection","On bench","Awaiting parts","Ready for photos","Ready to list","Listed","Sold","Spares"].map(s => `<option>${s}</option>`).join("")}</select></label>
      <a class="btn" href="workbench.html">Open on the bench</a>
      <a class="btn secondary" href="passport.html">Photos</a>
      <button id="deleteJob" class="btn secondary" type="button">Delete job</button>
    </div>`;
  $("watchStatus").value = job.status || "On bench";
  $("watchStatus").onchange = async () => { job.status = $("watchStatus").value; if (job.status === "Sold" || job.status === "Ready to list") job.completedAt = job.completedAt || new Date().toISOString(); await saveState(state); paint(); };
  $("deleteJob").onclick = () => removeJob(job);
  const cards = [
    ["all","All jobs", jobs.length],
    ["bench","On the bench", onBench.length],
    ["parts","Awaiting parts", waiting.length],
    ["ready","Ready for sale", forSale.length],
    ["value","Stock value", money(value)],
    ["invested","Capital tied up", money(invested)],
    ["profit","Projected profit", money(projected)]
  ];
  $("dash").innerHTML = cards.map(([id, label, value]) => `<button class="stat${filter===id?" on":""}" data-f="${id}" type="button"><span>${label}</span><strong>${value}</strong></button>`).join("");
  $("dash").querySelectorAll(".stat").forEach(b => b.onclick = () => { filter = b.dataset.f; paint(); $("jobList").scrollIntoView({block:"nearest"}); });
  const titles = { all:"All jobs", bench:"On the bench", parts:"Awaiting parts", ready:"Ready for sale", value:"Ready for sale", invested:"Money still in watches", profit:"With a target sale" };
  $("listTitle").textContent = titles[filter] || "Jobs";
  const listed = filter === "all" ? jobs : filter === "parts" ? waiting : filter === "ready" || filter === "value" ? forSale : filter === "profit" ? holding.filter(j => num(j.business.targetSale) || num(j.business.actualSale)) : filter === "invested" ? holding : onBench;
  $("jobList").innerHTML = listed.map(card).join("") || "<p class='muted'>None in this group.</p>";
  $("jobList").querySelectorAll(".job-card").forEach(a => a.onclick = e => { if (e.target.closest(".star") || e.target.closest(".del")) return; e.preventDefault(); openJob(a.dataset.id, "workbench.html"); });
  $("jobList").querySelectorAll(".star").forEach(b => b.onclick = async e => { e.preventDefault(); e.stopPropagation(); const hit = state.jobs.find(j => j.id === b.dataset.id); if (!hit) return; hit.priority = !hit.priority; await saveState(state); paint(); });
  const done = jobs.filter(j => j.status === "Sold" || j.status === "Ready to list" || j.status === "Listed").sort((a,b) => String(b.completedAt||b.updatedAt).localeCompare(String(a.completedAt||a.updatedAt))).slice(0, 5);
  $("doneList").innerHTML = done.map(j => `<a class="job-card" data-id="${j.id}" href="summary.html"><div><strong>${escapeHtml(j.watchName)}</strong><div class="muted small">${j.status}</div></div></a>`).join("") || "<p class='muted'>Nothing completed yet.</p>";
  $("doneList").querySelectorAll(".job-card").forEach(a => a.onclick = e => { e.preventDefault(); openJob(a.dataset.id, "summary.html"); });
}
function jStage(job){ return escapeHtml(String(job.stage + 1).padStart(2,"0") + " " + stageName(job)); }
async function removeJob(job){
  if (!job) return;
  if (!confirm("Delete " + job.watchName + "? This stays deleted on this phone.")) return;
  state.jobs = state.jobs.filter(j => j.id !== job.id);
  if (state.currentId === job.id) state.currentId = state.jobs[0] ? state.jobs[0].id : null;
  await saveState(state);
  $("statusText").textContent = job.watchName + " deleted.";
  paint();
}
paint();
$("newJob").onclick = async () => { const n = blankJob({ watchName:"Untitled watch" }); state.jobs.unshift(n); state.currentId = n.id; await saveState(state); location.href = "workbench.html"; };
$("saveDrive").onclick = () => {
  const blob = new Blob([JSON.stringify({ type:"calibrejobs", savedAt:new Date().toISOString(), currentId:state.currentId, jobs:state.jobs })], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "calibre-jobs.calibrejobs"; a.click();
  $("statusText").textContent = "File saved. Put calibre-jobs.calibrejobs in the Drive folder Calibre jobs.";
};
$("jobFile").onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data && data.type === "calibrejobs" && Array.isArray(data.jobs)) {
      const byId = new Map(state.jobs.map(j => [j.id, j]));
      data.jobs.forEach(j => byId.set(j.id, normalise(j)));
      state.jobs = [...byId.values()];
      if (data.currentId) state.currentId = data.currentId;
      await saveState(state); paint();
      $("statusText").textContent = state.jobs.length + " jobs loaded from Drive.";
    } else {
      const n = importCard(data); state.jobs.unshift(n); state.currentId = n.id; await saveState(state); location.href = "workbench.html";
    }
  }
  catch { $("statusText").textContent = "That card could not be read."; }
};
function go(job){
  state.currentId = job.id;
  return saveState(state).then(() => {
    location.href = job.status === "Spares" ? "suppliers.html" : (job.status === "Sold" || job.status === "Ready to list" || job.status === "Listed") ? "summary.html" : "workbench.html";
  });
}
$("q").addEventListener("input", () => fillResults($("found"), state.jobs, $("q").value, go));
</script></body></html>
