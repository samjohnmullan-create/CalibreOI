<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Media · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=13">
<style>
.media-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:10px}.media-head h2{margin:2px 0}.media-summary{display:flex;gap:8px;flex-wrap:wrap}.media-summary .badge{background:var(--surface)}.media-section{margin-top:12px}.media-section h3{margin:0 0 8px;text-transform:capitalize}.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}.asset{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;min-width:0}.asset-preview{aspect-ratio:1.2;background:var(--surface-2);display:grid;place-items:center;position:relative;overflow:hidden}.asset-preview img{width:100%;height:100%;object-fit:cover;display:block}.asset-preview .filetype{font-weight:800;color:var(--muted);letter-spacing:.08em}.asset-body{padding:9px}.asset-body strong{display:block;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.asset-meta{font-size:.66rem;color:var(--muted);margin-top:4px;line-height:1.4}.asset-actions{display:flex;gap:6px;margin-top:8px}.asset-actions .btn{flex:1;min-height:32px;padding:5px 7px;font-size:.69rem}.empty{padding:20px;text-align:center;color:var(--muted)}.loading{font-size:.68rem;color:var(--muted)}@media(max-width:640px){.media-head{display:block}.media-summary{margin-top:8px}.media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"></nav>
<div class="media-head"><div><div class="kicker">PRIVATE ARCHIVE</div><h2>Watch media</h2><p id="intro" class="muted small">Loading private media…</p></div><div id="summary" class="media-summary"></div></div>
<div id="gallery"></div>
<p id="statusText" class="muted small"></p>
</div>
<script src="js/nav.js?v=55"></script>
<script type="module">
import { loadState,current,escapeHtml } from "./js/store.js?v=26";
import { privateMediaObjectUrl,formatMediaSize } from "./js/media.js?v=2";
const $=id=>document.getElementById(id),urls=[];
const labels={original:"Original",identity:"Identity",movement:"Movement",workshop:"Workshop",documents:"Documents",sale:"Sale"};
function esc(s){return escapeHtml(s||"");}
function dateText(v){if(!v)return"";const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleString("en-AU",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function revoke(){while(urls.length)URL.revokeObjectURL(urls.pop());}
async function loadPreview(asset,node){
  if(!asset?.mimeType?.startsWith("image/")){node.innerHTML=`<span class="filetype">${asset?.mimeType==="application/pdf"?"PDF":"FILE"}</span>`;return;}
  node.innerHTML='<span class="loading">Loading…</span>';
  try{const url=await privateMediaObjectUrl(asset);urls.push(url);node.innerHTML="";const img=new Image();img.alt="";img.src=url;node.appendChild(img);}catch(e){node.innerHTML='<span class="loading">Unavailable</span>';node.title=e.message||String(e);}
}
async function openAsset(asset){
  $("statusText").textContent="Opening private media…";
  try{const url=await privateMediaObjectUrl(asset);urls.push(url);window.open(url,"_blank","noopener");$("statusText").textContent="";}catch(e){$("statusText").textContent=e.message||String(e);}
}
let state,job;
try{state=await loadState();job=current(state);}catch(e){$("statusText").textContent=e.message||"Could not load watch.";}
if(!job){$("gallery").innerHTML='<div class="card empty">No watch is open.</div>';$("intro").textContent="Choose a watch from Home or Collection.";}else{
  const assets=Array.isArray(job.mediaAssets)?job.mediaAssets.filter(a=>a&&a.storageKey):[];
  $("intro").textContent=`${job.watchName||"Current watch"} · ${job.jobId||""}`;
  const groups={};assets.forEach(a=>(groups[a.category]||(groups[a.category]=[])).push(a));
  $("summary").innerHTML=`<span class="badge">${assets.length} archived</span><span class="badge">${formatMediaSize(assets.reduce((n,a)=>n+(Number(a.bytes)||0),0))}</span>`;
  if(!assets.length){$("gallery").innerHTML='<div class="card empty">No private media has been archived for this watch yet.</div>';}
  else{
    for(const category of ["original","identity","movement","workshop","documents","sale"]){
      const list=groups[category]||[];if(!list.length)continue;
      const section=document.createElement("section");section.className="media-section card";section.innerHTML=`<h3>${labels[category]||category} · ${list.length}</h3><div class="media-grid"></div>`;
      const grid=section.querySelector(".media-grid");
      list.sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||""))).forEach(asset=>{
        const card=document.createElement("article");card.className="asset";card.innerHTML=`<div class="asset-preview"></div><div class="asset-body"><strong title="${esc(asset.originalName)}">${esc(asset.originalName||"Archived file")}</strong><div class="asset-meta">${esc(asset.stageId||"")}${asset.stageId?" · ":""}${formatMediaSize(asset.bytes)}<br>${esc(dateText(asset.createdAt))}</div><div class="asset-actions"><button class="btn secondary open" type="button">Open</button></div></div>`;
        card.querySelector(".open").onclick=()=>openAsset(asset);grid.appendChild(card);loadPreview(asset,card.querySelector(".asset-preview"));
      });
      $("gallery").appendChild(section);
    }
  }
}
window.addEventListener("beforeunload",revoke);
</script>
</body></html>
