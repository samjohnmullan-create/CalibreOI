<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capture · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=14">
<style>
.capture-shell{max-width:860px;margin:0 auto}.capture-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin:10px 0 12px}.capture-head h2{margin:2px 0;font-size:1.45rem}.capture-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.role-btn{min-height:58px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px;text-align:left;font-weight:800}.role-btn small{display:block;color:var(--muted);font-size:.66rem;margin-top:3px;font-weight:600}.role-btn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}.capture-file{display:grid;gap:9px}.preview{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;color:var(--muted)}.preview img{width:100%;height:100%;object-fit:contain}.big-btn{min-height:52px;font-size:.9rem}.status{margin-top:8px;min-height:20px}.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px;margin-top:8px}.recent img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--surface-2)}
@media(max-width:720px){.capture-grid{grid-template-columns:1fr}.capture-head{align-items:stretch;flex-direction:column}.role-grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="shell capture-shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Capture</h1></div></a></header><nav class="mainnav"></nav>
<div class="capture-head"><div><div class="kicker">BENCH CAPTURE</div><h2>Microscope & camera intake</h2><p class="muted small">Choose the Item and what the image shows. Calibre stores it against that record.</p></div><a class="btn secondary" href="calibre.html">Back to Calibre</a></div>
<div class="capture-grid"><section class="card"><h3>1. Target</h3><label>Item<select id="itemSelect"></select></label><label style="margin-top:9px">Work record<select id="workSelect"><option value="">Item only</option></select></label><h3 style="margin-top:14px">2. What are you capturing?</h3><div id="roles" class="role-grid"></div></section>
<section class="card"><h3>3. Import image</h3><div class="capture-file"><div id="preview" class="preview">No image selected</div><input id="fileInput" type="file" accept="image/*"><label>Evidence note<textarea id="note" rows="3" placeholder="Optional: what does this image prove or show?"></textarea></label><button id="saveBtn" class="btn big-btn" type="button" disabled>Save to Calibre</button><div id="status" class="status muted small"></div></div></section></div>
<section class="card" style="margin-top:12px"><div class="section-head"><div><div class="kicker">RECENT</div><h3 style="margin:2px 0">Captured on this Item</h3></div></div><div id="recent" class="recent"></div></section></div>
<script src="js/nav.js?v=62"></script><script type="module">
import {loadState,saveState} from './js/store.js?v=26';
import {allItems} from './js/item-model.js?v=4';
import {uploadMedia,privateMediaThumbnailObjectUrl} from './js/media.js?v=3';
import {CAPTURE_ROLES,captureRoleConfig,captureTargets,captureAttachment} from './js/capture-model.js?v=1';
const $=id=>document.getElementById(id);let state=await loadState(),selectedRole='movement',selectedFile=null,objectUrls=[];
state.items=Array.isArray(state.items)?state.items:[];state.workRecords=Array.isArray(state.workRecords)?state.workRecords:[];state.jobs=Array.isArray(state.jobs)?state.jobs:[];
const targets=()=>captureTargets(state,allItems);const currentJob=state.jobs.find(j=>j.id===state.currentId),preferredItemId=currentJob?.itemId||`item-${currentJob?.id||''}`;
function paintTargets(){const rows=targets();$('itemSelect').innerHTML=rows.length?rows.map(t=>`<option value="${t.id}">${t.title}</option>`).join(''):'<option value="">No Items available</option>';if(rows.some(t=>t.id===preferredItemId))$('itemSelect').value=preferredItemId;paintWorks();paintRecent();}
function paintWorks(){const t=targets().find(x=>x.id===$('itemSelect').value),works=t?.works||[];$('workSelect').innerHTML='<option value="">Item only</option>'+works.map(w=>`<option value="${w.id}">${w.title} · ${w.status}</option>`).join('');}
function paintRoles(){$('roles').innerHTML=CAPTURE_ROLES.map(([key,label,category])=>`<button type="button" class="role-btn${selectedRole===key?' on':''}" data-role="${key}">${label}<small>${category}</small></button>`).join('');$('roles').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{selectedRole=btn.dataset.role;paintRoles();});}
async function paintRecent(){objectUrls.forEach(u=>URL.revokeObjectURL(u));objectUrls=[];const item=allItems(state).find(i=>String(i.id)===String($('itemSelect').value)),assets=item?.mediaAssets||[];if(!assets.length){$('recent').innerHTML='<div class="muted small">No media yet.</div>';return;}$('recent').innerHTML='';for(const asset of assets.slice(-12).reverse()){try{const url=asset.thumbnailUrl||asset.url||await privateMediaThumbnailObjectUrl(asset);if(url&&url.startsWith('blob:'))objectUrls.push(url);const img=document.createElement('img');img.src=url;img.alt=asset.role||asset.category||'Media';$('recent').appendChild(img);}catch{}}
 if(!$('recent').children.length)$('recent').innerHTML='<div class="muted small">Media is recorded but thumbnails are unavailable on this device.</div>';}
$('itemSelect').onchange=()=>{paintWorks();paintRecent();};$('fileInput').onchange=()=>{selectedFile=$('fileInput').files?.[0]||null;$('saveBtn').disabled=!selectedFile;if(!selectedFile){$('preview').textContent='No image selected';return;}const url=URL.createObjectURL(selectedFile);objectUrls.push(url);$('preview').innerHTML=`<img src="${url}" alt="Selected capture">`;};
$('saveBtn').onclick=async()=>{if(!selectedFile||!$('itemSelect').value)return;const [role,,category]=captureRoleConfig(selectedRole);$('saveBtn').disabled=true;$('status').textContent='Uploading…';try{const itemId=$('itemSelect').value,workId=$('workSelect').value,item=allItems(state).find(i=>String(i.id)===String(itemId)),asset=await uploadMedia(selectedFile,{itemId,workId,jobId:item?.legacyJobId||'',role,category});asset.evidenceNote=$('note').value.trim();if(!captureAttachment({state,itemId,workId,asset,allItemsFn:allItems}))throw new Error('Could not attach media to this Item.');await saveState(state);$('status').textContent='Saved to Calibre.';$('note').value='';$('fileInput').value='';selectedFile=null;$('saveBtn').disabled=true;$('preview').textContent='No image selected';await paintRecent();}catch(err){$('status').textContent=err?.message||'Capture failed.';$('saveBtn').disabled=false;}};
paintTargets();paintRoles();
</script></body></html>
