<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stock · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=10">
<style>.incoming-row{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.incoming-row:last-child{border-bottom:0}.incoming-meta{display:flex;gap:8px;flex-wrap:wrap}.incoming-actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:720px){.incoming-row{grid-template-columns:1fr}.incoming-actions{justify-content:flex-start}}</style></head><body>
<div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header><nav class="mainnav"></nav><div class="hero"><div><div class="kicker">STOCK</div><h2>Inventory</h2><p id="capital" class="muted">Loading…</p></div></div>
<section class="card"><div class="row" style="justify-content:space-between;align-items:center"><div><h3>Incoming</h3><p class="muted small">Tools, parts, straps and consumables bought but not yet put away.</p></div><span id="incomingCount" class="badge">0</span></div><div id="incoming"></div><details><summary>Add manually</summary><div class="grid2" style="margin-top:12px"><label>Item<input id="newName" placeholder="Bergeon tool, strap, mainspring..."></label><label>Category<select id="newCategory"><option>Tool</option><option>Part</option><option>Strap</option><option>Consumable</option><option>Other</option></select></label><label>Source<input id="newSource" placeholder="AliExpress, eBay, Cousins UK"></label><label>Order / reference<input id="newOrder"></label><label>Quantity<input id="newQty" type="number" min="1" value="1"></label><label>Cost<input id="newAmount" inputmode="decimal" placeholder="0.00"></label><label>Status<select id="newStatus"><option>Ordered</option><option>Shipped</option><option>In transit</option><option>Delivered</option></select></label><label>Variant / size<input id="newVariant" placeholder="16 mm brown, 7033 Grey..."></label></div><button id="addIncoming" class="btn" type="button">Add incoming item</button></details><p id="incomingStatus" class="muted small"></p></section>
<div id="groups"></div></div>
<script src="js/nav.js?v=31"></script><script type="module">
import { loadState, saveState, money, cashOut, stockAge, STATUSES, coverPhoto, escapeHtml } from "./js/store.js?v=26";
const $=id=>document.getElementById(id),capital=$("capital"),groups=$("groups"),incomingBox=$("incoming");
try{
 const state=await loadState();state.incoming=Array.isArray(state.incoming)?state.incoming:[];
 const unsold=(state.jobs||[]).filter(j=>j.status!=="Sold"&&j.status!=="Spares"),tied=unsold.reduce((n,j)=>n+cashOut(j.business||{}),0);capital.textContent="You currently have "+money(tied)+" tied up in unsold watches.";
 function ageNote(j){if(j.status==="Sold")return "";const d=stockAge(j);if(d>=90)return " · 90+ days";if(d>=60)return " · 60+ days";if(d>=30)return " · 30+ days";return d?" · "+d+" days":"";}
 function row(j){const src=coverPhoto(j),id=escapeHtml(j.id||"");return `<a class="job-card" data-id="${id}" href="summary.html">${src?`<img class="thumb" src="${src}" alt="">`:`<span class="thumb"></span>`}<div><strong>${escapeHtml(j.watchName||"Untitled")}</strong><div class="muted small">${escapeHtml(j.jobId||"")} · ${escapeHtml(j.channel||"Not listed")}${escapeHtml(ageNote(j))}</div></div><div><span class="badge">${escapeHtml(j.status||"On bench")}</span></div></a>`;}
 function paintIncoming(){
   const list=[...state.incoming].sort((a,b)=>String(b.updatedAt||b.createdAt||"").localeCompare(String(a.updatedAt||a.createdAt||"")));
   $("incomingCount").textContent=String(list.length);
   incomingBox.innerHTML=list.length?list.map(p=>`<div class="incoming-row" data-id="${escapeHtml(p.id)}"><div><strong>${escapeHtml(p.itemName||"Incoming item")}</strong><div class="incoming-meta muted small"><span>${escapeHtml(p.category||"Other")}</span>${p.variant?`<span>· ${escapeHtml(p.variant)}</span>`:""}${p.source?`<span>· ${escapeHtml(p.source)}</span>`:""}${p.orderId?`<span>· Order ${escapeHtml(p.orderId)}</span>`:""}</div></div><div>${p.amount!==""&&p.amount!=null?`<strong>${money(p.amount)}</strong>`:"<span class='muted small'>Cost unknown</span>"}<div class="muted small">Qty ${Number(p.quantity)||1}</div></div><div><span class="badge">${escapeHtml(p.status||"Ordered")}</span>${p.tracking?`<div class="muted small">${escapeHtml(p.tracking)}</div>`:""}</div><div class="incoming-actions"><button class="btn secondary delivered" type="button">Delivered</button><button class="btn secondary remove" type="button">Remove</button></div></div>`).join(""):"<p class='muted'>Nothing incoming.</p>";
   incomingBox.querySelectorAll(".delivered").forEach(b=>b.onclick=async()=>{const p=state.incoming.find(x=>x.id===b.closest(".incoming-row").dataset.id);if(!p)return;p.status="Delivered";p.receivedAt=p.receivedAt||new Date().toISOString();p.updatedAt=new Date().toISOString();await saveState(state);paintIncoming();});
   incomingBox.querySelectorAll(".remove").forEach(b=>b.onclick=async()=>{const id=b.closest(".incoming-row").dataset.id;state.incoming=state.incoming.filter(x=>x.id!==id);await saveState(state);paintIncoming();});
 }
 function paintJobs(){const known=new Set(STATUSES),extra=[...new Set((state.jobs||[]).map(j=>j.status||"On bench").filter(s=>!known.has(s)))];groups.innerHTML=STATUSES.concat(extra).map(status=>{const list=(state.jobs||[]).filter(j=>(j.status||"On bench")===status);return list.length?`<section class="card"><h3>${escapeHtml(status)} <span class="muted">${list.length}</span></h3><div class="jobs">${list.map(row).join("")}</div></section>`:"";}).join("")||"<p class='muted'>No watches on this phone.</p>";document.querySelectorAll(".job-card").forEach(a=>a.onclick=async()=>{state.currentId=a.dataset.id;await saveState(state);});}
 $("addIncoming").onclick=async()=>{const name=$("newName").value.trim();if(!name){$("incomingStatus").textContent="Add an item name first.";return;}const now=new Date().toISOString();state.incoming.unshift({id:"buy-"+Math.random().toString(36).slice(2,9),sourceKey:"manual-"+Date.now(),itemName:name,category:$("newCategory").value,source:$("newSource").value.trim(),orderId:$("newOrder").value.trim(),quantity:Number($("newQty").value)||1,amount:$("newAmount").value.trim(),currency:"AUD",status:$("newStatus").value,variant:$("newVariant").value.trim(),createdAt:now,updatedAt:now});await saveState(state);$("newName").value="";$("newAmount").value="";$("incomingStatus").textContent="Saved.";paintIncoming();};
 paintIncoming();paintJobs();
}catch(err){capital.textContent="Stock could not load.";groups.innerHTML="<p class='muted'>"+escapeHtml(err?.message||"Unknown error")+"</p>";}
</script></body></html>
