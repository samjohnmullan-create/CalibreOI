<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inventory · Calibre & Co.</title><link rel="stylesheet" href="css/app.css">
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn" href="index.html">Jobs</a><a class="navbtn" href="workbench.html">Workbench</a><a class="navbtn" href="summary.html">Summary</a><a class="navbtn active" href="inventory.html">Inventory</a><a class="navbtn" href="business.html">Business</a></nav>
<div class="hero"><div><div class="kicker">FINISHED</div><h2>Inventory</h2><p class="muted">Watches marked complete. Open one to see the sheet.</p></div><div class="hero-stats"><div><span>Done</span><strong id="doneCount">0</strong></div></div></div>
<section class="card"><div id="list" class="jobs"></section>
</div>
<script type="module">
import { loadState, saveState, money, investment } from "./js/store.js";
const state = await loadState();
const done = state.jobs.filter(j => j.status === "complete" || j.status === "sold");
document.getElementById("doneCount").textContent = String(done.length);
document.getElementById("list").innerHTML = done.length ? done.map(j => {
  const b = j.business || {};
  const sale = Number(b.actualSale) || 0;
  const profit = sale ? sale - investment(b) : null;
  return `<a class="job-card" data-id="${j.id}" href="summary.html"><div><strong>${j.watchName}</strong><div class="muted small">${j.decision || "No decision"} · ${j.passport.maker || ""} ${j.passport.calibre || ""}</div><div class="muted small">${j.completedAt ? new Date(j.completedAt).toLocaleDateString() : ""} · ${sale ? money(sale) : "not sold"}${profit!=null ? " · "+money(profit) : ""}</div></div><div><span class="badge">${j.status}</span></div></a>`;
}).join("") : "<p class='muted'>Nothing complete yet. Finish a job, then mark it complete on the summary.</p>";
document.querySelectorAll(".job-card").forEach(a => a.onclick = async () => { state.currentId = a.dataset.id; await saveState(state); });
</script></body></html>
