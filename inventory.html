<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stock · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=12">
<style>.incoming-row{display:grid;grid-template-columns:minmax(0,1.5fr) .7fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.incoming-row:last-child{border-bottom:0}.incoming-meta{display:flex;gap:8px;flex-wrap:wrap}.incoming-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.incoming-status{min-width:150px}.incoming-extra{margin-top:5px}.incoming-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}@media(max-width:720px){.incoming-row{grid-template-columns:1fr}.incoming-actions{justify-content:flex-start}.incoming-status{width:100%}}</style></head><body>
<div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header><nav class="mainnav"></nav><div class="hero"><div><div class="kicker">STOCK</div><h2>Inventory</h2><p id="capital" class="muted">Loading…</p></div></div>
<section class="card"><div class="row" style="justify-content:space-between;align-items:center"><div><h3>Incoming</h3><p class="muted small">Watches, tools, parts, straps and consumables that have been bought and are still on the way or waiting to be put away.</p><div id="incomingSummary" class="incoming-summary"></div></div><span id="incomingCount" class="badge">0</span></div><div id="incoming"></div><details><summary>Add manually</summary><div class="grid2" style="margin-top:12px"><label>Item<input id="newName" placeholder="Bergeon tool, strap, mainspring..."></label><label>Category<select id="newCategory"><option>Tool</option><option>Part</option><option>Watch</option><option>Strap</option><option>Consumable</option><option>Other</option></select></label><label>Source<input id="newSource" placeholder="AliExpress, eBay, Cousins UK"></label><label>Order / reference<input id="newOrder"></label><label>Quantity<input id="newQty" type="number" min="1" value="1"></label><label>Cost<input id="newAmount" inputmode="decimal" placeholder="0.00"></label><label>Status<select id="newStatus"><option>Ordered</option><option>Awaiting dispatch</option><option>Collected by carrier</option><option>Shipped</option><option>In transit</option><option>Out for delivery</option><option>Delivered</option><option>Cancelled / closed</option></select></label><label>Variant / size<input id="newVariant" placeholder="16 mm brown, 7033 Grey..."></label><label>Tracking<input id="newTracking" placeholder="Tracking or package number"></label><label>ETA<input id="newEta" type="date"></label></div><button id="addIncoming" class="btn" type="button">Add incoming item</button></details><p id="incomingStatus" class="muted small"></p></section>
<div id="groups"></div></div>
<script src="js/nav.js?v=51"></script><script type="module">
import { loadState, saveState, money, cashOut, stockAge, STATUSES, coverPhoto, escapeHtml } from "./js/store.js?v=26";
const $=id=>document.getElementById(id),capital=$("capital"),groups=$("groups"),incomingBox=$("incoming");
const INCOMING_STATUSES=["Ordered","Awaiting dispatch","Collected by carrier","Shipped","In transit","Out for delivery","Delivered","Cancelled / closed"];
try{
 const state=await loadState();state.incoming=Array.isArray(state.incoming)?state.incoming:[];
 const unsold=(state.jobs||[]).filter(j=>j.status!=="Sold"&&j.status!=="Spares"),tied=unsold.reduce((n,j)=>n+cashOut(j.business||{}),0);capital.textContent="You currently have "+money(tied)+" tied up in unsold watches.";
 function ageNote(j){if(j.status==="Sold")return "";const d=stockAge(j);if(d>=90)return " · 90+ days";if(d>=60)return " · 60+ days";if(d>=30)return " · 30+ days";return d?" · "+d+" days":"";}
 function row(j){const src=coverPhoto(j),id=escapeHtml(j.id||"");return `<a class="job-card" data-id="${id}" href="summary.html">${src?`<img class="thumb" src="${src}" alt="">`:`<span class="thumb"></span>`}<div><strong>${escapeHtml(j.watchName||"Untitled")}</strong><div class="muted small">${escapeHtml(j.jobId||"")} · ${escapeHtml(j.channel||"Not listed")}${escapeHtml(ageNote(j))}</div></div><div><span class="badge">${escapeHtml(j.status||"On bench")}</span></div></a>`;}
 function statusOptions(current){const all=INCOMING_STATUSES.includes(current)?INCOMING_STATUSES:[current,...INCOMING_STATUSES];return all.map(s=>`<option${s===current?" selected":""}>${escapeHtml(s)}</option>`).join("");}
 function paintIncoming(){
   const list=[...state.incoming].sort((a,b)=>String(b.updatedAt||b.createdAt||"").localeCompare(String(a.updatedAt||a.createdAt||"")));
   $("incomingCount").textContent=String(list.length);
   const active=list.filter(p=>!["Delivered","Cancelled / closed"].includes(p.status));
   const delivered=list.filter(p=>p.status==="Delivered").length;
   const byType={};active.forEach(p=>{const k=p.category||"Other";byType[k]=(byType[k]||0)+1;});
   $("incomingSummary").innerHTML=[`<span class="badge">${active.length} active</span>`,delivered?`<span class="badge">${delivered} delivered</span>`:"",...Object.entries(byType).map(([k,v])=>`<span class="badge">${escapeHtml(k)} ${v}</span>`)].filter(Boolean).join("");
   incomingBox.innerHTML=list.length?list.map(p=>`<div class="incoming-row" data-id="${escapeHtml(p.id)}"><div><strong>${escapeHtml(p.itemName||"Incoming item")}</strong><div class="incoming-meta muted small"><span>${escapeHtml(p.category||"Other")}</span>${p.variant?`<span>· ${escapeHtml(p.variant)}</span>`:""}${p.source?`<span>· ${escapeHtml(p.source)}</span>`:""}${p.orderId?`<span>· Order ${escapeHtml(p.orderId)}</span>`:""}</div>${(p.tracking||p.eta)?`<div class="incoming-extra muted small">${p.tracking?`Tracking: ${escapeHtml(p.tracking)}`:""}${p.tracking&&p.eta?" · ":""}${p.eta?`ETA: ${escapeHtml(p.eta)}`:""}</div>`:""}</div><div>${p.amount!==""&&p.amount!=null?`<strong>${money(p.amount)}</strong>`:"<span class='muted small'>Cost unknown</span>"}<div class="muted small">Qty ${Number(p.quantity)||1}</div></div><div><select class="incoming-status" aria-label="Incoming status">${statusOptions(p.status||"Ordered")}</select></div><div class="incoming-actions"><button class="btn secondary edit" type="button">Edit</button><button class="btn secondary remove" type="button">Remove</button></div></div>`).join(""):"<p class='muted'>Nothing incoming.</p>";
   incomingBox.querySelectorAll(".incoming-status").forEach(sel=>sel.onchange=async()=>{const p=state.incoming.find(x=>x.id===sel.closest(".incoming-row").dataset.id);if(!p)return;p.status=sel.value;if(sel.value==="Delivered")p.receivedAt=p.receivedAt||new Date().toISOString();p.updatedAt=new Date().toISOString();await saveState(state);paintIncoming();});
   incomingBox.querySelectorAll(".edit").forEach(b=>b.onclick=async()=>{const p=state.incoming.find(x=>x.id===b.closest(".incoming-row").dataset.id);if(!p)return;const tracking=prompt("Tracking / package number",p.tracking||"");if(tracking===null)return;const eta=prompt("ETA (YYYY-MM-DD)",p.eta||"");if(eta===null)return;p.tracking=tracking.trim();p.eta=eta.trim();p.updatedAt=new Date().toISOString();await saveState(state);paintIncoming();});
   incomingBox.querySelectorAll(".remove").forEach(b=>b.onclick=async()=>{const id=b.closest(".incoming-row").dataset.id;state.incoming=state.incoming.filter(x=>x.id!==id);await saveState(state);paintIncoming();});
 }
 function paintJobs(){const known=new Set(STATUSES),extra=[...new Set((state.jobs||[]).map(j=>j.status||"On bench").filter(s=>!known.has(s)))];groups.innerHTML=STATUSES.concat(extra).map(status=>{const list=(state.jobs||[]).filter(j=>(j.status||"On bench")===status);return list.length?`<section class="card"><h3>${escapeHtml(status)} <span class="muted">${list.length}</span></h3><div class="jobs">${list.map(row).join("")}</div></section>`:"";}).join("")||"<p class='muted'>No watches on this phone.</p>";document.querySelectorAll(".job-card").forEach(a=>a.onclick=async()=>{state.currentId=a.dataset.id;await saveState(state);});}
 $("addIncoming").onclick=async()=>{const name=$("newName").value.trim();if(!name){$("incomingStatus").textContent="Add an item name first.";return;}const now=new Date().toISOString();state.incoming.unshift({id:"buy-"+Math.random().toString(36).slice(2,9),sourceKey:"manual-"+Date.now(),itemName:name,category:$("newCategory").value,source:$("newSource").value.trim(),orderId:$("newOrder").value.trim(),quantity:Number($("newQty").value)||1,amount:$("newAmount").value.trim(),currency:"AUD",status:$("newStatus").value,variant:$("newVariant").value.trim(),tracking:$("newTracking").value.trim(),eta:$("newEta").value,createdAt:now,updatedAt:now});await saveState(state);$("newName").value="";$("newAmount").value="";$("newTracking").value="";$("newEta").value="";$("incomingStatus").textContent="Saved.";paintIncoming();};
 paintIncoming();paintJobs();
}catch(err){capital.textContent="Stock could not load.";groups.innerHTML="<p class='muted'>"+escapeHtml(err?.message||"Unknown error")+"</p>";}
</script></body></html>
