<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bench Capture · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=14">
<style>
.capture-shell{max-width:760px;margin:0 auto;padding-bottom:28px}.capture-head{margin:10px 0 12px}.capture-head h2{margin:2px 0 4px;font-size:1.45rem}.capture-card{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:14px}.target{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.target div{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}.label{font-size:.61rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--muted);display:block;margin-bottom:3px}.preview{min-height:340px;aspect-ratio:4/3;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;color:var(--muted);text-align:center;padding:14px}.preview img{width:100%;height:100%;object-fit:contain}.role-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}.role-grid button{min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.68rem}.role-grid button.on{border-color:var(--accent);background:var(--surface-2);font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.actions .btn{min-height:46px}.status{min-height:20px;margin-top:8px;font-size:.69rem;color:var(--muted)}input[type=file]{display:none}
@media(max-width:600px){.target{grid-template-columns:1fr}.role-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.preview{min-height:260px;aspect-ratio:1}.actions{grid-template-columns:1fr}}
</style></head><body><div class="shell capture-shell">
<header class="brandbar"><a class="brand" id="backBrand" href="workbench.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Bench Capture</h1></div></a></header><nav class="mainnav"></nav>
<div class="capture-head"><div class="kicker">WORK EVIDENCE</div><h2>Quick bench photo</h2><p class="muted small">Take a photo or choose one from the gallery. It will stay attached to this Item and Work.</p></div>
<section class="capture-card"><div class="target"><div><span class="label">Item</span><strong id="itemName">Loading…</strong></div><div><span class="label">Work</span><strong id="workName">—</strong></div></div>
<div id="preview" class="preview">No image selected</div>
<div id="roles" class="role-grid"></div>
<label>Evidence note<textarea id="note" rows="3" placeholder="Optional: what does this photo prove or show?"></textarea></label>
<div class="actions"><button id="cameraBtn" class="btn" type="button">📷 Take photo</button><button id="galleryBtn" class="btn secondary" type="button">Choose from gallery</button><button id="saveBtn" class="btn" type="button" disabled>Save evidence</button><a id="backBtn" class="btn secondary" href="workbench.html">Back to Bench</a></div>
<input id="cameraInput" type="file" accept="image/*" capture="environment"><input id="galleryInput" type="file" accept="image/*"><div id="status" class="status"></div></section></div>
<script src="js/nav.js?v=63"></script><script type="module">
import {loadStructuredBenchDetail} from './js/structured-cloud.js?v=4';
import {uploadMedia} from './js/media.js?v=4';
import {recordStructuredMediaAsset} from './js/structured-media.js?v=1';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),workId=params.get('work')||params.get('id')||'';let detail=null,file=null,role=params.get('role')||'progress',previewUrl='';
const roles=[['progress','Progress'],['movement','Movement'],['fault','Fault'],['part','Part']];
function status(text){$('status').textContent=text||'';}
function paintRoles(){$('roles').innerHTML=roles.map(([key,label])=>`<button type="button" data-role="${key}" class="${role===key?'on':''}">${label}</button>`).join('');$('roles').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{role=btn.dataset.role;paintRoles();});}
function choose(next){file=next||null;$('saveBtn').disabled=!file;if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl='';}if(!file){$('preview').textContent='No image selected';return;}previewUrl=URL.createObjectURL(file);$('preview').innerHTML=`<img src="${previewUrl}" alt="Selected bench evidence">`;status(`${file.name} · ${Math.round(file.size/1024)} KB`);}
$('cameraBtn').onclick=()=>$('cameraInput').click();$('galleryBtn').onclick=()=>$('galleryInput').click();$('cameraInput').onchange=()=>choose($('cameraInput').files?.[0]);$('galleryInput').onchange=()=>choose($('galleryInput').files?.[0]);
$('saveBtn').onclick=async()=>{if(!file||!detail)return;$('saveBtn').disabled=true;status('Saving evidence…');try{const category=role==='movement'?'movement':'workshop',asset=await uploadMedia(file,{itemId:detail.item.id,workId,stageId:detail.currentStep?.id||'',role,category});await recordStructuredMediaAsset(asset,{itemId:detail.item.id,workId,checklistStepId:detail.currentStep?.id||'',note:$('note').value||''});status('Saved to this Work.');setTimeout(()=>{location.href=`bench.html?work=${encodeURIComponent(workId)}`;},350);}catch(err){status(err?.message||'Photo could not be saved.');$('saveBtn').disabled=false;}};
if(!workId){$('itemName').textContent='No Work selected';$('workName').textContent='Open from Bench Mode';$('cameraBtn').disabled=true;$('galleryBtn').disabled=true;}else{try{detail=await loadStructuredBenchDetail(workId);$('itemName').textContent=detail.item?.title||'Item';$('workName').textContent=detail.work?.title||'Work';const back=`bench.html?work=${encodeURIComponent(workId)}`;$('backBtn').href=back;$('backBrand').href=back;}catch(err){$('itemName').textContent='Could not load Work';$('workName').textContent=err?.message||'Unknown error';$('cameraBtn').disabled=true;$('galleryBtn').disabled=true;}}paintRoles();
</script></body></html>
