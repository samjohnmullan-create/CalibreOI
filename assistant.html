<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Brief · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=12"></head><body>
<div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header><nav class="mainnav"></nav><div class="hero"><div><div class="kicker">BRIEF</div><h2 id="watchTitle">Job brief</h2><p class="muted">Copy this into ChatGPT when you want a listing, service summary, valuation or research follow-up.</p></div></div><section class="card"><pre id="brief" class="small" style="white-space:pre-wrap"></pre><div class="row"><button id="copyBrief" class="btn" type="button">Copy job brief</button></div><p id="err" class="muted small"></p></section></div>
<script src="js/nav.js?v=53"></script><script type="module">
import { loadState, current, exportCard } from "./js/store.js?v=26";
const $=id=>document.getElementById(id),state=await loadState(),job=current(state);
function buildBrief(j){return ["Calibre watch job",`Watch: ${j.watchName||"Untitled"}`,`Job ID: ${j.jobId||""}`,"",JSON.stringify(exportCard(j),null,2)].join("\n");}
if(!job){$("watchTitle").textContent="No watch open";$("brief").textContent="Pick a watch on Home first.";$("copyBrief").disabled=true;}else{const text=buildBrief(job);$("watchTitle").textContent=job.watchName;$("brief").textContent=text;$("copyBrief").onclick=async()=>{try{await navigator.clipboard.writeText(text);$("err").textContent="Brief copied.";}catch{$("err").textContent="Copy failed. Select the brief text and copy it manually.";}};}
</script></body></html>
