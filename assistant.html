<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brief · Calibre & Co.</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <header class="brandbar">
    <a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a>
    <div class="watch-pill"><span class="dot"></span><div><small>Current watch</small><strong id="headerWatch">—</strong></div></div>
  </header>
  <nav class="mainnav">
    <a class="navbtn" href="index.html">Jobs</a>
    <a class="navbtn" href="workbench.html">Workbench</a>
    <a class="navbtn" href="timegrapher.html">Timegrapher</a>
    <a class="navbtn" href="passport.html">Passport</a>
    <a class="navbtn" href="business.html">Business</a>
    <a class="navbtn active" href="assistant.html">Brief</a>
  </nav>
  <div class="hero"><div><div class="kicker">BRIEF</div><h2 id="watchTitle">Job brief</h2><p class="muted">Copy this into the account chat. There is no model call in the app.</p></div></div>
  <section class="card">
    <pre id="brief" class="small"></pre>
    <div class="row"><button id="copyBrief" class="btn brass" type="button">Copy job brief</button></div>
    <p id="err" class="muted small"></p>
  </section>
</div>
<script type="module">
import { loadState, current, jobBrief } from "./js/store.js";
const $ = id => document.getElementById(id);
const state = await loadState();
const job = current(state);
$("headerWatch").textContent = job.watchName;
$("watchTitle").textContent = job.watchName;
$("brief").textContent = jobBrief(job);
$("copyBrief").onclick = async () => {
  await navigator.clipboard.writeText(jobBrief(job));
  $("err").textContent = "Brief copied.";
};
</script>
</body>
</html>
