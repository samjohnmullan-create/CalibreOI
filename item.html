<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Item · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=12">
<style>
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.item-head h2{margin:2px 0 4px}.item-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}.item-card h3{margin:0 0 10px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field-grid .wide{grid-column:1/-1}.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.item-note{margin-top:8px}.danger-link{margin-left:auto}.section-rule{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}@media(max-width:760px){.item-grid,.field-grid{grid-template-columns:1fr}.field-grid .wide{grid-column:auto}.danger-link{margin-left:0}}
</style></head><body><div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Item record</h1></div></a></header><nav class="mainnav"></nav>
<div class="item-head"><div><div class="kicker">ITEM</div><h2 id="title">Item</h2><p class="muted small" id="subtitle">Loading…</p></div><a class="btn secondary" href="inventory.html">Back to Items</a></div>
<div class="item-grid"><section class="card item-card"><h3>Identity & condition</h3><div class="field-grid"><label>Type<select id="type"></select></label><label>Status<select id="status"></select></label><label class="wide">Item title<input id="itemTitle"></label><label>Maker / brand<input id="maker"></label><label>Model<input id="model"></label><label>Era<input id="era" placeholder="e.g. Art Deco, c.1950s"></label><label>Year<input id="year"></label><label>Materials<input id="materials" placeholder="Sterling silver, enamel, leather..."></label><label>Marks / hallmarks<input id="marks"></label><label>Reference<input id="reference"></label><label>Serial<input id="serial"></label><label>Dimensions<input id="dimensions"></label><label>Weight<input id="weight"></label><label class="wide">Condition<textarea id="condition" rows="4"></textarea></label><label class="wide">Research / notes<textarea id="notes" rows="5"></textarea></label></div></section>
<section class="card item-card"><h3>Commercial</h3><div class="field-grid"><label>Purchase price<input id="purchasePrice" inputmode="decimal"></label><label>Buyer premium<input id="buyerPremium" inputmode="decimal"></label><label>Postage<input id="postage" inputmode="decimal"></label><label>Preparation cost<input id="preparationCost" inputmode="decimal"></label><label>Repair cost<input id="repairCost" inputmode="decimal"></label><label>Parts cost<input id="partsCost" inputmode="decimal"></label><label>Other cost<input id="otherCost" inputmode="decimal"></label><label>Marketplace fees<input id="marketplaceFees" inputmode="decimal"></label><label>Target sale<input id="targetSale" inputmode="decimal"></label><label>Minimum sale<input id="minSale" inputmode="decimal"></label><label>Actual sale<input id="actualSale" inputmode="decimal"></label><label>Sale channel<input id="saleChannel"></label><label>Source<input id="source"></label><label>Acquired date<input id="acquiredAt" type="date"></label></div><div class="section-rule"><div class="business-metrics"><div><span>Invested</span><strong id="invested">$0.00</strong></div><div><span>Projected profit</span><strong id="projected">$0.00</strong></div><div><span>ROI</span><strong id="roi">—</strong></div></div></div></section></div>
<div class="item-actions"><button class="btn" id="save" type="button">Save item</button><span class="muted small item-note" id="msg"></span><button class="btn secondary danger-link" id="remove" type="button">Remove item</button></div></div>
<script src="js/nav.js?v=54"></script><script type="module">
import {loadState,saveState,money} from "./js/store.js?v=26";
import {ITEM_TYPES,ITEM_STATUSES,normaliseItem,itemDisplayName} from "./js/item-model.js?v=1";
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),itemId=params.get("id")||"";let state=await loadState();state.items=Array.isArray(state.items)?state.items:[];let index=state.items.findIndex(x=>String(x.id)===String(itemId));
if(index<0){$("title").textContent="Item not found";$("subtitle").textContent="This item record is not available.";$("save").disabled=true;$("remove").disabled=true;throw new Error("Item not found");}
let item=normaliseItem(state.items[index]);state.items[index]=item;$("type").innerHTML=ITEM_TYPES.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");$("status").innerHTML=ITEM_STATUSES.map(x=>`<option>${x}</option>`).join("");
const map={itemTitle:["title"],type:["type"],status:["status"],maker:["identity","maker"],model:["identity","model"],era:["identity","era"],year:["identity","year"],materials:["identity","materials"],marks:["identity","marks"],reference:["identity","reference"],serial:["identity","serial"],dimensions:["identity","dimensions"],weight:["identity","weight"],condition:["condition"],notes:["notes"],purchasePrice:["commercial","purchasePrice"],buyerPremium:["commercial","buyerPremium"],postage:["commercial","postage"],preparationCost:["commercial","preparationCost"],repairCost:["commercial","repairCost"],partsCost:["commercial","partsCost"],otherCost:["commercial","otherCost"],marketplaceFees:["commercial","marketplaceFees"],targetSale:["commercial","targetSale"],minSale:["commercial","minSale"],actualSale:["commercial","actualSale"],saleChannel:["commercial","saleChannel"],source:["commercial","source"],acquiredAt:["commercial","acquiredAt"]};
function get(path){return path.reduce((v,k)=>v?.[k],item)??""}function set(path,v){let o=item;for(let i=0;i<path.length-1;i++)o=o[path[i]]||(o[path[i]]={});o[path[path.length-1]]=v}
function total(){const c=item.commercial||{},keys=["purchasePrice","buyerPremium","postage","preparationCost","repairCost","partsCost","consumables","externalService","marketplaceFees","shippingToBuyer","otherCost"],invested=keys.reduce((n,k)=>n+(Number(c[k])||0),0),sale=Number(c.actualSale)||Number(c.targetSale)||0,profit=sale-invested;$("invested").textContent=money(invested);$("projected").textContent=money(profit);$("roi").textContent=invested&&sale?Math.round(profit/invested*100)+"%":"—"}
function paint(){Object.entries(map).forEach(([id,path])=>{$(id).value=get(path)});$("title").textContent=itemDisplayName(item);$("subtitle").textContent=`${ITEM_TYPES.find(([k])=>k===item.type)?.[1]||"Item"} · ${item.status}`;total()}
Object.entries(map).forEach(([id,path])=>{$(id).addEventListener("input",()=>{set(path,$(id).value);if(id==="itemTitle")$("title").textContent=$(id).value||"Untitled item";total()})});
$("save").onclick=async()=>{item.updatedAt=new Date().toISOString();state.items[index]=normaliseItem(item);await saveState(state);item=state.items[index];$("msg").textContent="Saved.";paint()};
$("remove").onclick=async()=>{if(!confirm(`Remove ${itemDisplayName(item)} from Items?`))return;state.items.splice(index,1);await saveState(state);location.href="inventory.html"};paint();
</script></body></html>
