<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Workshop IDs · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=12"><style>.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.asset{border:1px solid var(--line);border-radius:12px;padding:12px}.asset h3{margin:0 0 5px}.asset-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}@media(max-width:680px){.asset-grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div></a></header><nav class="mainnav"></nav><div class="hero"><div><div class="kicker">WORKSHOP IDS</div><h2>Trays, tools & loose parts</h2><p class="muted">Give physical workshop assets a stable Calibre ID and QR target.</p></div></div><section class="card"><div class="field-grid"><label>Type<select id="type"><option value="tray">Tray / drawer</option><option value="tool">Tool</option><option value="part">Loose part</option></select></label><label>Name<input id="name" placeholder="Balance staff tray, staking set..."></label><label>Location<input id="location" placeholder="Drawer 4 / Bench shelf"></label><label>Calibre / family<input id="calibre"></label><label>Part name<input id="partName"></label><label>Quantity<input id="quantity" inputmode="numeric"></label><label class="wide">Notes<textarea id="notes" rows="3"></textarea></label></div><button class="btn" id="add" type="button">Create workshop ID</button><span class="muted small" id="msg"></span></section><section class="card"><div class="row" style="justify-content:space-between"><h3>Registered assets</h3><a class="btn secondary" href="qr-scan.html">Scan</a></div><div class="asset-grid" id="list"></div></section></div><script src="js/nav.js?v=55"></script><script type="module">import{loadState,saveState,escapeHtml}from'./js/store.js?v=26';import{workshopAssets,upsertWorkshopAsset,assetById}from'./js/workshop-assets.js?v=1';import{qrEntityCode,qrPayloadForEntity}from'./js/qr-inventory.js?v=1';const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let state=await loadState();state.workshopAssets=Array.isArray(state.workshopAssets)?state.workshopAssets:[];const selected=params.get('id')||'';function paint(){const rows=workshopAssets(state),box=$('list');box.innerHTML=rows.length?'':'<p class="muted">No workshop IDs yet.</p>';for(const a of rows){const el=document.createElement('article');el.className='asset';el.id='asset-'+a.id;const target=qrPayloadForEntity(a.type,a.id,{origin:location.origin+location.pathname.replace(/[^/]*$/,'').replace(/\/$/,'')});el.innerHTML=`<div class="kicker">${escapeHtml(a.type.toUpperCase())}</div><h3>${escapeHtml(a.name)}</h3><div class="muted small">${escapeHtml(a.id)}${a.location?' · '+escapeHtml(a.location):''}${a.calibre?' · Cal. '+escapeHtml(a.calibre):''}</div>${a.partName?`<p class="small">${escapeHtml(a.partName)}${a.quantity?' · Qty '+a.quantity:''}</p>`:''}<div class="asset-actions"><button class="btn secondary copy" type="button">Copy QR target</button></div>`;el.querySelector('.copy').onclick=async()=>{try{await navigator.clipboard.writeText(target);$('msg').textContent=`Copied ${a.name}.`;}catch{$('msg').textContent=qrEntityCode(a.type,a.id);}};box.appendChild(el);}if(selected)document.getElementById('asset-'+selected)?.scrollIntoView({block:'center'});} $('add').onclick=async()=>{const asset=upsertWorkshopAsset(state,{type:$('type').value,name:$('name').value,location:$('location').value,calibre:$('calibre').value,partName:$('partName').value,quantity:$('quantity').value,notes:$('notes').value});await saveState(state);$('msg').textContent=`Created ${asset.id}.`;['name','location','calibre','partName','quantity','notes'].forEach(id=>$(id).value='');paint();};paint();</script></body></html>
