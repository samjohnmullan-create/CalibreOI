<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parts & Donors · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=14">
<style>
.pf-shell{max-width:980px;margin:0 auto}.pf-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:8px 0 12px}.pf-head h2{margin:2px 0 3px}.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pf-card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px}.pf-label{font-size:.62rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.055em;margin-bottom:4px}.pf-list{display:grid;gap:7px;margin-top:8px}.pf-row{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}.pf-row strong{display:block;font-size:.78rem}.pf-row small{display:block;color:var(--muted);font-size:.64rem;margin-top:3px}.pf-score{display:inline-block;margin-top:6px;border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-size:.61rem}.pf-score.strong{border-color:var(--accent);color:var(--accent)}.pf-score.possible{border-color:#b48a42;color:#b48a42}.pf-note{font-size:.68rem;color:var(--muted);line-height:1.45;margin-top:6px}.pf-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pf-actions button{min-height:36px}.pf-form{display:grid;gap:8px}.pf-status{min-height:20px;color:var(--muted);font-size:.68rem}.pf-empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:.7rem}
@media(max-width:760px){.pf-head{display:block}.pf-grid{grid-template-columns:1fr}.pf-head .btn{margin-top:8px;width:100%}}
</style></head><body><div class="shell pf-shell">
<header class="brandbar"><a class="brand" id="back" href="workbench.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Parts & Donors</h1></div></a></header><nav class="mainnav"></nav>
<div class="pf-head"><div><div class="kicker">BENCH CONTEXT</div><h2 id="itemTitle">Loading…</h2><p id="workTitle" class="muted"></p></div><a id="benchLink" class="btn secondary" href="workbench.html">Back to Bench</a></div>
<div class="pf-grid">
<div>
<section class="pf-card"><div class="pf-label">Part need</div><div id="needs" class="pf-list"></div><div class="section-rule"><div class="pf-form"><label>Part needed<input id="partType" placeholder="e.g. stem, balance staff, crystal"></label><label>Details<textarea id="description" rows="3" placeholder="Measurements, markings, thread, dimensions, notes…"></textarea></label><div class="pf-actions"><button id="createBtn" class="btn" type="button">Create need</button><button id="waitBtn" class="btn secondary" type="button">Create + mark waiting</button></div><div id="status" class="pf-status"></div></div></div></section>
<section class="pf-card" style="margin-top:10px"><div class="pf-label">Loose stock</div><div id="stock" class="pf-list"></div></section>
</div>
<div>
<section class="pf-card"><div class="pf-label">Donor candidates</div><p class="pf-note">Calibre only ranks evidence it actually has. Exact calibre/family matches are strongest; maker-only matches are leads, not proof of interchangeability.</p><div id="donors" class="pf-list"></div></section>
<section class="pf-card" style="margin-top:10px"><div class="pf-label">Recorded movement context</div><div id="context" class="pf-list"></div></section>
</div></div></div>
<script src="js/nav.js?v=63"></script><script type="module">
import {loadStructuredPartFinder,createStructuredPartNeed,updateStructuredPartNeed} from './js/structured-parts.js?v=1';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),workId=params.get('work')||params.get('id')||'';let detail=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=t=>$('status').textContent=t||'';
function scoreClass(c){return ['strong','possible'].includes(c)?c:'';}
function paint(){const d=detail,item=d.item||{},work=d.work||{},p=d.passport||{},i=d.identity||{};$('itemTitle').textContent=item.title||'Item';$('workTitle').textContent=work.title||'Work';$('benchLink').href=`bench.html?work=${encodeURIComponent(workId)}`;$('back').href=$('benchLink').href;
$('needs').innerHTML=(d.needs||[]).length?(d.needs||[]).map(n=>`<div class="pf-row"><strong>${esc(n.part_type||'Part')}</strong><small>${esc(n.description||'No extra detail')} · ${esc(n.status||'open')}</small>${!['fulfilled','cancelled'].includes(String(n.status||''))?`<div class="pf-actions"><button class="btn secondary" data-need="${esc(n.id)}" data-status="reserved" type="button">Reserved</button><button class="btn secondary" data-need="${esc(n.id)}" data-status="fulfilled" type="button">Fulfilled</button><button class="btn secondary" data-need="${esc(n.id)}" data-status="cancelled" type="button">Cancel</button></div>`:''}</div>`).join(''):'<div class="pf-empty">No Part Need is recorded for this Work yet.</div>';
$('needs').querySelectorAll('[data-need]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;try{await updateStructuredPartNeed(btn.dataset.need,btn.dataset.status);await refresh();status(`Part Need marked ${btn.dataset.status}.`);}catch(err){status(err?.message||'Could not update Part Need.');}finally{btn.disabled=false;}});
$('stock').innerHTML=(d.looseParts||[]).length?d.looseParts.map(x=>`<div class="pf-row"><strong>${esc(x.description||x.part_type||'Part')}</strong><small>${esc([x.manufacturer,x.reference,x.condition].filter(Boolean).join(' · '))}${x.quantity!=null?` · qty ${esc(x.quantity)}`:''}</small><span class="pf-score ${scoreClass(x.confidence)}">${esc(x.confidence)} · ${esc(x.score)}%</span><div class="pf-note">${esc((x.reasons||[]).join(' · ')||'No direct compatibility evidence yet.')}</div></div>`).join(''):'<div class="pf-empty">No loose Part stock is available.</div>';
$('donors').innerHTML=(d.donorCandidates||[]).length?d.donorCandidates.map(x=>`<div class="pf-row"><strong>${esc(x.title||'Candidate')}</strong><small>${x.purpose==='donor'?'Donor Item':'Item lead'}${x.passport?.calibre?` · calibre ${esc(x.passport.calibre)}`:''}</small><span class="pf-score ${scoreClass(x.confidence)}">${esc(x.confidence)} · ${esc(x.score)}%</span><div class="pf-note">${esc((x.reasons||[]).join(' · '))}</div></div>`).join(''):'<div class="pf-empty">No evidence-backed donor candidates yet. This is expected until more Passports have calibre/family data or Items are explicitly classified as donors.</div>';
const ctx=[['Watch maker',i.maker],['Movement maker',p.movement_maker],['Calibre',p.calibre],['Calibre family',p.calibre_family],['Movement diameter',p.movement_diameter_mm?`${p.movement_diameter_mm} mm`:'']].filter(([,v])=>v);$('context').innerHTML=ctx.length?ctx.map(([k,v])=>`<div class="pf-row"><strong>${esc(k)}</strong><small>${esc(v)}</small></div>`).join(''):'<div class="pf-empty">No movement identity is recorded yet. Donor ranking will remain conservative.</div>';}
async function refresh(){detail=await loadStructuredPartFinder(workId);paint();}
async function create(markWaiting){const partType=$('partType').value.trim(),description=$('description').value.trim();if(!partType){status('Enter the part you need.');return;}$('createBtn').disabled=$('waitBtn').disabled=true;try{await createStructuredPartNeed(workId,detail.item.id,{partType,description,markWaiting});$('partType').value='';$('description').value='';await refresh();status(markWaiting?'Part Need created and Work marked waiting on parts.':'Part Need created.');}catch(err){status(err?.message||'Could not create Part Need.');}finally{$('createBtn').disabled=$('waitBtn').disabled=false;}}
$('createBtn').onclick=()=>create(false);$('waitBtn').onclick=()=>create(true);
if(!workId){$('itemTitle').textContent='No Work selected';$('workTitle').textContent='Open this from Bench Mode.';$('createBtn').disabled=$('waitBtn').disabled=true;}else{try{await refresh();}catch(err){$('itemTitle').textContent='Parts Finder could not load';$('workTitle').textContent=err?.message||'Unknown error';}}
</script></body></html>
