<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cost · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=4">
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn" href="index.html">Start</a><a class="navbtn" href="workbench.html">Bench</a><a class="navbtn" href="timegrapher.html">Time</a><a class="navbtn" href="passport.html">Identity</a><a class="navbtn active" href="business.html" aria-current="page">Cost</a><a class="navbtn" href="summary.html">Sheet</a><a class="navbtn" href="inventory.html">Stock</a><a class="navbtn" href="suppliers.html">Parts</a></nav>
<div class="hero"><div><div class="kicker">THIS WATCH</div><h2 id="watchTitle">Cost and sale</h2></div></div>
<section class="card">
<div class="grid2">
<label>Purchase price (AUD)<input id="purchasePrice" type="number" step="0.01"></label>
<label>Parts (AUD)<input id="partsCost" type="number" step="0.01"></label>
<label>Labour minutes<input id="labourMinutes" type="number" step="1"></label>
<label>Labour rate (AUD/hour)<input id="labourRate" type="number" step="0.01"></label>
<label>Other costs (AUD)<input id="otherCost" type="number" step="0.01"></label>
<label>Target sale (AUD)<input id="targetSale" type="number" step="0.01"></label>
<label>Actual sale (AUD)<input id="actualSale" type="number" step="0.01"></label>
</div>
<div class="business-metrics">
<div><span>Labour</span><strong id="labourVal">$0.00</strong></div>
<div><span>Total investment</span><strong id="investVal">$0.00</strong></div>
<div><span>Profit</span><strong id="profitVal">$0.00</strong></div>
<div><span>Margin</span><strong id="marginVal">0%</strong></div>
</div>
<p id="statusText" class="muted small">Loading…</p>
</section></div>
<script src="js/nav.js?v=6"></script>
<script type="module">
import { loadState, saveState, current, money, labourCost, investment } from "./js/store.js";
const $ = id => document.getElementById(id);
const keys = ["purchasePrice","partsCost","labourMinutes","labourRate","otherCost","targetSale","actualSale"];
let state = await loadState();
let job = current(state);
let timer;
function figure(){
  keys.forEach(k => job.business[k] = $(k).value);
  const labour = labourCost(job.business), total = investment(job.business);
  const sale = Number(job.business.actualSale) || Number(job.business.targetSale) || 0;
  const profit = sale - total;
  $("labourVal").textContent = money(labour); $("investVal").textContent = money(total);
  $("profitVal").textContent = money(profit); $("marginVal").textContent = sale ? Math.round(profit / sale * 100)+"%" : "0%";
}
function paint(){ job = current(state); $("watchTitle").textContent = job.watchName; keys.forEach(k => $(k).value = job.business[k] || ""); figure(); $("statusText").textContent = "Ready"; }
keys.forEach(k => $(k).addEventListener("input", () => { figure(); clearTimeout(timer); timer = setTimeout(async () => { await saveState(state); $("statusText").textContent = "Saved"; }, 400); }));
paint();
</script></body></html>
