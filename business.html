<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cost · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=12"></head><body>
<div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header><nav class="mainnav"></nav><div class="hero"><div><div class="kicker">THIS WATCH</div><h2 id="watchTitle">Cost and sale</h2></div><a class="btn" href="sales.html" style="text-decoration:none">Open Sale workspace</a></div>
<section class="card"><div class="grid2">
<label>Purchase price<input id="purchasePrice" type="number" step="0.01"></label><label>Buyer premium<input id="buyerPremium" type="number" step="0.01"></label><label>Postage in<input id="postage" type="number" step="0.01"></label><label>Strap<input id="strapCost" type="number" step="0.01"></label><label>Battery<input id="batteryCost" type="number" step="0.01"></label><label>Parts fitted<input id="partsCost" type="number" step="0.01"></label><label>Consumables used<input id="consumables" type="number" step="0.01"></label><label>External service<input id="externalService" type="number" step="0.01"></label><label>Marketplace fees<input id="marketplaceFees" type="number" step="0.01"></label><label>Shipping to buyer<input id="shippingToBuyer" type="number" step="0.01"></label><label>Other direct cost<input id="otherCost" type="number" step="0.01"></label><label>Labour minutes<input id="labourMinutes" type="number" step="1"></label><label>Labour rate / hour<input id="labourRate" type="number" step="0.01"></label><label>Minimum / quick sale<input id="minSale" type="number" step="0.01"></label><label>Expected / target sale<input id="targetSale" type="number" step="0.01"></label><label>Optimistic sale<input id="optimisticSale" type="number" step="0.01"></label><label>Desired cash profit<input id="desiredProfit" type="number" step="0.01" placeholder="Used for max-buy calculation"></label><label>Sales channel<select id="channel"><option>Not listed</option><option>eBay</option><option>Facebook Marketplace</option><option>Etsy</option><option>Instagram</option><option>Shopify</option><option>Auction</option><option>Private sale</option><option>Other</option></select></label><label>Actual sale<input id="actualSale" type="number" step="0.01"></label><label>Sale date<input id="soldDate" type="date"></label>
</div>
<div class="business-metrics"><div><span>Cash out</span><strong id="investVal">$0.00</strong></div><div><span>Expected cash profit</span><strong id="cashVal">$0.00</strong></div><div><span>After labour</span><strong id="profitVal">$0.00</strong></div><div><span>ROI</span><strong id="roiVal">0%</strong></div><div><span>Profit / hour</span><strong id="hourVal">—</strong></div><div><span>Maximum buy price</span><strong id="maxBuyVal">—</strong></div></div>
<div class="grid2" id="scenarioGrid"></div>
<h3>Offers</h3><div id="offers"></div><p id="warn" class="muted small"></p><p id="statusText" class="muted small">Loading…</p></section></div>
<script src="js/nav.js?v=53"></script><script type="module">
import { loadState, saveState, current, money, cashOut, cashProfit, profitAfterLabour, roi, salePrice, escapeHtml, labourCost } from "./js/store.js?v=26";
const $=id=>document.getElementById(id),keys=["purchasePrice","buyerPremium","postage","strapCost","batteryCost","partsCost","consumables","externalService","marketplaceFees","shippingToBuyer","otherCost","labourMinutes","labourRate","minSale","targetSale","optimisticSale","desiredProfit","actualSale","soldDate"];let state=await loadState(),job=current(state),timer;
const n=v=>Number(v)||0;
function nonPurchaseCosts(b){return ["buyerPremium","postage","strapCost","batteryCost","partsCost","consumables","externalService","marketplaceFees","shippingToBuyer","otherCost"].reduce((s,k)=>s+n(b[k]),0);}
function scenario(b,sale){const direct=n(b.purchasePrice)+nonPurchaseCosts(b),cash=n(sale)-direct,after=cash-labourCost(b);return {cash,after,roi:direct?cash/direct:0};}
function figure(){if(!job)return;keys.forEach(k=>job.business[k]=$(k).value);const b=job.business,sale=salePrice(b),hours=n(b.labourMinutes)/60,expected=scenario(b,n(b.targetSale)),quick=scenario(b,n(b.minSale)),optimistic=scenario(b,n(b.optimisticSale));$("investVal").textContent=money(cashOut(b));$("cashVal").textContent=money(cashProfit(b));$("profitVal").textContent=money(profitAfterLabour(b));$("roiVal").textContent=Math.round(roi(b)*100)+"%";$("hourVal").textContent=hours?money(expected.after/hours)+"/hr":"—";const desired=n(b.desiredProfit),maxBuy=n(b.targetSale)?Math.max(0,n(b.targetSale)-nonPurchaseCosts(b)-desired):0;$("maxBuyVal").textContent=n(b.targetSale)?money(maxBuy):"—";const card=(name,value,s)=>`<div class="line"><span><strong>${name}</strong><br><span class="muted small">Sale ${value?money(value):"—"} · ROI ${value?Math.round(s.roi*100)+"%":"—"}</span></span><strong>${value?money(s.cash):"—"}</strong></div>`;$("scenarioGrid").innerHTML=card("Quick sale",n(b.minSale),quick)+card("Expected sale",n(b.targetSale),expected)+card("Optimistic sale",n(b.optimisticSale),optimistic);const min=n(b.minSale);$("warn").textContent=min&&sale&&sale<min?"This price is under the minimum sale. It eats the margin.":"Cash profit ignores your time. After labour includes it. Maximum buy price uses expected sale minus known non-purchase costs and your desired cash profit.";}
function paintOffers(){const rows=(job.offers||[]).map((o,i)=>`<div class="row"><strong>${money(o.amount)}</strong><span class="muted small">${escapeHtml(o.note||"")}</span><button class="btn secondary ox" data-i="${i}" type="button">Remove</button></div>`).join("");$("offers").innerHTML=rows+`<div class="row"><input id="offerAmt" inputmode="decimal" placeholder="Offer"><input id="offerNote" placeholder="Who"><button id="addOffer" class="btn secondary" type="button">Add offer</button></div>`;$("offers").querySelectorAll(".ox").forEach(b=>b.onclick=async()=>{job.offers.splice(Number(b.dataset.i),1);await saveState(state);paintOffers();});$("addOffer").onclick=async()=>{const amount=$("offerAmt").value;if(!amount)return;job.offers.push({amount,note:$("offerNote").value,at:new Date().toISOString()});await saveState(state);paintOffers();};}
function paint(){job=current(state);if(!job){$("watchTitle").textContent="No watch open";$("statusText").textContent="Pick a watch on Home.";return;}$("watchTitle").textContent=job.watchName;keys.forEach(k=>$(k).value=job.business[k]||"");$("channel").value=job.channel||"Not listed";paintOffers();figure();$("statusText").textContent="Ready";}
$("channel").onchange=async()=>{if(!job)return;job.channel=$("channel").value;await saveState(state);$("statusText").textContent="Saved";};keys.forEach(k=>$(k).addEventListener("input",()=>{figure();clearTimeout(timer);timer=setTimeout(async()=>{await saveState(state);$("statusText").textContent="Saved";},400);}));paint();
</script></body></html>
