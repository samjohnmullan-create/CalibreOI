<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Business · Calibre & Co.</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
  <nav class="mainnav"><a class="navbtn" href="index.html">Jobs</a><a class="navbtn" href="workbench.html">Workbench</a><a class="navbtn" href="timegrapher.html">Timegrapher</a><a class="navbtn" href="passport.html">Passport</a><a class="navbtn active" href="business.html">Business</a></nav>
  <div class="hero"><div><div class="kicker">BUSINESS</div><h2 id="watchTitle">Cost and listing</h2><p class="muted">Numbers stay on this phone. Write the listing yourself.</p></div></div>
  <section class="card">
    <div class="grid2">
      <label>Purchase price (AUD)<input id="purchasePrice" type="number" step="0.01"></label>
      <label>Parts / consumables (AUD)<input id="repairCost" type="number" step="0.01"></label>
      <label>Other costs (AUD)<input id="otherCost" type="number" step="0.01"></label>
      <label>Expected sale (AUD)<input id="salePrice" type="number" step="0.01"></label>
    </div>
    <div class="business-metrics"><div><span>Total cost</span><strong id="totalCost">$0.00</strong></div><div><span>Gross profit</span><strong id="grossProfit">$0.00</strong></div><div><span>Margin</span><strong id="marginPct">0%</strong></div></div>
    <label>Headline<input id="listingTitle"></label>
    <label>Description<textarea id="listingText" rows="6"></textarea></label>
    <p id="statusText" class="muted small">Ready</p>
  </section>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var state, job, timer;
  function money(n){ var v = Number(n); return Number.isFinite(v) ? v.toLocaleString("en-AU", { style:"currency", currency:"AUD" }) : "$0.00"; }
  function openDB(){ return new Promise(function(res, rej){ var r = indexedDB.open("calibre-co-v1", 1); r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); }; r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
  function readState(){ return openDB().then(function(db){ return new Promise(function(res, rej){ var g = db.transaction("kv").objectStore("kv").get("state"); g.onsuccess = function(){ res(g.result); }; g.onerror = function(){ rej(g.error); }; }); }); }
  function writeState(){ return openDB().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(state, "state"); tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); }; }); }); }
  function current(){ return state.jobs.filter(function(j){ return j.id === state.currentId; })[0] || state.jobs[0]; }
  function num(id){ var n = Number($(id).value); return Number.isFinite(n) ? n : 0; }
  function capture(){
    job.business = { purchasePrice:$("purchasePrice").value, repairCost:$("repairCost").value, otherCost:$("otherCost").value, salePrice:$("salePrice").value, title:$("listingTitle").value, text:$("listingText").value };
    var cost = num("purchasePrice") + num("repairCost") + num("otherCost");
    var profit = num("salePrice") - cost;
    $("totalCost").textContent = money(cost);
    $("grossProfit").textContent = money(profit);
    $("marginPct").textContent = num("salePrice") ? Math.round(profit / num("salePrice") * 100) + "%" : "0%";
  }
  function paint(){
    job = current(); job.business = job.business || {};
    $("watchTitle").textContent = job.watchName || "Cost and listing";
    ["purchasePrice","repairCost","otherCost","salePrice"].forEach(function(k){ $(k).value = job.business[k] || ""; });
    $("listingTitle").value = job.business.title || "";
    $("listingText").value = job.business.text || "";
    capture();
  }
  document.querySelectorAll("input,textarea").forEach(function(el){ el.addEventListener("input", function(){ capture(); clearTimeout(timer); timer = setTimeout(function(){ writeState().then(function(){ $("statusText").textContent = "Saved"; }); }, 400); }); });
  readState().then(function(saved){ state = saved; if (!state || !state.jobs) return; paint(); });
})();
</script>
</body>
</html>
