<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Costs · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=14"><style>
.cost-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.cost-head h2{margin:2px 0}.cost-actions{display:flex;gap:6px;flex-wrap:wrap}.cost-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:12px}.cost-card{padding:14px}.cost-card h3{margin:2px 0 10px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}.metric span{display:block;color:var(--muted);font-size:.63rem}.metric strong{display:block;margin-top:3px;font-size:1rem}.threshold{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.threshold:last-child{border-bottom:0}@media(max-width:760px){.cost-grid,.fields{grid-template-columns:1fr}.cost-head{align-items:start;flex-direction:column}.cost-actions{width:100%}.cost-actions .btn{flex:1}}
</style></head><body><div class="shell"><header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Costs & value</h1></div></a></header><nav class="mainnav"></nav>
<section class="cost-head"><div><div class="kicker">ITEM · COMMERCE</div><h2 id="itemTitle">Opening Item…</h2><p id="itemMeta" class="muted small"></p></div><div class="cost-actions"><a class="btn secondary" id="openItem" href="inventory.html">Item</a><a class="btn" id="openSale" href="sales.html">Sale workspace</a></div></section>
<div class="cost-grid"><main><section class="card cost-card"><h3>Direct costs</h3><div class="fields"><label>Purchase price<input id="purchasePrice" type="number" step="0.01"></label><label>Buyer premium<input id="buyerPremium" type="number" step="0.01"></label><label>Postage in<input id="postage" type="number" step="0.01"></label><label>Preparation cost<input id="preparationCost" type="number" step="0.01"></label><label>Repair cost<input id="repairCost" type="number" step="0.01"></label><label>Parts cost<input id="partsCost" type="number" step="0.01"></label><label>Consumables<input id="consumables" type="number" step="0.01"></label><label>External work<input id="externalService" type="number" step="0.01"></label><label>Other direct cost<input id="otherCost" type="number" step="0.01"></label><label>Marketplace fees<input id="marketplaceFees" type="number" step="0.01"></label><label>Shipping to buyer<input id="shippingToBuyer" type="number" step="0.01"></label></div></section>
<section class="card cost-card"><h3>Labour & valuation</h3><div class="fields"><label>Labour minutes<input id="labourMinutes" type="number" step="1"></label><label>Labour value / hour<input id="labourRate" type="number" step="0.01"></label><label>Minimum / quick sale<input id="minSale" type="number" step="0.01"></label><label>Expected / target sale<input id="targetSale" type="number" step="0.01"></label><label>Optimistic sale<input id="optimisticSale" type="number" step="0.01"></label><label>Actual sale<input id="actualSale" type="number" step="0.01"></label><label>Source<input id="source"></label><label>Acquired<input id="acquiredAt" type="date"></label></div><p id="saveMsg" class="muted small">Ready</p></section></main>
<aside><section class="card cost-card"><div class="kicker">PROFIT INTELLIGENCE</div><h3 id="health">No target</h3><div class="metrics" id="metrics"></div><div id="thresholds" style="margin-top:10px"></div></section><section class="card cost-card"><div class="kicker">BEFORE YOU BUY</div><h3>Acquisition Engine</h3><p class="muted small">Analyse an auction lot or private purchase before committing capital.</p><a class="btn secondary" href="acquisition.html" style="display:inline-flex;text-decoration:none">Open Acquisition</a></section></aside></div></div>
<script src="js/nav.js?v=65"></script><script type="module">
import {loadState,saveState,money} from './js/store.js?v=26';
import {itemEconomics} from './js/profit-intelligence.js?v=2';
import {itemDisplayName} from './js/item-model.js?v=4';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),keys=['purchasePrice','buyerPremium','postage','preparationCost','repairCost','partsCost','consumables','externalService','otherCost','marketplaceFees','shippingToBuyer','labourMinutes','labourRate','minSale','targetSale','optimisticSale','actualSale','source','acquiredAt'];let state=await loadState(),itemId=params.get('item')||params.get('id')||state.currentItemId||'',item=(state.items||[]).find(row=>String(row.id)===String(itemId)),timer;
if(!item){$('itemTitle').textContent='No Item selected';$('itemMeta').textContent='Open an Item first.';throw new Error('No Item selected');}
item.commercial=item.commercial&&typeof item.commercial==='object'?item.commercial:{};state.currentItemId=item.id;$('openItem').href=`item.html?id=${encodeURIComponent(item.id)}&tab=costs`;$('openSale').href=`sales.html?item=${encodeURIComponent(item.id)}`;
function capture(){for(const key of keys)item.commercial[key]=$(key).value;item.updatedAt=new Date().toISOString();}
function paintEconomics(){capture();const x=itemEconomics(item),m=[['Cash out',money(x.direct)],['Expected cash profit',x.target?money(x.cashProfit):'—'],['After labour',x.target?money(x.profitAfterLabour):'—'],['ROI',x.target?`${Math.round(x.roi*100)}%`:'—'],['Profit / hour',x.perHour==null?'—':`${money(x.perHour)}/hr`],['Break-even',money(x.breakEven)]];$('health').textContent=x.health;$('metrics').innerHTML=m.map(([label,value])=>`<div class="metric"><span>${label}</span><strong>${value}</strong></div>`).join('');$('thresholds').innerHTML=[[20,'20% ROI',x.saleForRoi(.2)],[30,'30% ROI',x.saleForRoi(.3)],[50,'50% ROI',x.saleForRoi(.5)]].map(([,label,value])=>`<div class="threshold"><span>${label}</span><strong>${money(value)}</strong></div>`).join('');}
function paint(){const identity=item.identity||{};$('itemTitle').textContent=itemDisplayName(item);$('itemMeta').textContent=[identity.maker,identity.model,item.status].filter(Boolean).join(' · ');for(const key of keys)$(key).value=item.commercial[key]||'';paintEconomics();}
keys.forEach(key=>$(key).addEventListener('input',()=>{paintEconomics();$('saveMsg').textContent='Saving…';clearTimeout(timer);timer=setTimeout(async()=>{capture();await saveState(state);$('saveMsg').textContent='Saved';},350);}));paint();
</script></body></html>
