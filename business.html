<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cost · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=9">
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"><a class="navbtn" href="index.html">Start</a><a class="navbtn" href="workbench.html">Bench</a><a class="navbtn" href="timegrapher.html">Time</a><a class="navbtn" href="passport.html">Identity</a><a class="navbtn active" href="business.html" aria-current="page">Cost</a><a class="navbtn" href="summary.html">Sheet</a><a class="navbtn" href="inventory.html">Stock</a><a class="navbtn" href="suppliers.html">Parts</a></nav>
<div class="hero"><div><div class="kicker">THIS WATCH</div><h2 id="watchTitle">Cost and sale</h2></div></div>
<section class="card">
<div class="grid2">
<label>Purchase price<input id="purchasePrice" type="number" step="0.01"></label>
<label>Buyer premium<input id="buyerPremium" type="number" step="0.01"></label>
<label>Postage in<input id="postage" type="number" step="0.01"></label>
<label>Strap<input id="strapCost" type="number" step="0.01"></label>
<label>Battery<input id="batteryCost" type="number" step="0.01"></label>
<label>Parts<input id="partsCost" type="number" step="0.01"></label>
<label>Consumables<input id="consumables" type="number" step="0.01"></label>
<label>External service<input id="externalService" type="number" step="0.01"></label>
<label>Marketplace fees<input id="marketplaceFees" type="number" step="0.01"></label>
<label>Shipping to buyer<input id="shippingToBuyer" type="number" step="0.01"></label>
<label>Other<input id="otherCost" type="number" step="0.01"></label>
<label>Labour minutes<input id="labourMinutes" type="number" step="1"></label>
<label>Labour rate / hour<input id="labourRate" type="number" step="0.01"></label>
<label>Minimum sale<input id="minSale" type="number" step="0.01"></label>
<label>Target sale<input id="targetSale" type="number" step="0.01"></label>
<label>Sales channel<select id="channel"><option>Not listed</option><option>eBay</option><option>Etsy</option><option>Instagram</option><option>Shop</option><option>Auction</option><option>Other</option></select></label>
<label>Actual sale<input id="actualSale" type="number" step="0.01"></label>
</div>
<h3>Offers</h3>
<div id="offers"></div>
<div class="business-metrics">
<div><span>Cash out</span><strong id="investVal">$0.00</strong></div>
<div><span>Cash profit</span><strong id="cashVal">$0.00</strong></div>
<div><span>After labour</span><strong id="profitVal">$0.00</strong></div>
<div><span>ROI</span><strong id="roiVal">0%</strong></div>
</div>
<p id="warn" class="muted small"></p>
<p id="statusText" class="muted small">Loading…</p>
</section></div>
<script src="js/nav.js?v=20"></script>
<script type="module">
import { loadState, saveState, current, money, cashOut, cashProfit, profitAfterLabour, roi, salePrice } from "./js/store.js?v=22";
const $ = id => document.getElementById(id);
const keys = ["purchasePrice","buyerPremium","postage","strapCost","batteryCost","partsCost","consumables","externalService","marketplaceFees","shippingToBuyer","otherCost","labourMinutes","labourRate","minSale","targetSale","actualSale"];
let state = await loadState();
let job = current(state);
let timer;
function figure(){
  keys.forEach(k => job.business[k] = $(k).value);
  const b = job.business;
  const sale = salePrice(b);
  $("investVal").textContent = money(cashOut(b));
  $("cashVal").textContent = money(cashProfit(b));
  $("profitVal").textContent = money(profitAfterLabour(b));
  $("roiVal").textContent = Math.round(roi(b) * 100) + "%";
  const min = Number(b.minSale) || 0;
  $("warn").textContent = min && sale && sale < min ? "This price is under the minimum sale. It eats the margin." : "Cash profit ignores your time. After labour does not.";
}
function paintOffers(){
  const rows = (job.offers || []).map((o, i) => `<div class="row"><strong>${money(o.amount)}</strong><span class="muted small">${o.note || ""}</span><button class="btn secondary ox" data-i="${i}" type="button">Remove</button></div>`).join("");
  $("offers").innerHTML = rows + `<div class="row"><input id="offerAmt" inputmode="decimal" placeholder="Offer"><input id="offerNote" placeholder="Who"><button id="addOffer" class="btn secondary" type="button">Add offer</button></div>`;
  $("offers").querySelectorAll(".ox").forEach(b => b.onclick = async () => { job.offers.splice(Number(b.dataset.i), 1); await saveState(state); paintOffers(); });
  $("addOffer").onclick = async () => { const amount = $("offerAmt").value; if (!amount) return; job.offers.push({ amount, note:$("offerNote").value, at:new Date().toISOString() }); await saveState(state); paintOffers(); };
}
function paint(){ job = current(state); $("watchTitle").textContent = job.watchName; keys.forEach(k => $(k).value = job.business[k] || ""); $("channel").value = job.channel || "Not listed"; paintOffers(); figure(); $("statusText").textContent = "Ready"; }
$("channel").onchange = async () => { job.channel = $("channel").value; await saveState(state); };
keys.forEach(k => $(k).addEventListener("input", () => { figure(); clearTimeout(timer); timer = setTimeout(async () => { await saveState(state); $("statusText").textContent = "Saved"; }, 400); }));
paint();
</script></body></html>
