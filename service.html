<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Service · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=13">
<style>
.service-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:8px 0 12px}.service-top h2{margin:2px 0}.stage-list{display:flex;gap:7px;overflow:auto;padding:2px 0 8px;margin-bottom:10px}.stage-btn{min-width:142px;min-height:76px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--muted);text-align:left;padding:10px;position:relative}.stage-btn.active{border-color:var(--accent);color:var(--ink);background:var(--surface-2)}.stage-btn.done:after{content:'✓';position:absolute;right:8px;top:7px;color:var(--ok);font-weight:900}.stage-btn small{display:block;color:var(--accent);font-weight:800;margin-bottom:3px}.stage-btn strong{font-size:.75rem;line-height:1.2}.section-block{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}.section-block h3{margin:0 0 8px}.yn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.yn p{margin:0;font-size:.78rem}.yn-btns{display:flex;gap:4px}.yn-btns button{min-width:44px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted)}.yn-btns button.on{border-color:var(--accent);color:var(--accent);font-weight:800}.service-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.service-actions .danger{color:var(--danger)}.type-row{display:flex;gap:5px;flex-wrap:wrap}.type-row button.on{border-color:var(--accent);color:var(--accent)}.stage-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.parts-row{padding:8px;border:1px solid var(--line);border-radius:8px;margin:7px 0}.parts-row .grid2{margin-bottom:6px}@media(max-width:650px){.service-top{display:block}.service-top .row{margin-top:8px}.yn{grid-template-columns:1fr}.yn-btns{justify-content:flex-start}}
</style></head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Service workspace</h1></div></a></header>
<nav class="mainnav"></nav>
<div class="service-top"><div><div class="kicker">SERVICE</div><h2 id="watchTitle">Loading job…</h2><p id="stageAim" class="muted small"></p></div><div class="row"><a class="btn secondary" href="workbench.html">Workbench</a><a class="btn secondary" href="passport.html">Passport</a><a class="btn secondary" href="timegrapher.html">Timing</a></div></div>
<div id="stageList" class="stage-list"></div>
<section class="card">
<div class="row" style="justify-content:space-between;align-items:flex-start"><div><div id="stageEyebrow" class="kicker">STAGE</div><h2 id="stageTitle">Assessment</h2><div class="stage-meta"><span id="stageState" class="badge">In progress</span><span id="stageCounter" class="muted small"></span></div></div></div>
<div class="section-block" style="margin-top:8px;padding-top:0;border-top:0"><h3>Job type</h3><div id="jobTypes" class="type-row"></div></div>
<div id="steps" class="section-block"></div>
<div id="faults" class="section-block"><h3>Faults to investigate</h3><p class="muted small">Reading diagnostics…</p></div>
<div class="section-block"><h3>Bench record</h3><div class="grid2"><label>Watch name<input id="watchName"></label><label>Condition<select id="stageCondition"><option value="">Not set</option><option>Running</option><option>Running, needs a look</option><option>Stopped</option><option>Slipping wind</option><option>Damaged</option></select></label></div><label>Diagnosis<textarea id="diagnosis" rows="3"></textarea></label><label>Repair performed<textarea id="repair" rows="3"></textarea></label><label>Stage notes<textarea id="stageNotes" rows="4"></textarea></label><label>Measurement / result<input id="stageMeasure"></label></div>
<div id="parts" class="section-block"></div>
<div class="section-block"><h3>Service decision</h3><label>Service level<select id="decision"><option value="">Not decided</option><option>Leave it</option><option>Regulate only</option><option>Case, hands or crystal</option><option>Partial</option><option>Full service</option></select></label></div>
<div class="section-block"><label class="checkline"><input id="stageComplete" type="checkbox"><span>Stage complete</span></label></div>
<div class="service-actions"><button id="prevStage" class="btn secondary" type="button">Previous</button><button id="nextStage" class="btn" type="button">Next</button><button id="awaitParts" class="btn secondary" type="button">Await parts</button><button id="completeJob" class="btn" type="button">Complete job</button><button id="writeOff" class="btn secondary danger" type="button">Write off</button></div>
<p id="statusText" class="muted small">Loading…</p>
</section></div>
<script src="js/nav.js?v=60"></script>
<script type="module">
import {loadState,saveState,current,markSpares,stagesFor,JOB_TYPES,normalise,blankPart,partsCost,money,escapeHtml} from './js/store.js?v=26';
import {STAGE_COPY} from './js/stages.js?v=10';
const $=id=>document.getElementById(id),esc=escapeHtml,params=new URLSearchParams(location.search);let state=await loadState(),job,timer;
const requested=params.get('id');if(requested&&state.jobs?.some(j=>j.id===requested)){state.currentId=requested;await saveState(state);}job=current(state);
if(!job){$('watchTitle').textContent='No watch open';$('statusText').textContent='Choose a watch from Workbench.';}else init();
function init(){
 const path=()=>stagesFor(job),stage=()=>job.stages[job.stage],hint=t=>$('statusText').textContent=t;
 window.calibreWorkbench={getState:()=>state,getJob:()=>job,save:()=>saveState(state),repaint:()=>paint()};
 const stepObj=(x,i)=>typeof x==='string'?{id:String(i),text:x}:x;
 function answer(s,x,i){const o=stepObj(x,i);return s?.checks?.[o.id]??s?.checks?.[i]??'';}
 function visible(s,x,i){const o=stepObj(x,i);if(o.when){const defs=STAGE_COPY[s.name]?.steps||[],di=defs.findIndex((y,n)=>stepObj(y,n).id===o.when.id),actual=di>=0?answer(s,defs[di],di):'';if(Array.isArray(o.when.values)?!o.when.values.includes(actual):actual!==o.when.value)return false;}if(o.whenGlobal){const other=(job.stages||[]).find(z=>z.name===o.whenGlobal.stage);if(!other)return false;const defs=STAGE_COPY[other.name]?.steps||[],di=defs.findIndex((y,n)=>stepObj(y,n).id===o.whenGlobal.id),actual=di>=0?answer(other,defs[di],di):'';if(Array.isArray(o.whenGlobal.values)?!o.whenGlobal.values.includes(actual):actual!==o.whenGlobal.value)return false;}return true;}
 function done(s,key){if(s?.complete)return true;if(['Intake','Final QC'].includes(key))return false;const defs=(STAGE_COPY[key]?.steps||[]).map((x,i)=>({x,i})).filter(({x,i})=>visible(s,x,i));return defs.length>0&&defs.every(({x,i})=>['yes','no','na',true,false].includes(answer(s,x,i)));}
 function capture(){if(!job)return;job.watchName=$('watchName').value;job.diagnosis=$('diagnosis').value;job.repairPerformed=$('repair').value;const s=stage();if(!s)return;s.condition=$('stageCondition').value;s.notes=$('stageNotes').value;s.measure=$('stageMeasure').value;if(['Intake','Final QC'].includes(s.name))s.complete=$('stageComplete').checked;s.updatedAt=new Date().toISOString();}
 function schedule(){clearTimeout(timer);hint('Saving…');timer=setTimeout(async()=>{capture();await saveState(state);hint('Saved');},300);}
 function paintQuestions(s,key){const box=$('steps'),defs=STAGE_COPY[key]?.steps||[];box.innerHTML='<h3>Checks</h3>';defs.forEach((raw,i)=>{if(!visible(s,raw,i))return;const o=stepObj(raw,i),cur=answer(s,raw,i),row=document.createElement('div');row.className='yn';row.innerHTML=`<p>${esc(o.text)}</p><div class="yn-btns"></div>`;for(const [v,l] of [['yes','Yes'],['no','No'],['na','N/A']]){const b=document.createElement('button');b.type='button';b.textContent=l;if(cur===v||cur===true&&v==='yes'||cur===false&&v==='no')b.className='on';b.onclick=async()=>{capture();s.checks=s.checks||{};s.checks[o.id]=cur===v?'':v;await saveState(state);paint();hint('Answer saved');};row.querySelector('.yn-btns').appendChild(b);}box.appendChild(row);});}
 function paintParts(){const rows=(job.parts||[]).map((p,i)=>`<div class="parts-row"><div class="grid2"><label>Part<input class="pf" data-i="${i}" data-k="part" value="${esc(p.part||'')}"></label><label>Supplier<input class="pf" data-i="${i}" data-k="supplier" value="${esc(p.supplier||'')}"></label><label>Part number<input class="pf" data-i="${i}" data-k="partNumber" value="${esc(p.partNumber||'')}"></label><label>Cost<input class="pf" data-i="${i}" data-k="cost" value="${esc(p.cost||'')}"></label></div><div class="row"><label class="checkline"><input class="pf" data-i="${i}" data-k="received" type="checkbox"${p.received?' checked':''}>Received</label><label class="checkline"><input class="pf" data-i="${i}" data-k="fitted" type="checkbox"${p.fitted?' checked':''}>Fitted</label><button class="btn secondary drop-part" data-i="${i}" type="button">Remove</button></div></div>`).join('');$('parts').innerHTML=`<h3>Parts ${job.parts?.length?'· '+money(partsCost(job)):''}</h3>${rows}<button id="addPart" class="btn secondary" type="button">Add part</button>`;$('parts').querySelectorAll('.pf').forEach(el=>el.oninput=el.onchange=()=>{const p=job.parts[Number(el.dataset.i)];p[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;job.business.partsCost=job.parts.length?String(partsCost(job)):'';schedule();});$('parts').querySelectorAll('.drop-part').forEach(b=>b.onclick=async()=>{job.parts.splice(Number(b.dataset.i),1);job.business.partsCost=job.parts.length?String(partsCost(job)):'';await saveState(state);paint();});$('addPart').onclick=async()=>{job.parts.push(blankPart());await saveState(state);paint();};}
 function paint(){job=current(state)||job;if(!job)return;const names=path();job.stage=Math.max(0,Math.min(names.length-1,Number(job.stage)||0));const key=names[job.stage],s=job.stages[job.stage],copy=STAGE_COPY[key]||{title:key,aim:''};$('watchTitle').textContent=job.watchName||'Untitled watch';$('stageTitle').textContent=copy.title||key;$('stageAim').textContent=copy.aim||'';$('stageEyebrow').textContent='STAGE '+String(job.stage+1).padStart(2,'0');$('stageState').textContent=done(s,key)?'Complete':'In progress';$('stageCounter').textContent=`${job.stage+1} / ${names.length}`;$('watchName').value=job.watchName||'';$('diagnosis').value=job.diagnosis||'';$('repair').value=job.repairPerformed||'';$('stageCondition').value=s?.condition||'';$('stageNotes').value=s?.notes||'';$('stageMeasure').value=s?.measure||'';$('stageComplete').checked=!!s?.complete;$('decision').value=job.decision||'';
 const list=$('stageList');list.innerHTML='';names.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.className='stage-btn'+(i===job.stage?' active':'')+(done(job.stages[i],name)?' done':'');b.innerHTML=`<small>${String(i+1).padStart(2,'0')}</small><strong>${esc(STAGE_COPY[name]?.title||name)}</strong>`;b.onclick=async()=>{capture();job.stage=i;await saveState(state);paint();};list.appendChild(b);});
 $('jobTypes').innerHTML=JOB_TYPES.map(([id,label])=>`<button class="btn secondary${job.jobType===id?' on':''}" data-type="${id}" type="button">${esc(label)}</button>`).join('');$('jobTypes').querySelectorAll('button').forEach(b=>b.onclick=async()=>{capture();job.jobType=b.dataset.type;normalise(job);job.stage=0;await saveState(state);paint();});paintQuestions(s,key);paintParts();$('prevStage').disabled=job.stage<=0;$('nextStage').disabled=job.stage>=names.length-1;}
 ['watchName','diagnosis','repair','stageCondition','stageNotes','stageMeasure'].forEach(id=>$(id).addEventListener('input',schedule));$('stageComplete').onchange=schedule;$('decision').onchange=async()=>{capture();job.decision=$('decision').value;const old=stage()?.name;normalise(job);job.stage=Math.max(0,job.stages.findIndex(s=>s.name===old));await saveState(state);paint();};
 $('prevStage').onclick=async()=>{capture();job.stage=Math.max(0,job.stage-1);await saveState(state);paint();};$('nextStage').onclick=async()=>{capture();job.stage=Math.min(path().length-1,job.stage+1);await saveState(state);paint();};$('awaitParts').onclick=async()=>{capture();job.status='Awaiting parts';await saveState(state);hint('Job moved to Awaiting parts.');};$('completeJob').onclick=async()=>{capture();if(!confirm('Mark '+job.watchName+' ready for photos/listing?'))return;job.status='Ready for photos';job.completedAt=new Date().toISOString();job.workbenchHidden=true;await saveState(state);location.href='workbench.html';};$('writeOff').onclick=async()=>{const reason=prompt('Write-off reason',job.writeOff||'Movement retained for spares.');if(!reason)return;job.writeOff=reason;markSpares(job);job.completedAt=new Date().toISOString();job.workbenchHidden=true;await saveState(state);location.href='workbench.html';};paint();hint('Ready');
}
</script>
<script type="module" src="js/workbench-runtime.js?v=11"></script>
</body></html>
