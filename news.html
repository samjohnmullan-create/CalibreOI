<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>News · Calibre & Co.</title><link rel="stylesheet" href="css/app.css?v=12">
<style>
.newsbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.newslist{display:grid;gap:10px}.newsitem{border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--surface-2)}.newsitem.unread{border-left:4px solid #ef4444}.newsmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{font-size:.72rem;padding:3px 7px;border:1px solid var(--line);border-radius:999px}.newsitem h3{margin:7px 0 5px}.newsitem p{white-space:pre-wrap;margin:0}.empty{text-align:center;padding:30px 15px}.newslink{display:inline-block;margin-top:9px}.count{font-weight:700}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button.active{font-weight:700}.danger{color:#ef4444}.warn{color:var(--warning)}
</style>
</head><body>
<div class="shell">
<header class="brandbar"><a class="brand" href="index.html"><div class="brandmark">C&C</div><div><div class="kicker">CALIBRE & CO.</div><h1>Watchmaker's Workbench</h1></div></a></header>
<nav class="mainnav"></nav>
<div class="hero"><div><div class="kicker">CALIBRE NEWS</div><h2>Updates that need your attention</h2><p class="muted">Job research, status changes, auction finds, incoming purchases and Calibre system notes.</p></div></div>
<section class="card">
<div class="newsbar"><div><span class="count" id="unreadCount">0</span> unread</div><div class="filters" id="filters"><button class="btn secondary active" data-filter="all">All</button><button class="btn secondary" data-filter="auction">Auctions</button><button class="btn secondary" data-filter="job">Jobs</button><button class="btn secondary" data-filter="purchase">Incoming</button><button class="btn secondary" data-filter="system">System</button></div><button id="markAll" class="btn secondary" type="button">Mark all read</button><button id="refresh" class="btn secondary" type="button">Refresh</button></div>
<p id="status" class="muted small"></p>
</section>
<section class="newslist" id="newsList"><div class="card empty muted">Loading Calibre News…</div></section>
</div>
<script src="js/nav.js?v=53"></script>
<script type="module">
import { session, supabaseClient } from "./js/cloud.js?v=3";
const $=id=>document.getElementById(id);let rows=[],filter="all";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function age(iso){const d=new Date(iso),ms=Date.now()-d.getTime(),mins=Math.floor(ms/60000);if(mins<60)return mins+"m ago";const h=Math.floor(mins/60);if(h<24)return h+"h ago";const days=Math.floor(h/24);if(days<7)return days+"d ago";return d.toLocaleDateString("en-AU",{day:"numeric",month:"short"});}
function paint(){
 const list=filter==="all"?rows:rows.filter(x=>x.category===filter);
 $("unreadCount").textContent=String(rows.filter(x=>!x.read_at).length);
 if(!list.length){$("newsList").innerHTML='<div class="card empty muted">No updates in this section yet.</div>';return;}
 $("newsList").innerHTML=list.map(x=>`<article class="newsitem ${x.read_at?"":"unread"}" data-id="${x.id}"><div class="newsmeta"><span class="pill">${esc(x.category||"news")}</span><span class="muted small">${age(x.created_at)}</span>${x.source?`<span class="muted small">· ${esc(x.source)}</span>`:""}</div><h3>${esc(x.title)}</h3><p class="small">${esc(x.body)}</p>${x.source_ref?`<a class="newslink small" href="${esc(x.source_ref)}" target="_blank" rel="noopener">Open source</a>`:""}${x.read_at?"":`<div><button class="btn secondary small" data-read="${x.id}" type="button">Mark read</button></div>`}</article>`).join("");
 document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>markRead(b.dataset.read));
}
async function load(){
 const s=await session();if(!s?.user){$("status").textContent="Sign in to Calibre Cloud to see News.";rows=[];paint();return;}
 $("status").textContent="Checking for updates…";
 const {data,error}=await supabaseClient().from("calibre_news").select("id,title,body,category,severity,source,source_ref,created_at,read_at").eq("user_id",s.user.id).order("created_at",{ascending:false}).limit(200);
 if(error){$("status").textContent=error.message;return;}rows=Array.isArray(data)?data:[];$("status").textContent=rows.length?"Latest Calibre updates":"No news yet.";paint();
}
async function markRead(id){const {error}=await supabaseClient().from("calibre_news").update({read_at:new Date().toISOString()}).eq("id",id);if(!error){const x=rows.find(r=>r.id===id);if(x)x.read_at=new Date().toISOString();paint();}}
$("markAll").onclick=async()=>{const s=await session();if(!s?.user)return;const {error}=await supabaseClient().from("calibre_news").update({read_at:new Date().toISOString()}).eq("user_id",s.user.id).is("read_at",null);if(!error){rows.forEach(x=>x.read_at=x.read_at||new Date().toISOString());paint();}};
$("refresh").onclick=load;document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));paint();});
await load();
</script>
</body></html>
